<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猛禽制空</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Saira+Condensed:wght@600;800&display=swap">
<style>
  /* Layout: full-screen 3D sky; HUD canvas on top; thumb controls hug the lower corners; menus are a left-aligned briefing card */
  :root {
    --ink: #0a0f14;
    --panel: rgba(8, 14, 20, 0.72);
    --fg: #eef3f5;
    --muted: #9fb0ba;
    --line: rgba(238, 243, 245, 0.16);
    --hud: #8dffb4;             /* HUD phosphor green */
    --gold: #e3b257;            /* canopy gold, primary action */
    --warn: #ff5a4f;
    --f-display: "Saira Condensed", "Arial Narrow", "Noto Sans SC", sans-serif;
    --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --gut: 16px;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--ink); color: var(--fg);
    font-family: var(--f-body); font-size: 14px;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage, #hud, #flash { position: fixed; inset: 0; width: 100%; height: 100%; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hud { pointer-events: none; }
  #flash {
    pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 40, 30, 0.55) 100%);
  }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; touch-action: none; }
  #stick-zone { position: absolute; left: 0; top: 18%; bottom: 0; width: 46%; touch-action: none; }
  #stick-base {
    position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px;
    left: calc(110px + env(safe-area-inset-left, 0px)); top: calc(100% - 120px - env(safe-area-inset-bottom, 0px));
    border-radius: 50%; border: 1.5px solid rgba(141, 255, 180, 0.35);
    background: radial-gradient(circle, rgba(141, 255, 180, 0.08), rgba(8, 14, 20, 0.25) 70%);
    pointer-events: none;
  }
  #stick-base::before, #stick-base::after {
    content: ""; position: absolute; background: rgba(141, 255, 180, 0.22);
  }
  #stick-base::before { left: 50%; top: 14px; bottom: 14px; width: 1px; }
  #stick-base::after { top: 50%; left: 14px; right: 14px; height: 1px; }
  #stick-knob {
    position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border-radius: 50%; background: rgba(141, 255, 180, 0.28); border: 1.5px solid var(--hud);
    box-shadow: 0 0 14px rgba(141, 255, 180, 0.35);
  }
  .cluster {
    position: absolute;
    right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: repeat(3, auto); grid-template-rows: auto auto auto;
    gap: 10px; align-items: end; justify-items: center;
  }
  .tb {
    appearance: none; touch-action: none; cursor: pointer;
    font: 700 13px/1 var(--f-body); color: var(--fg); letter-spacing: 0.04em;
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(8, 14, 20, 0.45); border: 1.5px solid rgba(238, 243, 245, 0.35);
    display: grid; place-items: center;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .tb small { display: block; font: 600 10px/1.2 var(--f-mono); color: var(--muted); margin-top: 2px; }
  .tb.on { background: rgba(141, 255, 180, 0.22); border-color: var(--hud); }
  .tb.gun { width: 96px; height: 96px; font-size: 16px; border-color: rgba(255, 90, 79, 0.7); grid-column: 3; grid-row: 2 / span 2; }
  .tb.gun.on { background: rgba(255, 90, 79, 0.3); border-color: var(--warn); }
  .tb.msl { grid-column: 2; grid-row: 2; border-color: rgba(227, 178, 87, 0.75); width: 74px; height: 74px; }
  .tb.flr { grid-column: 2; grid-row: 3; }
  .tb.ab { grid-column: 3; grid-row: 1; }
  .tb.brk { grid-column: 1; grid-row: 3; width: 54px; height: 54px; font-size: 12px; }
  .tb:focus-visible, .btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  #b-pause {
    position: fixed; top: calc(96px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px));
    font: 600 11px/1 var(--f-mono); letter-spacing: 0.14em; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; cursor: pointer;
  }

  /* ---------- screens ---------- */
  .screen {
    position: fixed; inset: 0; display: flex; align-items: center;
    padding-inline: max(var(--gut), env(safe-area-inset-left, 0px)) max(var(--gut), env(safe-area-inset-right, 0px));
    padding-block: max(var(--gut), env(safe-area-inset-top, 0px)) max(var(--gut), env(safe-area-inset-bottom, 0px));
    background: linear-gradient(90deg, rgba(6, 10, 14, 0.82) 0%, rgba(6, 10, 14, 0.45) 46%, rgba(6, 10, 14, 0) 70%);
    overflow-y: auto;
  }
  .card { width: min(460px, 100%); display: grid; gap: 14px; }
  .eyebrow { margin: 0; font: 600 11px/1.4 var(--f-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
  .card h1, .card h2 {
    margin: 0; font-family: var(--f-display); font-weight: 800; line-height: 0.95; letter-spacing: 0.02em;
    text-wrap: balance;
  }
  .card h1 { font-size: clamp(44px, 9vw, 84px); }
  .card h1 em { font-style: normal; color: var(--gold); }
  .card h2 { font-size: clamp(36px, 7vw, 60px); }
  .lede { margin: 0; color: var(--muted); line-height: 1.7; max-width: 36ch; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    appearance: none; cursor: pointer; font: 700 15px/1 var(--f-body); letter-spacing: 0.08em;
    padding: 14px 26px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  .btn.primary { background: var(--gold); color: #1c1407; border-color: var(--gold); padding-inline: 36px; }
  .chip {
    appearance: none; cursor: pointer; font: 500 12px/1 var(--f-body);
    padding: 8px 11px; border: 1px solid var(--line); background: rgba(8, 14, 20, 0.5); color: var(--muted);
    display: inline-flex; gap: 6px; align-items: center;
  }
  .chip b { font: 600 12px/1 var(--f-mono); color: var(--fg); }
  .stats { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 22px; justify-content: start; }
  .stats dt { font: 600 10px/1.4 var(--f-mono); letter-spacing: 0.14em; color: var(--muted); }
  .stats dd { margin: 0; font: 600 26px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
  .help {
    display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0;
    font-size: 12px; color: var(--muted); line-height: 1.5;
  }
  .help dt { font: 600 11px/1.5 var(--f-mono); color: var(--fg); white-space: nowrap; }
  .help dd { margin: 0; min-width: 0; }
  .best { font: 600 12px/1.4 var(--f-mono); color: var(--muted); letter-spacing: 0.08em; }
  .best b { color: var(--fg); }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    background: var(--ink); color: var(--muted); font: 600 12px/1.8 var(--f-mono); letter-spacing: 0.16em;
    padding-inline: var(--gut);
  }
  #loading[hidden], .screen[hidden], #touch[hidden], #b-pause[hidden] { display: none; }
  #toast {
    position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; font-size: 12px; color: var(--fg);
    pointer-events: none; max-width: calc(100vw - 32px); text-align: center;
  }
  #toast[hidden] { display: none; }
  @media (max-height: 520px) {
    .card { gap: 10px; }
    .card h1 { font-size: clamp(40px, 8vh, 64px); }
    .help { display: none; }
    .tb { width: 56px; height: 56px; font-size: 12px; }
    .tb.gun { width: 84px; height: 84px; }
    .tb.msl { width: 64px; height: 64px; }
    .tb.brk { width: 48px; height: 48px; }
    .cluster { gap: 8px; }
    #stick-base { top: calc(100% - 100px - env(safe-area-inset-bottom, 0px)); left: calc(96px + env(safe-area-inset-left, 0px)); }
  }
  @media (max-width: 600px) and (orientation: portrait) {
    .screen { align-items: flex-end; background: linear-gradient(0deg, rgba(6, 10, 14, 0.9) 0%, rgba(6, 10, 14, 0.5) 60%, rgba(6, 10, 14, 0) 100%); }
    .stats { grid-template-columns: repeat(2, auto); }
  }
</style>

<div id="stage"></div>
<canvas id="hud"></canvas>
<div id="flash"></div>

<div id="touch" hidden>
  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
  <div class="cluster">
    <button class="tb ab" id="b-ab" type="button">加力</button>
    <button class="tb brk" id="b-brake" type="button">减速</button>
    <button class="tb msl" id="b-msl" type="button"><span>导弹<small id="msl-n">6</small></span></button>
    <button class="tb flr" id="b-flare" type="button"><span>干扰<small id="flr-n">30</small></span></button>
    <button class="tb gun" id="b-gun" type="button">机炮</button>
  </div>
</div>
<button id="b-pause" type="button" hidden>暂停</button>

<section class="screen" id="menu" hidden>
  <div class="card">
    <p class="eyebrow">F-22A Raptor · 空优作战</p>
    <h1>猛禽<em>制空</em></h1>
    <p class="lede">红方假想敌一波接一波压上来。机炮近距离咬尾，导弹锁定后发射，被导弹追上时投放干扰弹摆脱。</p>
    <div class="row">
      <button class="btn primary" id="b-start" type="button">出击</button>
      <span class="best">最高分 <b id="best">0</b></span>
    </div>
    <div class="row">
      <button class="chip" id="s-invert" type="button">俯仰 <b>上推爬升</b></button>
      <button class="chip" id="s-quality" type="button">画质 <b>高</b></button>
      <button class="chip" id="s-sound" type="button">音效 <b>开</b></button>
    </div>
    <dl class="help">
      <dt>触屏</dt><dd>左手拖动控制俯仰和滚转；右手按住机炮，点导弹、干扰弹，按住加力或减速。横屏体验最佳。</dd>
      <dt>键盘</dt><dd>W S 俯仰 · A D 滚转 · Q E 偏航 · Shift 加力 · Ctrl 减速 · 空格 机炮 · F 导弹 · X 干扰弹 · P 暂停</dd>
    </dl>
  </div>
</section>

<section class="screen" id="pause" hidden>
  <div class="card">
    <p class="eyebrow">任务暂停</p>
    <h2>保持航向</h2>
    <div class="row">
      <button class="btn primary" id="b-resume" type="button">继续</button>
      <button class="btn" id="b-restart" type="button">重新出击</button>
      <button class="btn" id="b-quit" type="button">返回机库</button>
    </div>
  </div>
</section>

<section class="screen" id="over" hidden>
  <div class="card">
    <p class="eyebrow" id="over-tag">任务结束</p>
    <h2 id="over-title">被击落</h2>
    <dl class="stats">
      <div><dt>得分</dt><dd id="o-score">0</dd></div>
      <div><dt>击落</dt><dd id="o-kills">0</dd></div>
      <div><dt>波次</dt><dd id="o-wave">1</dd></div>
      <div><dt>最高分</dt><dd id="o-best">0</dd></div>
    </dl>
    <div class="row">
      <button class="btn primary" id="b-again" type="button">再次出击</button>
      <button class="btn" id="b-home" type="button">返回机库</button>
    </div>
  </div>
</section>

<div id="toast" hidden></div>
<div id="loading">正在生成空域…</div>

<script>
  setTimeout(function () {
    if (!window.__raptorReady) {
      var el = document.getElementById('loading');
      if (el) el.textContent = '三维引擎加载失败。请检查网络连接后刷新页面。';
    }
  }, 25000);
</script>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* F-22A procedural model, shared by the viewer and the game.
   Units: metres. Frame: +x nose, +y up, +z right wing. Origin near mid-fuselage.
   Expects THREE and mergeGeometries in scope. */
const F22 = (() => {
  const S = 0.125;                        // skin texture tile = 8 m
  const D2R = Math.PI / 180;
  const GROUND = -2.46;                   // fin tip stands 5.08 m above this with gear down
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // 1-D cubic Hermite through [x, value] keys
  function curve(keys) {
    const k = [...keys].sort((a, b) => a[0] - b[0]), n = k.length;
    return x => {
      if (x <= k[0][0]) return k[0][1];
      if (x >= k[n - 1][0]) return k[n - 1][1];
      let i = 0;
      while (x > k[i + 1][0]) i++;
      const p0 = k[Math.max(i - 1, 0)], p1 = k[i], p2 = k[i + 1], p3 = k[Math.min(i + 2, n - 1)];
      const h = p2[0] - p1[0], t = (x - p1[0]) / h;
      const m1 = (p2[1] - p0[1]) / (p2[0] - p0[0]) * h, m2 = (p3[1] - p1[1]) / (p3[0] - p1[0]) * h;
      const t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * p1[1] + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * p2[1] + (t3 - t2) * m2;
    };
  }

  function gridGeometry(rings, uvFn) {
    const nR = rings.length, nP = rings[0].length;
    const pos = new Float32Array(nR * nP * 3), uv = new Float32Array(nR * nP * 2);
    for (let i = 0; i < nR; i++) {
      let arc = 0;
      for (let j = 0; j < nP; j++) {
        const p = rings[i][j];
        if (j > 0) { const q = rings[i][j - 1]; arc += Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); }
        const k = i * nP + j;
        pos[k * 3] = p[0]; pos[k * 3 + 1] = p[1]; pos[k * 3 + 2] = p[2];
        const t = uvFn ? uvFn(p, arc) : [p[0] * S, arc * S];
        uv[k * 2] = t[0]; uv[k * 2 + 1] = t[1];
      }
    }
    const idx = [];
    for (let i = 0; i < nR - 1; i++) for (let j = 0; j < nP - 1; j++) {
      const a = i * nP + j, b = a + nP;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  function capGeometry(loop, proj) {
    const c2 = loop.map(p => new THREE.Vector2(...proj(p)));
    const tris = THREE.ShapeUtils.triangulateShape(c2, []);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(loop.flat(), 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(c2.flatMap(v => [v.x * S, v.y * S]), 2));
    g.setIndex(tris.flat());
    g.computeVertexNormals();
    return g;
  }
  const mirror = rings => rings.map(r => r.map(p => [p[0], p[1], -p[2]]));

  /* ---------- fuselage tables ---------- */
  const W = curve([[9.45, 0], [9.2, 0.12], [8.6, 0.26], [8.0, 0.37], [7.0, 0.53], [6.0, 0.68], [5.0, 0.83], [4.2, 0.97],
    [3.4, 1.15], [2.6, 1.36], [1.8, 1.55], [1.0, 1.66], [0, 1.7], [-2, 1.7], [-4, 1.66], [-5.5, 1.6], [-7, 1.52],
    [-8, 1.45], [-8.6, 1.38], [-9.0, 1.3]]);
  const WL = curve([[9.45, 0], [9.2, 0.1], [8.6, 0.22], [8.0, 0.31], [7.0, 0.45], [6.0, 0.57], [5.0, 0.66], [4.0, 0.7],
    [3.0, 0.7], [1.0, 0.72], [0, 0.85], [-1, 1.15], [-2.5, 1.45], [-4, 1.5], [-6, 1.42], [-7.5, 1.3], [-8.6, 1.2], [-9, 1.12]]);
  const TOP = curve([[9.45, -0.08], [9.0, 0.08], [8.0, 0.3], [7.0, 0.48], [6.0, 0.62], [5.0, 0.72], [4.0, 0.8], [3.0, 0.88],
    [2.0, 0.95], [1.0, 0.95], [0, 0.88], [-2, 0.74], [-4, 0.64], [-6, 0.53], [-7.5, 0.46], [-8.6, 0.38], [-9.0, 0.3]]);
  const BOT = curve([[9.45, -0.1], [9.0, -0.22], [8.0, -0.42], [7.0, -0.58], [6.0, -0.72], [5.0, -0.85], [4.0, -0.98],
    [3.0, -1.1], [2.0, -1.17], [0, -1.22], [-2, -1.2], [-4, -1.12], [-6, -0.98], [-7.5, -0.82], [-8.6, -0.7], [-9.0, -0.62]]);
  const CY = curve([[9.45, -0.1], [8, -0.08], [6, -0.06], [3, -0.05], [-9, -0.05]]);
  const E1 = 2 / 2.6, E2 = 2 / 3.2;
  const YS = x => CY(x) - 0.3 * (CY(x) - BOT(x));

  function section(x, na = 12, nb = 10) {
    const w = Math.max(W(x), 0.0005), wl = Math.min(Math.max(WL(x), 0.0004), w), top = TOP(x), bot = BOT(x), cy = CY(x), ys = YS(x);
    const upper = [], lower = [[x, cy, w]];
    for (let k = 0; k <= na; k++) {
      const th = k / na * Math.PI / 2;
      upper.push([x, cy + (top - cy) * Math.pow(Math.cos(th), E1), w * Math.pow(Math.sin(th), E1)]);
    }
    for (let k = 0; k <= nb; k++) {
      const th = (1 - k / nb) * Math.PI / 2;
      lower.push([x, ys + (bot - ys) * Math.pow(Math.max(Math.cos(th), 0), E2), wl * Math.pow(Math.sin(th), E2)]);
    }
    return { upper, lower };
  }
  function upperY(x, z) {
    const w = Math.max(W(x), 1e-4), r = clamp(Math.abs(z) / w, 0, 1);
    const s = Math.pow(r, 1 / E1), c = Math.sqrt(Math.max(0, 1 - s * s));
    return CY(x) + (TOP(x) - CY(x)) * Math.pow(c, E1);
  }

  /* ---------- lifting surfaces ---------- */
  const naca = x => 0.2969 * Math.sqrt(x) - 0.126 * x - 0.3516 * x * x + 0.2843 * x ** 3 - 0.1036 * x ** 4;
  // section between chord fractions xa..xb; planform fns of span coordinate z
  function liftingRings(pl, z0, z1, xa = 0, xb = 1, n = 12, m = 22) {
    const rings = [];
    for (let k = 0; k <= n; k++) {
      const z = lerp(z0, z1, k / n), le = pl.le(z), te = pl.te(z), th = pl.th(z), yc = pl.y(z), ch = le - te, ring = [];
      const xc = j => xa + (xb - xa) * (1 - Math.cos(Math.PI * j / m)) / 2;
      for (let j = m; j >= 0; j--) { const c = xc(j); ring.push([le - ch * c, yc + 5 * th * naca(c), z]); }
      for (let j = 1; j <= m; j++) { const c = xc(j); ring.push([le - ch * c, yc - 5 * th * naca(c), z]); }
      rings.push(ring);
    }
    return rings;
  }
  const hingePoint = (pl, z, c) => [pl.le(z) - (pl.le(z) - pl.te(z)) * c, pl.y(z), z];

  const WING = {
    le: z => 1.3 - (z - 1.6) * Math.tan(42 * D2R),
    te: z => -6.2 + (z - 1.6) * Math.tan(17 * D2R),
    y: z => -0.06 - (z - 1.2) * Math.tan(3.25 * D2R),
    th: z => lerp(0.4, 0.06, (z - 1.2) / 5.58)
  };
  const STAB = {
    le: z => -6.3 - (z - 1.2) * Math.tan(42 * D2R),
    te: z => lerp(-8.9, -10.05, (z - 1.2) / 3.22),

  /* ---------- textures ---------- */
  const texCache = {};
  function skinTextures(paint, aniso) {
    if (texCache[paint]) return texCache[paint];

    const mk = () => { const c = document.createElement('canvas'); c.width = c.height = N; return [c, c.getContext('2d')]; };
    const [c, g] = mk(), [cb, gb] = mk();

    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    gb.fillStyle = '#ffffff'; gb.fillRect(0, 0, N, N);

      if (w > h) { const s = Math.round(w * (0.3 + rnd() * 0.4)); split(x, y, s, h, d + 1); split(x + s, y, w - s, h, d + 1); }

      for (const [ctx, a, lw] of [[g, 0.3, 1.6], [gb, 0.9, 2]]) {

  /* ---------- shared small parts ---------- */

  // AIM-120 AMRAAM, nose along +x, length 3.66 m

  function plumeMaterial(c1, c2, diamonds) {

      fragmentShader: `uniform float uTime, uI, uD; uniform vec3 uC1, uC2; varying vec2 vUv;

  /* ---------- build ---------- */
  function build(opt = {}) {
    const o = Object.assign({ paint: 'usaf', gear: true, cockpit: true, bay: true, lights: true, plumes: true,
      physical: true, detail: 1, anisotropy: 4, shadows: true }, opt);
    const tex = skinTextures(o.paint, o.anisotropy);

    const skinOpts = { color: o.paint === 'usaf' ? 0x7d858d : 0x8a8580, map: tex.map, bumpMap: tex.bump, bumpScale: 0.6,

        box(0.22, 0.2, 0.32, 4.05, TOP(4.05) + 0.5, 0, metal);
        box(0.6, 0.22, 0.78, 5.35, TOP(5.35) + 0.06, 0);

        const helmet = add(new THREE.SphereGeometry(0.13, 18, 14), new THREE.MeshStandardMaterial({ color: 0x2d3237, roughness: 0.5 }));
        helmet.position.set(3.98, TOP(3.98) + 0.47, 0);
        const visor = add(new THREE.SphereGeometry(0.133, 18, 10, -Math.PI / 2.4, Math.PI / 1.2, Math.PI * 0.3, Math.PI * 0.32),

        visor.position.copy(helmet.position); visor.rotation.y = Math.PI / 2;

        const oleo = add(new THREE.CylinderGeometry(0.052, 0.052, len * 0.45, 12), chrome, pivot); oleo.position.y = -len * 0.75;

}

    player.axes();
    player.speed = 230;
    player.integrate(dt);
    playerJet.pose({ pitch: 0.05, roll: Math.sin(game.t * 0.4) * 0.15, yaw: 0 });
    playerJet.setAB(0.2, game.t);

  } else if (game.mode === 'play') {

      if (game.waveClear <= 0) startWave(game.wave + 1);
    } else if (enemies.length && enemies.every(e => !e.alive || e.dying)) {

      game.score += bonus;
      player.hp = Math.min(100, player.hp + 30);
      game.ammo = 600; game.missiles = 6; game.flares = 30;
      message('空域清空', `奖励 +${bonus} · 补给完成 · 机体修复`, '#e3b257', 3);

  $('msl-n').textContent = game.missiles; $('flr-n').textContent = game.flares;

  fire.update(dt); smoke.update(dt);
  updateCamera(dt, game.mode === 'menu' ? 'menu' : (game.mode === 'dead' || game.mode === 'over') ? 'dead' : 'play');
}

/* ---------- boot ---------- */
buildTerrain();
buildClouds();
renderSettings();
applyQuality();
toMenu();
camera.position.set(player.pos.x + 30, player.pos.y + 6, player.pos.z);
clock.getDelta();
frame();
window.__raptorReady = true;
$('loading').hidden = true;
window.__raptor = { game, player, enemies: () => enemies, missiles, startGame, input, update, steer, setBasis };
</script>
</html>
