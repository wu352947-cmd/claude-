<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>灯海审核 · 拾光手帐</title>
<link rel="stylesheet" href="/fonts/lxgw/lxgw.css">
<link rel="stylesheet" href="/app/app.css">
<style>
  .adm{max-width:860px; margin:0 auto; padding:32px 16px 60px}
  .adm form{display:flex; gap:8px; margin:18px 0}
  .adm form input{flex:1; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card)}
  .tabs2{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
  .tabs2 button{padding:6px 14px; border-radius:16px; border:1px solid var(--line); background:transparent}
  .tabs2 button.on{background:var(--ink); color:var(--paper)}
  .row2{display:flex; gap:12px; align-items:center; padding:12px 14px; margin-bottom:8px; border-radius:10px; background:var(--card); box-shadow:0 0 0 1px var(--line)}
  .row2 p{flex:1; margin:0; font-family:var(--f-hand); font-size:17px; overflow-wrap:anywhere}
  .row2 small{color:var(--ink-soft); white-space:nowrap}
  .row2.done{opacity:.4}
</style>
</head>
<body>
<main class="adm">
  <p class="h-eyebrow">しんさ</p><h1 class="h-title">灯海审核</h1>
  <p class="muted">待审的灯只有作者自己看得到；被 3 人以上举报的灯会自动隐藏，等这里复核。放行后所有人可见，下架后作者也看不到。</p>
  <form id="f"><input id="tok" type="password" placeholder="ADMIN_TOKEN" autocomplete="off"><button class="btn small ink">进入</button></form>
  <div class="tabs2" id="tabs"></div>
  <div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let token = sessionStorage.getItem('sg.admin') || '', status = 'pending';
const NAMES = { pending: '待审', reported: '被举报', visible: '已放行', hidden: '已下架' };
const call = (method, path, body) => fetch(path, { method, headers: { 'x-sg': '1', 'x-admin-token': token, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined }).then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.error); return d; });
async function load() {
  try {
    const { lanterns, counts } = await call('GET', '/api/admin/lanterns?status=' + status);
    $('#tabs').innerHTML = Object.entries(NAMES).map(([k, n]) => `<button data-s="${k}" class="${k === status ? 'on' : ''}">${n} ${counts[k] || 0}</button>`).join('');
    $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { status = b.dataset.s; load(); });
    $('#list').innerHTML = lanterns.length ? lanterns.map(l => `<div class="row2" data-id="${l.id}"><p>${esc(l.text)}</p><small>${new Date(l.created_at).toLocaleString('zh-CN')}${l.reports ? ` · 举报 ${l.reports}` : ''}${l.warmth ? ` · 暖 ${l.warmth}` : ''}</small>
      ${status !== 'visible' ? '<button class="btn small" data-a="approve">放行</button>' : ''}${status !== 'hidden' ? '<button class="btn small danger" data-a="hide">下架</button>' : ''}</div>`).join('') : '<p class="muted">这里是空的。</p>';
    $('#list').querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      const row = b.closest('.row2');
      try { await call('POST', '/api/admin/lanterns/' + row.dataset.id, { action: b.dataset.a }); row.classList.add('done'); row.querySelectorAll('button').forEach(x => x.disabled = true); } catch (e) { alert(e.message); }
    });
  } catch (e) { $('#list').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
$('#f').onsubmit = e => { e.preventDefault(); token = $('#tok').value.trim(); sessionStorage.setItem('sg.admin', token); load(); };
if (token) load();
</script>
</body>
</html>
