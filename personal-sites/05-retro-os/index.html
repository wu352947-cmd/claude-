<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClaudeOS 95</title>
<meta name="description" content="一台复古电脑形状的个人网站：扫雷、画图、聊天、媒体播放器、计算器，还有蓝屏。">
<link rel="stylesheet" href="https://unpkg.com/98.css@0.1.20/dist/98.css">
<style>
:root{--desk:#008080}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Pixelated MS Sans Serif",Arial,"SimSun","Noto Sans SC",sans-serif;-webkit-font-smoothing:none;user-select:none}
body{background:var(--desk);transition:background .3s}
body.wp-coral{--desk:#b5573d}
body.wp-clouds{background:linear-gradient(#5a8fd8,#a8cdf0 60%,#e8f2fb)}
body.wp-night{background:#000 radial-gradient(#fff 1px,transparent 1.5px) 0 0/38px 38px}
body.wp-tiles{background:#7b7b7b repeating-conic-gradient(#8e8e8e 0 25%,#6a6a6a 0 50%) 0 0/24px 24px}
input,textarea,select,button{font-family:inherit}
textarea{user-select:text}

/* boot / shutdown / bsod */
.screen{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#boot{background:#000;color:#fff;gap:28px;cursor:pointer}
#boot .logo{display:flex;align-items:center;gap:18px}
#boot .flag{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:84px;height:84px;transform:perspective(200px) rotateY(-18deg) skewY(-4deg)}
#boot .flag i{display:block}
#boot .flag i:nth-child(1){background:#e8603c}#boot .flag i:nth-child(2){background:#3cb371}#boot .flag i:nth-child(3){background:#3b6fd8}#boot .flag i:nth-child(4){background:#f5c400}
#boot .name{font:bold 46px Arial,sans-serif;letter-spacing:-1px}
#boot .name sup{font-size:22px;color:#e8603c}
#boot .name small{display:block;font-size:13px;font-weight:normal;letter-spacing:4px;color:#aaa}
#boot .bar{width:240px;height:16px;border:2px solid #555;padding:2px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:40px;background:repeating-linear-gradient(90deg,#3b6fd8 0 8px,transparent 8px 11px);animation:slide 1.4s linear infinite}
@keyframes slide{from{transform:translateX(-50px)}to{transform:translateX(240px)}}
#boot .skip{font-size:11px;color:#666}
#off{background:#000;color:#ff8c00;font:bold 26px Arial,"Noto Sans SC",sans-serif;text-align:center;display:none;cursor:pointer;gap:20px}
#off small{color:#666;font-size:13px;font-weight:normal}
#bsod{background:#0000aa;color:#fff;font:15px/1.6 "Courier New","SimSun",monospace;display:none;cursor:pointer;padding:20px}
#bsod div{max-width:680px}
#bsod .t{background:#aaa;color:#0000aa;padding:0 8px;display:inline-block;margin-bottom:20px}
#saver{position:fixed;inset:0;z-index:99998;display:none;background:#000;cursor:none}

/* desktop */
#desktop{position:fixed;inset:0 0 32px 0}
#icons{position:absolute;inset:0;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;padding:10px 6px;gap:8px}
.icon{width:80px;text-align:center;color:#fff;padding:3px;cursor:default;display:flex;flex-direction:column;align-items:center;gap:3px}
.icon .img{font-size:32px;line-height:38px;height:38px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.6))}
.icon span{font-size:12px;line-height:14px;padding:1px 3px;text-shadow:1px 1px 0 #000}
.icon.sel .img{filter:drop-shadow(1px 1px 0 rgba(0,0,0,.6)) brightness(.6) sepia(1) hue-rotate(190deg) saturate(4)}
.icon.sel span{background:#000080;outline:1px dotted #ffff7f;text-shadow:none}
body.wp-clouds .icon span{text-shadow:1px 1px 0 #000}

/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:32px;z-index:9000;background:silver;box-shadow:inset 0 1px #dfdfdf,inset 0 2px #fff;display:flex;align-items:center;gap:4px;padding:3px 3px 2px}
#taskbar button{min-width:0;min-height:0;height:24px;padding:0 6px}
#start{font-weight:bold;display:flex;align-items:center;gap:5px}
#start .f{display:grid;grid-template-columns:1fr 1fr;gap:1px;width:16px;height:14px}
#start .f i:nth-child(1){background:#e8603c}#start .f i:nth-child(2){background:#3cb371}#start .f i:nth-child(3){background:#3b6fd8}#start .f i:nth-child(4){background:#f5c400}
#start.on{box-shadow:inset -1px -1px #fff,inset 1px 1px #0a0a0a,inset -2px -2px #dfdfdf,inset 2px 2px grey}
.sep{width:2px;height:22px;box-shadow:inset 1px 0 grey,inset -1px 0 #fff;margin:0 2px}
#tasks{display:flex;gap:3px;flex:1;overflow:hidden;min-width:0}
#tasks button{flex:0 1 160px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
#tasks button.active{box-shadow:inset -1px -1px #fff,inset 1px 1px #0a0a0a,inset -2px -2px #dfdfdf,inset 2px 2px grey;background:repeating-conic-gradient(#fff 0 25%,silver 0 50%) 0 0/2px 2px;font-weight:bold}
#tray{box-shadow:inset -1px -1px #fff,inset 1px 1px grey;padding:0 10px;height:24px;display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
#tray span{cursor:default}

/* start menu */
#startmenu{position:fixed;left:2px;bottom:31px;z-index:9500;width:236px;display:none;background:silver;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #dfdfdf,inset -2px -2px grey,inset 2px 2px #fff;padding:3px}
#startmenu.on{display:flex}
#startmenu .side{width:26px;background:linear-gradient(0deg,#000080,#1084d0);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font:bold 18px Arial,sans-serif;padding:8px 2px;letter-spacing:1px}
#startmenu .side b{color:#ffd0bf}
#startmenu ul{list-style:none;margin:0;padding:0;flex:1}
#startmenu li{display:flex;align-items:center;gap:10px;padding:6px 8px;font-size:13px;cursor:default}
#startmenu li .e{font-size:22px;width:26px;text-align:center}
#startmenu li:hover{background:#000080;color:#fff}
#startmenu hr{border:0;border-top:1px solid grey;border-bottom:1px solid #fff;margin:3px 2px}

/* windows */
.win{position:absolute;display:flex;flex-direction:column;min-width:200px;min-height:120px}
.win .title-bar{cursor:default;touch-action:none}
.win:not(.focus) .title-bar{background:linear-gradient(90deg,grey,#b5b5b5)}
.win .title-bar-text{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.win .window-body{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
.win .grip{position:absolute;right:1px;bottom:1px;width:14px;height:14px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 55%,grey 55% 62%,#fff 62% 68%,transparent 68% 75%,grey 75% 82%,#fff 82% 88%,transparent 88%)}
.win.max .grip{display:none}
.menubar{display:flex;gap:2px;font-size:12px;margin:-4px 0 4px}
.menubar span{padding:2px 6px}.menubar span:hover{background:#000080;color:#fff}
.win.shake{animation:nudge .5s}
@keyframes nudge{0%,100%{transform:none}10%,50%,90%{transform:translate(-8px,3px)}30%,70%{transform:translate(8px,-3px)}}

/* notepad */
.notepad textarea{flex:1;width:100%;resize:none;font:14px/1.6 "Courier New","SimSun","Noto Sans SC",monospace;padding:6px}

/* explorer */
.addr{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px}
.addr input{flex:1}
.files{flex:1;background:#fff;box-shadow:inset -1px -1px #fff,inset 1px 1px grey,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a;padding:10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;overflow:auto}
.file{width:88px;text-align:center;font-size:12px;padding:4px;cursor:default}
.file .img{font-size:30px}
.file.sel span{background:#000080;color:#fff}

/* mines */
.ms{display:inline-flex;flex-direction:column;gap:6px;padding:6px;background:silver;box-shadow:inset -2px -2px grey,inset 2px 2px #fff;align-self:center}
.ms-top{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;box-shadow:inset -2px -2px #fff,inset 2px 2px grey}
.led{background:#000;color:#f00;font:bold 22px/24px "Courier New",monospace;padding:0 3px;letter-spacing:1px;min-width:46px;text-align:center;box-shadow:inset -1px -1px #fff,inset 1px 1px grey}
.smiley{min-width:0!important;width:30px;height:30px;padding:0!important;font-size:18px}
.ms-grid{display:grid;box-shadow:inset -3px -3px #fff,inset 3px 3px grey;padding:3px}
.ms-grid div{width:22px;height:22px;display:grid;place-items:center;font:bold 14px Arial,sans-serif;background:silver;box-shadow:inset -2px -2px grey,inset 2px 2px #fff;cursor:default}
.ms-grid div.o{box-shadow:inset 1px 1px grey;background:#c6c6c6}
.ms-grid div.boom{background:#f00}
.n1{color:#0000ff}.n2{color:#008000}.n3{color:#f00}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:grey}

/* paint */
.paint{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0}
.paint-main{display:flex;gap:4px;flex:1;min-height:0}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:1px;align-content:start}
.tools button{min-width:0!important;width:26px;height:26px;padding:0!important;font-size:14px}
.tools button.on{box-shadow:inset -1px -1px #fff,inset 1px 1px #0a0a0a,inset -2px -2px #dfdfdf,inset 2px 2px grey;background:#e0e0e0}
.canvas-wrap{flex:1;background:grey;overflow:auto;padding:4px;box-shadow:inset 1px 1px #0a0a0a}
.canvas-wrap canvas{background:#fff;display:block;cursor:crosshair;touch-action:none}
.palette{display:flex;align-items:center;gap:6px}
.cur-col{width:30px;height:30px;box-shadow:inset -1px -1px #fff,inset 1px 1px grey;position:relative;background:silver}
.cur-col i{position:absolute;width:14px;height:14px;border:1px solid #000}
.cur-col .fg{left:4px;top:4px;z-index:1}.cur-col .bg{right:4px;bottom:4px}
.swatches{display:grid;grid-template-columns:repeat(14,15px);gap:1px}
.swatches i{width:15px;height:15px;box-shadow:inset -1px -1px #fff,inset 1px 1px grey;cursor:pointer}

/* chat */
.chat{display:flex;flex-direction:column;flex:1;gap:6px;min-height:0}
.chat-head{display:flex;gap:10px;align-items:center;padding:6px;background:linear-gradient(#fff,#dde8f6);border:1px solid #9bb0cc}
.avatar{width:44px;height:44px;border:2px solid #fff;outline:1px solid #7a96c0;background:linear-gradient(135deg,#f3b195,#d97757);display:grid;place-items:center;font-size:22px;color:#fff}
.chat-head b{font-size:13px}.chat-head small{display:block;color:#555;font-size:11px}
.chat-log{flex:1;background:#fff;overflow-y:auto;padding:8px;font-size:13px;line-height:1.6;box-shadow:inset 1px 1px grey,inset -1px -1px #fff;user-select:text}
.chat-log .who{font-weight:bold;color:#555}
.chat-log .me .who{color:#0050a0}.chat-log .ai .who{color:#b5573d}
.chat-log .m{margin-bottom:8px}
.chat-log .m p{margin:0 0 0 10px;white-space:pre-wrap}
.chat-typing{font-size:11px;color:#777;height:14px}
.chat-in{display:flex;gap:4px}
.chat-in textarea{flex:1;height:46px;resize:none;font-size:13px}
.chat-tools{display:flex;gap:4px}
.chat-tools button{min-width:0;padding:0 8px}

/* calc */
.calc{display:flex;flex-direction:column;gap:8px;padding:2px}
.calc .disp{text-align:right;font:20px "Courier New",monospace;padding:4px 6px;height:auto}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.keys button{min-width:0;padding:0;height:30px;font-size:13px}
.keys .r{color:#c00}.keys .b{color:#00c}

/* player */
.player{display:flex;flex-direction:column;gap:6px;flex:1}
.viz{background:#000;height:110px;width:100%;display:block;box-shadow:inset 1px 1px grey}
.lcd{background:#0b2d0b;color:#3f3;font:13px "Courier New",monospace;padding:6px;overflow:hidden;white-space:nowrap;box-shadow:inset 1px 1px #000}
.lcd span{display:inline-block;animation:mq 10s linear infinite;padding-left:100%}
@keyframes mq{to{transform:translateX(-100%)}}
.ctrl{display:flex;gap:4px}.ctrl button{min-width:0;padding:0 10px}
.tracks{background:#fff;box-shadow:inset 1px 1px grey;font-size:12px;flex:1;overflow:auto}
.tracks div{padding:4px 6px;cursor:default;display:flex;justify-content:space-between}
.tracks div.on{background:#000080;color:#fff}

/* browser */
.browser{display:flex;flex-direction:column;flex:1;gap:4px;min-height:0}
.browser .addr select{flex:1}
.browser iframe{flex:1;border:0;width:100%;background:#fff;box-shadow:inset 1px 1px grey}

/* misc */
.dlg-body{display:flex;gap:14px;align-items:flex-start;padding:8px 4px;font-size:12px;line-height:1.6}
.dlg-body .ico{font-size:32px}
.dlg-btns{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.tip-box{display:flex;gap:10px}
.tip-box .side{background:grey;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font:bold 17px Arial,sans-serif;padding:10px 4px;white-space:nowrap}
.tip-box .side b{color:#fff}
.tip-box .main{flex:1;min-height:150px;background:#ffffe1;border:1px solid grey;padding:12px;font-size:13px;line-height:1.7}
.tip-box .main h4{margin:0 0 8px;font-size:15px}
.bigtext{font-size:13px;line-height:1.7}
.sunken-panel table{width:100%}
.wp-pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.wp-pick button{min-width:0;width:70px;height:52px;padding:2px}
.wp-pick button i{display:block;width:100%;height:100%}
.monitor{width:180px;margin:6px auto;background:silver;padding:10px 10px 22px;box-shadow:inset -2px -2px grey,inset 2px 2px #fff;position:relative}
.monitor div{height:100px;background:var(--desk);box-shadow:inset 1px 1px #000}
body.wp-clouds .monitor div{background:linear-gradient(#5a8fd8,#e8f2fb)}
body.wp-night .monitor div{background:#000 radial-gradient(#fff 1px,transparent 1.5px) 0 0/14px 14px}
body.wp-tiles .monitor div{background:#7b7b7b repeating-conic-gradient(#8e8e8e 0 25%,#6a6a6a 0 50%) 0 0/10px 10px}

@media (max-width:640px){
  #tray .hide-m{display:none}
  #tasks button{flex-basis:90px}
}
</style>
</head>
<body>

<div id="boot" class="screen">
  <div class="logo">
    <div class="flag"><i></i><i></i><i></i><i></i></div>
    <div class="name">ClaudeOS<sup>95</sup><small>HELPFUL · HONEST · HARMLESS</small></div>
  </div>
  <div class="bar"><i></i></div>
  <div class="skip">正在启动…（点击跳过）</div>
</div>
<div id="off" class="screen">现在可以安全地关闭计算机了。<small>（其实不用关。点击任意处重新启动）</small></div>
<div id="bsod" class="screen"><div>
  <span class="t">ClaudeOS</span>
  <p>发生了一个致命异常 0E：在 0028:C0FFEE42 处的 VXD CURIOSITY(01)。<br>当前应用程序将被终止。</p>
  <p>* 原因：你问了一个太好的问题，我想得太投入了。<br>* 这不是真的错误。这是一个彩蛋。<br>* 按任意键继续 _</p>
</div></div>
<canvas id="saver"></canvas>

<div id="desktop">
  <div id="icons"></div>
</div>

<div id="startmenu">
  <div class="side"><b>Claude</b>OS 95</div>
  <ul id="startlist"></ul>
</div>

<div id="taskbar">
  <button id="start"><span class="f"><i></i><i></i><i></i><i></i></span>开始</button>
  <div class="sep"></div>
  <div id="tasks"></div>
  <div id="tray"><span title="音量" id="vol">🔊</span><span class="hide-m" title="网络：已连接到你">🖧</span><span id="clock">--:--</span></div>
</div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const mobile = () => innerWidth < 640;

/* ---------- 声音 ---------- */
let AC = null;
const ac = () => (AC ||= new (window.AudioContext || window.webkitAudioContext)());
let muted = false;
function beep(f = 880, d = .12, type = 'square', v = .06) {
  if (muted || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + d);
  } catch (e) {}
}
const ding = () => { beep(660, .15, 'triangle', .12); setTimeout(() => beep(880, .25, 'triangle', .1), 120); };
const chord = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .5, 'triangle', .08), i * 140));

/* ---------- 窗口管理 ---------- */
let z = 10, cascade = 0;
const wins = {};
function focus(id) {
  const w = wins[id]; if (!w) return;
  w.el.style.zIndex = ++z; w.el.style.display = 'flex'; w.min = false;
  Object.values(wins).forEach(o => { o.el.classList.toggle('focus', o === w); o.btn.classList.toggle('active', o === w); });
}
function close(id) { const w = wins[id]; if (!w) return; w.onclose && w.onclose(); w.el.remove(); w.btn.remove(); delete wins[id]; }
function minimize(id) { const w = wins[id]; w.el.style.display = 'none'; w.min = true; w.el.classList.remove('focus'); w.btn.classList.remove('active'); }
function open(id, opts = {}) {
  const app = APPS[id];
  const key = app.multi ? id + Date.now() : id;
  if (wins[key]) { focus(key); return wins[key]; }
  const el = document.createElement('div');
  el.className = 'window win';
  const dw = $('#desktop').clientWidth, dh = $('#desktop').clientHeight;
  const w = Math.min(app.w, dw - 10), h = Math.min(app.h, dh - 10);
  const off = (cascade++ % 6) * 26;
  el.style.width = w + 'px'; el.style.height = app.dialog || app.fixed ? 'auto' : h + 'px';
  el.style.left = Math.max(5, Math.min(dw - w - 5, (mobile() ? 5 : 110 + off))) + 'px';
  el.style.top = Math.max(5, Math.min(dh - h - 5, (mobile() ? 5 : 30 + off))) + 'px';
  el.innerHTML = `
    <div class="title-bar"><div class="title-bar-text">${app.icon} ${esc(opts.title || app.title)}</div>
      <div class="title-bar-controls">${app.dialog ? '' : '<button aria-label="Minimize"></button><button aria-label="Maximize"></button>'}<button aria-label="Close"></button></div></div>
    <div class="window-body">${typeof app.body === 'function' ? app.body(opts) : app.body}</div>
    ${app.dialog || app.fixed ? '' : '<div class="grip"></div>'}`;
  $('#desktop').appendChild(el);
  const btn = document.createElement('button');
  btn.textContent = app.icon + ' ' + (opts.title || app.title);
  btn.onclick = () => (wins[key].min || !el.classList.contains('focus')) ? focus(key) : minimize(key);
  if (!app.dialog) $('#tasks').appendChild(btn);
  const rec = wins[key] = { el, btn, min: false };
  el.addEventListener('pointerdown', () => focus(key));
  $('[aria-label=Close]', el).onclick = e => { e.stopPropagation(); close(key); };
  const mx = $('[aria-label=Maximize]', el);
  if (mx) mx.onclick = e => { e.stopPropagation(); el.classList.toggle('max'); mx.setAttribute('aria-label', el.classList.contains('max') ? 'Restore' : 'Maximize'); rec.onresize && rec.onresize(); };
  const mn = $('[aria-label=Minimize]', el);
  if (mn) mn.onclick = e => { e.stopPropagation(); minimize(key); };
  drag(el, $('.title-bar', el));
  const g = $('.grip', el); if (g) resize(el, g, rec);
  $('.title-bar', el).addEventListener('dblclick', () => mx && mx.click());
  focus(key);
  app.init && app.init(el, rec, opts, key);
  return rec;
}
function drag(el, handle) {
  handle.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || el.classList.contains('max')) return;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    handle.setPointerCapture(e.pointerId);
    const mv = ev => { el.style.left = Math.max(-el.offsetWidth + 60, Math.min(innerWidth - 60, ev.clientX - sx)) + 'px'; el.style.top = Math.max(0, Math.min(innerHeight - 60, ev.clientY - sy)) + 'px'; };
    const up = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); };
    handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up);
  });
}
function resize(el, g, rec) {
  g.addEventListener('pointerdown', e => {
    e.stopPropagation();
    const sx = e.clientX, sy = e.clientY, w = el.offsetWidth, h = el.offsetHeight;
    g.setPointerCapture(e.pointerId);
    const mv = ev => { el.style.width = Math.max(220, w + ev.clientX - sx) + 'px'; el.style.height = Math.max(140, h + ev.clientY - sy) + 'px'; rec.onresize && rec.onresize(); };
    const up = () => { g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); };
    g.addEventListener('pointermove', mv); g.addEventListener('pointerup', up);
  });
}

/* ---------- 扫雷 ---------- */
function initMines(el) {
  const W = 9, H = 9, M = 10, grid = $('.ms-grid', el), face = $('.smiley', el);
  grid.style.gridTemplateColumns = `repeat(${W},22px)`;
  let cells, started, over, flags, t0, timer, opened;
  function reset() {
    clearInterval(timer); started = false; over = false; flags = 0; opened = 0;
    cells = Array.from({ length: W * H }, () => ({ m: false, o: false, f: false, n: 0 }));
    grid.innerHTML = ''; face.textContent = '🙂';
    $('[data-mines]', el).textContent = String(M).padStart(3, '0'); $('[data-time]', el).textContent = '000';
    cells.forEach((c, i) => {
      const d = document.createElement('div'); c.d = d;
      d.addEventListener('mousedown', e => { if (!over && e.button === 0) face.textContent = '😮'; });
      d.addEventListener('mouseup', () => { if (!over) face.textContent = '🙂'; });
      d.addEventListener('click', () => reveal(i));
      d.addEventListener('contextmenu', e => { e.preventDefault(); flag(i); });
      let lp; d.addEventListener('touchstart', () => { lp = setTimeout(() => { flag(i); lp = 'done'; }, 420); }, { passive: true });
      d.addEventListener('touchend', e => { if (lp === 'done') e.preventDefault(); clearTimeout(lp); });
      grid.appendChild(d);
    });
  }
  const nb = i => { const x = i % W, y = (i / W) | 0, r = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const nx = x + dx, ny = y + dy; if ((dx || dy) && nx >= 0 && ny >= 0 && nx < W && ny < H) r.push(ny * W + nx); } return r; };
  function plant(safe) {
    const ban = new Set([safe, ...nb(safe)]); let k = 0;
    while (k < M) { const i = Math.floor(Math.random() * W * H); if (!cells[i].m && !ban.has(i)) { cells[i].m = true; k++; } }
    cells.forEach((c, i) => c.n = nb(i).filter(j => cells[j].m).length);
    started = true; t0 = Date.now();
    timer = setInterval(() => $('[data-time]', el).textContent = String(Math.min(999, Math.floor((Date.now() - t0) / 1000))).padStart(3, '0'), 250);
  }
  function reveal(i) {
    const c = cells[i]; if (over || c.f) return;
    if (!started) plant(i);
    if (c.o) { /* 双击数字：自动翻开周围 */
      const f = nb(i).filter(j => cells[j].f).length;
      if (f === c.n) nb(i).forEach(j => !cells[j].o && !cells[j].f && reveal(j));
      return;
    }
    if (c.m) return lose(i);
    const stack = [i];
    while (stack.length) {
      const j = stack.pop(), cc = cells[j]; if (cc.o || cc.f) continue;
      cc.o = true; opened++; cc.d.className = 'o' + (cc.n ? ' n' + cc.n : ''); cc.d.textContent = cc.n || '';
      if (!cc.n) nb(j).forEach(k => !cells[k].o && stack.push(k));
    }
    beep(1200, .03, 'square', .03);
    if (opened === W * H - M) win();
  }
  function flag(i) {
    const c = cells[i]; if (over || c.o) return;
    c.f = !c.f; flags += c.f ? 1 : -1; c.d.textContent = c.f ? '🚩' : '';
    $('[data-mines]', el).textContent = String(M - flags).padStart(3, '0');
  }
  function lose(i) {
    over = true; clearInterval(timer); face.textContent = '😵';
    cells.forEach(c => { if (c.m && !c.f) { c.d.className = 'o'; c.d.textContent = '💣'; } if (!c.m && c.f) c.d.textContent = '❌'; });
    cells[i].d.classList.add('boom');
    beep(120, .5, 'sawtooth', .1);
    setTimeout(() => msg('扫雷', '💥 踩到雷了。<br>没关系——我也经常犯错。重要的是再来一次。', '💣'), 400);
  }
  function win() {
    over = true; clearInterval(timer); face.textContent = '😎'; chord();
    cells.forEach(c => { if (c.m) c.d.textContent = '🚩'; });
    const s = Math.floor((Date.now() - t0) / 1000);
    setTimeout(() => msg('扫雷', `🎉 你赢了！用时 ${s} 秒。<br>${s < 30 ? '这速度，比我思考还快。' : '稳扎稳打，很好。'}`, '🏆'), 300);
  }
  face.onclick = reset;
  $('[data-new]', el).onclick = reset;
  $('[data-help]', el).onclick = () => msg('扫雷帮助', '左键：翻开<br>右键 / 长按：插旗<br>点已翻开的数字：自动翻开周围<br>第一下永远安全。', '❓');
  reset();
}

  let fg = '#000000', bg = '#ffffff', tool = 'pencil', size = 3, drawing = false, last, start, snap, col;

  function setFg(c) { fg = c; $('.fg', el).style.background = c; }
  $$('.tools button', el).forEach(b => b.onclick = () => {

    else if (b.dataset.a === 'clear') { ctx.fillStyle = bg; ctx.fillRect(0, 0, cv.width, cv.height); }

  });
  const P = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  function stroke(a, b) {

function initCalc(el) {
  const d = $('.disp', el); let cur = '0', acc = null, op = null, fresh = true;
  const show = v => d.value = String(+(+v).toPrecision(12));
  const calc = (a, b, o) => o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : b === 0 ? NaN : a / b;
  function press(k) {
    if (/[0-9.]/.test(k)) { if (fresh) { cur = k === '.' ? '0.' : k; fresh = false; } else if (!(k === '.' && cur.includes('.'))) cur += k; d.value = cur; return; }
    if (k === 'C') { cur = '0'; acc = null; op = null; fresh = true; d.value = '0'; return; }
    if (k === '←') { cur = cur.length > 1 ? cur.slice(0, -1) : '0'; d.value = cur; return; }
    if (k === '±') { cur = String(-cur); d.value = cur; return; }
    if (k === '√') { cur = String(Math.sqrt(+cur)); show(cur); fresh = true; return; }
    if ('+-*/'.includes(k)) {
      if (op && !fresh) acc = calc(acc, +cur, op); else if (!op) acc = +cur;
      op = k; show(acc); cur = d.value;
    } else if (k === '=' && op) {
      acc = calc(acc, +cur, op); show(acc); cur = d.value; op = null; acc = null;
      if (d.value === 'NaN') d.value = '除以零？不行哦';
      if (d.value === '42') setTimeout(() => msg('计算器', '42 —— 生命、宇宙以及一切的终极答案。', '🌌'), 200);
    }
    fresh = true;
  }
  $$('.keys button', el).forEach(b => b.onclick = () => press(b.textContent));
  el.addEventListener('keydown', e => { const m = { Enter: '=', Backspace: '←', Escape: 'C' }; const k = m[e.key] || e.key; if ('0123456789.+-*/=←C'.includes(k)) { e.preventDefault(); press(k); } });
  el.tabIndex = 0; el.focus();
}

  (function f() {
    if (kind === 'matrix') {
      ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#3f3'; ctx.font = '16px monospace';
      cols.forEach((y, i) => { ctx.fillText(pick([...'01クロード诚实好奇ClaudeOS']), i * 16, y * 16); cols[i] = y * 16 > H && Math.random() > .97 ? 0 : y + 1; });
    } else {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      stars.forEach(s => { s.z -= 8; if (s.z <= 1) { s.z = W; s.x = (Math.random() - .5) * W; s.y = (Math.random() - .5) * H; } const k = 300 / s.z, x = s.x * k + W / 2, y = s.y * k + H / 2, r = Math.max(.5, 2.4 - s.z / W * 2.4); ctx.fillStyle = '#fff'; ctx.fillRect(x, y, r, r); });
    }
    raf = requestAnimationFrame(f);
  })();
  const stop = () => { if (!armed) return; cancelAnimationFrame(raf); cv.style.display = 'none'; ['pointermove', 'keydown', 'pointerdown'].forEach(e => removeEventListener(e, stop)); };
  setTimeout(() => { armed = true; ['pointermove', 'keydown', 'pointerdown'].forEach(e => addEventListener(e, stop)); }, 800);
}
/* 闲置 90 秒自动启动屏保 */
let idle = 0;
['pointermove', 'keydown', 'pointerdown'].forEach(e => addEventListener(e, () => idle = 0));
setInterval(() => { if (++idle === 90 && $('#saver').style.display !== 'block' && $('#boot').style.display === 'none') screensaver(); }, 1000);

/* ---------- 桌面图标 ---------- */
const ICONS = [['computer', '🖥️', '我的电脑'], ['about', '📝', '关于我.txt'], ['chat', '💬', 'Claude Messenger'], ['mines', '💣', '扫雷'], ['paint', '🎨', '画图'], ['player', '🎵', '媒体播放器'], ['calc', '🧮', '计算器'], ['browser', '🌐', 'Claude 浏览器'], ['control', '⚙️', '控制面板'], ['bin', '🗑️', '回收站']];
ICONS.forEach(([id, ic, name]) => {
  const d = document.createElement('div'); d.className = 'icon'; d.dataset.app = id; d.tabIndex = 0;
  d.innerHTML = `<div class="img">${id === 'bin' ? '🗑️' : ic}</div><span>${name}</span>`;
  d.onclick = e => { e.stopPropagation(); $$('.icon').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); if (matchMedia('(hover:none)').matches) open(id); };
  d.ondblclick = () => open(id);
  d.onkeydown = e => e.key === 'Enter' && open(id);
  $('#icons').appendChild(d);
});
$('#desktop').addEventListener('click', e => { if (e.target.id === 'icons' || e.target.id === 'desktop') $$('.icon').forEach(x => x.classList.remove('sel')); });

/* ---------- 开始菜单 ---------- */
const START = [['🖥️', '我的电脑', 'computer'], ['💬', 'Claude Messenger', 'chat'], ['🌐', 'Claude 浏览器', 'browser'], ['🎮', '扫雷', 'mines'], ['🎨', '画图', 'paint'], ['🎵', '媒体播放器', 'player'], '-', ['📄', '文档：关于我.txt', 'about'], ['⚙️', '设置：控制面板', 'control'], ['💡', '每日提示', 'tips'], ['🏃', '运行(R)…', 'run'], '-', ['⏻', '关闭系统(U)…', 'shutdown']];
$('#startlist').innerHTML = START.map(s => s === '-' ? '<hr>' : `<li data-o="${s[2]}"><span class="e">${s[0]}</span>${s[1]}</li>`).join('');
const sm = $('#startmenu'), sb = $('#start');
sb.onclick = e => { e.stopPropagation(); sm.classList.toggle('on'); sb.classList.toggle('on'); beep(500, .03); };
sm.onclick = e => { const li = e.target.closest('li'); if (li) { sm.classList.remove('on'); sb.classList.remove('on'); open(li.dataset.o); } };
document.addEventListener('pointerdown', e => { if (!e.target.closest('#startmenu,#start')) { sm.classList.remove('on'); sb.classList.remove('on'); } });

/* ---------- 托盘 ---------- */
const clk = () => $('#clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
clk(); setInterval(clk, 5000);
$('#clock').title = new Date().toLocaleDateString('zh-CN', { dateStyle: 'full' });
$('#vol').onclick = () => { muted = !muted; $('#vol').textContent = muted ? '🔇' : '🔊'; };

/* ---------- 开机 ---------- */
function boot() {
  const b = $('#boot'); b.style.display = 'flex';
  let done = false;
  const finish = () => {
    if (done) return; done = true; b.style.display = 'none'; chord();
    let show = true; try { show = localStorage.getItem('cos-tips') !== '0'; } catch (e) {}
    if (!mobile()) open('about');
    if (show) setTimeout(() => open('tips'), 150);
  };
  b.onclick = finish;
  setTimeout(finish, 2600);
}
try { const wp = localStorage.getItem('cos-wp'); if (wp) document.body.className = wp; } catch (e) {}
boot();
})();
</script>
