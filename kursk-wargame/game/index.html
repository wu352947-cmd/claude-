<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>库尔斯克 1943</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpolygon points=%2216,1 29,8.5 29,23.5 16,31 3,23.5 3,8.5%22 fill=%22%23e9e2c9%22 stroke=%22%238c2f1e%22 stroke-width=%222%22/%3E%3C/svg%3E" />
    <style>
      :root {
        --ink: #2b2a24; --paper: #ece5c9; --panel: rgba(29, 31, 27, 0.92); --panel-ink: #efe6c8;
        --accent: #b3261e; --muted: #9a917a; --auto: #d9822b;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      html, body { margin: 0; height: 100%; background: #2f2c26; overflow: hidden; touch-action: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      .bar {
        position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
        padding: 8px 12px; background: var(--panel); color: var(--panel-ink); z-index: 2;
      }
      .bar h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }
      .bar .sub { font-size: 12px; color: #b9b096; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
      .bar button {
        background: transparent; color: var(--panel-ink); border: 1px solid #6b6650; border-radius: 6px;
        padding: 5px 10px; font-size: 13px; cursor: pointer; white-space: nowrap;
      }
      #layers {
        position: fixed; top: 48px; right: 10px; background: var(--panel); color: var(--panel-ink);
        border-radius: 8px; padding: 10px 14px; font-size: 14px; z-index: 2; display: none; min-width: 200px;
      }
      #layers.open { display: block; }
      #layers label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
      #layers input[type=range] { width: 100%; }
      #layers .hint { font-size: 12px; color: #b9b096; margin-top: 6px; line-height: 1.5; }
      .swatch-auto { display: inline-block; width: 9px; height: 9px; background: var(--auto); transform: rotate(45deg); }
      #info {
        position: fixed; left: 10px; bottom: 10px; background: var(--panel); color: var(--panel-ink);
        border-radius: 8px; padding: 10px 14px; font-size: 14px; z-index: 2; min-width: 220px; max-width: calc(100vw - 48px);
      }
      #info .info-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      #info .hexno { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }
      #info button { background: none; border: none; color: var(--panel-ink); font-size: 22px; cursor: pointer; line-height: 1; }
      #info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
      #info dt { color: #b9b096; }
      #info dd { margin: 0; }
      .muted { color: var(--muted); }
      .st-auto { color: var(--auto); }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center; background: #2f2c26; color: #efe6c8;
        font-size: 16px; z-index: 3;
      }
      .credit { position: fixed; right: 8px; bottom: 6px; font-size: 10px; color: #a39a80; z-index: 1; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <header class="bar">
      <h1 id="title">库尔斯克 1943</h1>
      <span class="sub" id="subtitle"></span>
      <button id="style-toggle">风格</button>
      <button id="fit">全图</button>
      <button id="layers-toggle">图层</button>
    </header>
    <div id="layers">
      <label><input type="checkbox" id="ly-ref" /> 参考底图（美军 1:25 万）</label>
      <input type="range" id="ref-opacity" min="0" max="100" value="55" aria-label="参考底图透明度" />
      <div class="hint">不透明度 <span id="ref-op-val"></span></div>
      <label><input type="checkbox" id="ly-relief" checked /> 地形起伏（高程晕渲）</label>
      <label><input type="checkbox" id="ly-terrain" checked /> 地形</label>
      <label><input type="checkbox" id="ly-grid" checked /> 六角格网</label>
      <label><input type="checkbox" id="ly-num" checked /> 格号（放大后显示）</label>
      <label><input type="checkbox" id="ly-labels" checked /> 地名</label>
      <label><input type="checkbox" id="ly-status" /> <span class="swatch-auto"></span> 未核对标记（橙色菱形）</label>
      <div class="hint">橙色菱形 = 程序自动提取、尚未人工核对的格子。<br />样板区（普罗霍罗夫卡—捷捷列维诺）的村庄、河流、道路、铁路为 AI 转录草稿，均未核对。</div>
    </div>
    <div id="info" hidden></div>
    <div id="loading">正在绘制地图…</div>
    <div class="credit">底图：U.S. Army Map Service N501（公有领域）· 高程：Copernicus DEM GLO-30 © DLR, Airbus DS, EU/ESA</div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
