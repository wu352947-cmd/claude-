<!doctype html><html><head><script type="importmap">{"imports":{"three":"../lib/three.module.min.js","three/addons/":"../lib/addons/"}}</script></head>
<body style="margin:0;background:#222"><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {CharacterModel} from '../js/character.js';
const L=new GLTFLoader();const assets={models:{}};
assets.models.soldier=await L.loadAsync('../assets/models/soldier.glb');
for(const w of ['ak47','awp','glock','m4a4']) assets.models['w_'+w]=await L.loadAsync('../assets/models/w_'+w+'.glb');
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(1280,720);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x9ab);s.add(new THREE.HemisphereLight(0xffffff,0x665544,2.5));const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(3,5,4);s.add(d);
const g=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0xccbb99}));g.rotation.x=-Math.PI/2;s.add(g);
const cfg=[['ak47',0,0,0],['ak47',0.5,0,0],['ak47',-0.4,1,0],['awp',0,0,0],['glock',0,0,0],['m4a4',0,0,1]];
const view=new URLSearchParams(location.search).get('v')||'side';
const chars=cfg.map(([w,p,c,dead],i)=>{const ch=new CharacterModel(assets,i%2?'CT':'T',s);ch.setWeapon(assets,w);ch.cfg=[p,c,dead];ch.pos=new THREE.Vector3((i-2.5)*1.6,0,0);ch.yaw=view==='side'?-Math.PI/2:(view==='front'?Math.PI:0);if(dead)ch.die(0,1,false);return ch;});
for(let f=0;f<40;f++)for(const ch of chars)ch.update(1/30,ch.pos,ch.yaw,ch.cfg[0],0,ch.cfg[1],false,false);
const cam=new THREE.PerspectiveCamera(40,16/9,0.1,100);if(new URLSearchParams(location.search).get('top')){cam.position.set(0,12,0.01);cam.lookAt(0,0,0);}else{cam.position.set(0,1.3,9);cam.lookAt(0,1,0);}
r.render(s,cam);document.title='done';
</script></body></html>
