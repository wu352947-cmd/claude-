# Nginx 反向代理示例（HTTPS 证书可用阿里云 / 腾讯云免费证书或 acme.sh 申请）
server {
  listen 80;
  server_name example.cn www.example.cn;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name example.cn www.example.cn;
  ssl_certificate     /etc/nginx/certs/example.cn.pem;
  ssl_certificate_key /etc/nginx/certs/example.cn.key;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 6m;                 # 照片上传上限 4MB，留一点余量
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;                # AI 回信最长约 60 秒
  }
}
