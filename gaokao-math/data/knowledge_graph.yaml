# 知识点图谱（ARCHITECTURE.md §3）。按人教 A 版新教材 + 高考常考题型整理。
#
# exam_weight：这个知识点平均每套卷贡献多少分。下面是初始估计（合计约 150），
#   建议把近三年你所在省份的真题逐题打标签后，用「题目分值 ÷ 标签数」累加取平均来校准。
# prereq：前置知识点。某知识点一直做不好时，系统会先检查前置是否掌握。
# methods：常用方法，录题时可以参考。

# ---------------- 集合与常用逻辑用语
- {id: set.operations, name: 集合的运算, module: 集合与常用逻辑用语, exam_weight: 4.5}
- {id: logic.condition, name: 充分必要条件, module: 集合与常用逻辑用语, exam_weight: 2, prereq: [set.operations]}
- {id: logic.quantifier, name: 全称量词与存在量词, module: 集合与常用逻辑用语, exam_weight: 1}

# ---------------- 复数
- {id: complex.arith, name: 复数的四则运算, module: 复数, exam_weight: 3.5}
- {id: complex.modulus, name: 复数的模与共轭, module: 复数, exam_weight: 1, prereq: [complex.arith]}
- {id: complex.geometry, name: 复数的几何意义, module: 复数, exam_weight: 0.5, prereq: [complex.arith]}

# ---------------- 不等式
- {id: ineq.properties, name: 不等式的性质, module: 不等式, exam_weight: 1}
