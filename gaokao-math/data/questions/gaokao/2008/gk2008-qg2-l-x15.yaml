stem: '已知 $F$ 是抛物线 $C: y^{2}=4 x$ 的焦点, 过 $F$ 且斜率为 1 的直线交 $C$ 于 $A$, B 两点. 设 $|F A|>|F B|$, 则 $|F A|$ 与 $|F B|$ 的比值等于 ______ .'
