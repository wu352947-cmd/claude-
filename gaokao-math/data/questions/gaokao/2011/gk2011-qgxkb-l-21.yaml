stem: |-
  已知函数 $f(x)=\frac{a \ln x}{x+1}+\frac{b}{x}$, 曲线 $y=f(x)$ 在点 $(1, f(1))$ 处的 切线方程为 $x+2 y-3=0$.

  (I) 求 $a 、 b$ 的值;

  （II ）如果当 $x>0$, 且 $x \neq 1$ 时, $f(x)>\frac{\ln x}{x-1}+\frac{k}{x}$, 求 $k$ 的取值范围.
