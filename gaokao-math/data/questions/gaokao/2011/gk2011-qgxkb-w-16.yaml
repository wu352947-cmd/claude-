stem: 已知两个圆锥有公共底面, 且两个圆锥的顶点和底面的圆周都在同 一个球面上, 若圆锥底面面积是这个球面面积的 $\frac{3}{16}$, 则这两个圆锥中, 体积 较小者的高与体积较大者的高的比值为 ______
answer: \frac{1}{3}
answer_kind: expr
solution: |-
  解: 不妨设球的半径为: 4; 球的表面积为: $64 \pi$, 圆锥的底面积为: $12 \pi$ , 圆锥的底面半径为: $2 \sqrt{3}$;

  由几何体的特征知球心到圆锥底面的距离, 求的半径以及圆锥底面的半径三者可

  以构成一个直角三角形

  由此可以求得球心到圆锥底面的距离是 $\sqrt{4^{2}-(2 \sqrt{3})^{2}}=2$,

  所以圆锥体积较小者的高为: 4- $2=2$, 同理可得圆锥体积较大者的高为: $4+2=6$; 所以这两个圆锥中, 体积较小者的高与体积较大者的高的比值为: $\frac{1}{3}$.

  故答案为: $\frac{1}{3}$
