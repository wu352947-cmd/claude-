stem: |-
  在平面直角坐标系 $x O y$ 中, 已知点 $A(0,-1), B$ 点在直线 $y=-3$ 上, $M$ 点满足 $\overrightarrow{M B} / / \overrightarrow{O A}, \overrightarrow{M A} \cdot \overrightarrow{A B}=\overrightarrow{M B} \cdot \overrightarrow{B A}, M$ 点的轨迹为曲线 $C$.

  (I ) 求 C 的方程;

  (II) $\mathrm{P}$ 为 $C$ 上的动点, 1 为 $C$ 在 $\mathrm{P}$ 点处的切线, 求 $\mathrm{O}$ 点到 $I$ 距离的最小值.
