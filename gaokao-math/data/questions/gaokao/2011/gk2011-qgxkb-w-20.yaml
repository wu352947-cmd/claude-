stem: |-
  在平面直角坐标系 $x O y$ 中, 曲线 $y=x^{2}-6 x+1$ 与坐标轴的交点都在 圆 C上.

  ( I ) 求圆 C 的方程;

  (II ) 若圆 $C$ 与直线 $x-y+a=0$ 交与 $A, B$ 两点, 且 $O A \perp O B$, 求 $a$ 的值.
