stem: 复数 $\frac{5 i}{1-2 i}=(\quad)$
options:
  A: $2-\mathrm{i}$
  B: $1-2 \mathrm{i}$
  C: $-2+i$
  D: $-1+2 i$
answer: C
solution: '解: $\frac{5 i}{1-2 i}=\frac{5 i(1+2 i)}{(1-2 i)(1+2 i)}=-2+i$ 故选: C.'
