stem: 复数 $\frac{2+i}{1-2 i}$ 的共轭复数是 $(\quad)$
options:
  A: $-\frac{3}{5} i$
  B: $\frac{3}{5} i$
  C: $-\mathrm{i}$
  D: i
answer: C
solution: |-
  解：复数 $\frac{2+i}{1-2 i}=\frac{(2+i)(1+2 i)}{(1-2 i)(1+2 i)}=\frac{5 i}{5}=i$, 它的共轭复数为: $-i$.

  故选: C.
