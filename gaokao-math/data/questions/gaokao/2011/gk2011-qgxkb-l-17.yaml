stem: |-
  等比数列 $\left\{a_{n}\right\}$ 的各项均为正数, 且 $2 a_{1}+3 a_{2}=1, a_{3}{ }^{2}=9 a_{2} a_{6}$,

  (I ) 求数列 $\left\{a_{n}\right\}$ 的通项公式;

  (II ) 设 $b_{n}=\log _{3} a_{1}+\log _{3} a_{2}+\ldots+\log _{3} a_{n}$, 求数列 $\left\{\frac{1}{b_{n}}\right\}$ 的前 $n$ 项和.
