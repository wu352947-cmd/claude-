difficulty_label: 基础
points: 5.0
stem: 有 3 个兴趣小组, 甲、乙两位同学各自参加其中一个小组, 每位同 学参加各个小组的可能性相同, 则这两位同学参加同一个兴趣小组的概率为 ( )
options:
  A: $\frac{1}{3}$
  B: $\frac{1}{2}$
  C: $\frac{2}{3}$
  D: $\frac{3}{4}$
answer: A
solution: |-
  解：由题意知本题是一个古典概型,

  试验发生包含的事件数是 $3 \times 3=9$ 种结果，

  满足条件的事件是这两位同学参加同一个兴趣小组,

  由于共有三个小组, 则有 3 种结果,

  根据古典概型概率公式得到 $P=\frac{3}{9}=\frac{1}{3}$,

  故选: A.
