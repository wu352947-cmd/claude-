stem: 已知矩形 $A B C D$ 的顶点都在半径为 4 的球 $O$ 的球面上, 且 $A B=6, B C=2$ $\sqrt{3}$, 则棱锥 $\mathrm{O}-\mathrm{ABCD}$ 的体积为 ______
answer: 8 \sqrt{3}
answer_kind: expr
solution: |-
  解: 矩形的对角线的长为: $\sqrt{6^{2}+(2 \sqrt{3})^{2}}=4 \sqrt{3}$, 所以球心到矩形的距 离为: $\sqrt{4^{2}-(2 \sqrt{3})^{2}}=2$,

  所以棱锥 $O-A B C D$ 的体积为: $\frac{1}{3} \times 6 \times 2 \sqrt{3} \times 2=8 \sqrt{3}$.

  故答案为: $8 \sqrt{3}$
