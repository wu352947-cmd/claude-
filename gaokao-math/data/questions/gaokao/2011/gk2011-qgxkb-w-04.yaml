stem: 椭圆 $\frac{x^{2}}{16}+\frac{y^{2}}{8}=1$ 的离心率为（）
options:
  A: $\frac{1}{3}$
  B: $\frac{1}{2}$
  C: $\frac{\sqrt{3}}{3}$
  D: $\frac{\sqrt{2}}{2}$
answer: D
solution: |-
  解: 根据椭圆的方程 $\frac{x^{2}}{16}+\frac{y^{2}}{8}=1$, 可得 $a=4, b=2 \sqrt{2}$, 则 $c=\sqrt{16-8}=2 \sqrt{2}$;

  则椭圆的离心率为 $e=\frac{c}{a}=\frac{\sqrt{2}}{2}$,

  故选：D.
