stem: |-
  某种产品的质量以其质量指标值衡量, 质量指标值越大表明质量 越好, 且质量指标值大于或等于 102 的产品为优质品, 现用两种新配方（分 别称为 $\mathrm{A}$ 配方和 $\mathrm{B}$ 配方) 做试验, 各生产了 100 件这种产品, 并测量了每件 产品的质量指标值, 得到下面试验结果:

  A 配方的频数分布表

  $$\begin{array}{|c|c|c|c|c|c|}\hline \text{指标值分组} & { [90,94) } & { [94,98) } & { [98,102) } & { [102,106) } & { [106,110] } \\ \hline \text{频数} & 8 & 20 & 42 & 22 & 8 \\ \hline \end{array}$$

  $\mathrm{B}$ 配方的频数分布表

  $$\begin{array}{|c|c|c|c|c|c|}\hline \text{指标值分组} & { [90,94) } & { [94,98) } & { [98,102) } & { [102,106) } & { [106,110] } \\ \hline \text{频数} & 4 & 12 & 42 & 32 & 10 \\ \hline \end{array}$$

  ( I ) 分别估计用 $\mathrm{A}$ 配方, $\mathrm{B}$ 配方生产的产品的优质品率;

  （II ) 已知用 B 配方生成的一件产品的利润 $\mathrm{y}$ （单位: 元）与其质量指标值 $\mathrm{t}$ 的 关系式为 $\mathrm{y}= \begin{cases}-2, & \mathrm{t}<94 \\ 2, & 94 \leqslant \mathrm{t}<102 \\ 4, & \mathrm{t} \geqslant 102\end{cases}$

  从用 $B$ 配方生产的产品中任取一件, 其利润记为 $X$ （单位: 元）, 求 $X$ 的分布列 及数学期望. (以试验结果中质量指标值落入各组的频率作为一件产品的质 量指标值落入相应组的概率)
