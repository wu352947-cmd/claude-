stem: |-
  记 $\triangle A B C$ 的内角 $A, B, C$ 的对边分别为 $a, b, c$, 已知 $\sin C \sin (A-B)=\sin B \sin (C-A)$.

  (1) 证明: $2 a^{2}=b^{2}+c^{2}$;

  (2) 若 $a=5, \cos A=\frac{25}{31}$, 求 $\triangle A B C$ 的周长.
