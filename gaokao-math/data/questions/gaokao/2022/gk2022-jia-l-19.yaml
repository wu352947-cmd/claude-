stem: |-
  甲、乙两个学校进行体育比赛, 比赛共设三个项目, 每个项目胜方得 10 分, 负方得 0 分, 没有平局. 三个项目比赛结束后, 总得分高的学校获得冠军. 已知甲学校在三个项目中 获胜的概率分别为 $0.5,0.4,0.8$, 各项目的比赛结果相互独立.

  (1) 求甲学校获得冠军的概率;

  (2) 用 $X$ 表示乙学校的总得分, 求 $X$ 的分布列与期望.
