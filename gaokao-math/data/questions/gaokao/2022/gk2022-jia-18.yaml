stem: |-
  记 $S_{n}$ 为数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和. 已知 $\frac{2 S_{n}}{n}+n=2 a_{n}+1$.

  (1) 证明: $\left\{a_{n}\right\}$ 是等差数列;

  (2) 若 $a_{4}, a_{7}, a_{9}$ 成等比数列, 求 $S_{n}$ 的最小值.
