stem: "已知数列 $\\left\\{a_{n}\\right\\}$ 各项均为正数, 其前 $n$ 项和 $S_{n}$ 满足 $a_{n} \\cdot S_{n}=9(n=1,2, \\cdots)$. 给出下列四个结论:\\\\\n$\\textcircled{1}$ $\\left\\{a_{n}\\right\\}$ 的第 2 项小于$3$;\\\\\n$\\textcircled{2}$ $\\left\\{a_{n}\\right\\}$ 为等比数列;\\\\\n$\\textcircled{3}$ $\\left\\{a_{n}\\right\\}$ 为递减数列;\\\\\n$\\textcircled{4}$ $\\left\\{a_{n}\\right\\}$ 中存在小于 $\\frac{1}{100}$ 的项.\\\\\n其中所有正确结论的序号是 ______ "
