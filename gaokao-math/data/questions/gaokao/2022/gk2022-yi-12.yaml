stem: 已知球 $O$ 的半径为 1 , 四棱锥的顶点为 $O$, 底面的四个顶点均在球 $O$ 的球面上, 则当该 四棱锥的体积最大时，其高为（)
options:
  A: $\frac{1}{3}$
  B: $\frac{1}{2}$
  C: $\frac{\sqrt{3}}{3}$
  D: $\frac{\sqrt{2}}{2}$
answer: C
solution: |-
  【详解】设该四棱锥底面为四边形 $A B C D$, 四边形 $A B C D$ 所在小圆半径为 $r$, 设四边形 $A B C D$ 对角线夹角为 $a$, 则 $S_{A B C D}=\frac{1}{2} \cdot A C \cdot B D \cdot \sin a \leq \frac{1}{2} \cdot A C \cdot B D \leq \frac{1}{2} \cdot 2 r \cdot 2 r=2 r^{2}$

  (当且仅当四边形 $A B C D$ 为正方形时等号成立) 即当四棱锥的顶点 $O$ 到底面 $A B C D$ 所在小圆距离一定时, 底面 $A B C D$ 面积最大值为 $2 r^{2}$

  又 $r^{2}+h^{2}=1$

  则 $V_{O-A B C D}=\frac{1}{3} \cdot 2 r^{2} \cdot h=\frac{\sqrt{2}}{3} \sqrt{r^{2} \cdot r^{2} \cdot 2 h^{2}} \leq \frac{\sqrt{2}}{3} \sqrt{\left(\frac{r^{2}+r^{2}+2 h^{2}}{3}\right)^{3}}=\frac{4 \sqrt{3}}{27}$

  当且仅当 $r^{2}=2 h^{2}$ 即 $h=\frac{\sqrt{3}}{3}$ 时等号成立,

  故选: C
