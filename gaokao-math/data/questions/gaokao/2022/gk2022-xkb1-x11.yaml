stem: '已知 $O$ 为坐标原点, 点 $A(1,1)$ 在抛物线 $C: x^{2}=2 p y(p>0)$ 上, 过点 $B(0,-1)$ 的直线 交 $C$ 于 $P, Q$ 两点, 则 ($\qquad$)'
options:
  A: $C$ 的准线为 $y=-1$
  B: 直线 $A B$ 与 $C$ 相切
  C: $|O P| \cdot|O Q|>|O A|^{2}$
  D: $|B P| \cdot|B Q|>|B A|^{2}$
answer:
- B
- C
- D
