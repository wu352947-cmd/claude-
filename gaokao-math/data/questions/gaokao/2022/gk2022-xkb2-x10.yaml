stem: '已知 $O$ 为坐标原点, 过抛物线 $C: y^{2}=2 p x(p>0)$ 的焦点 $F$ 的直线与 $C$ 交于 $A, B$ 两 点, 点 $A$ 在第一象限, 点 $M(p, 0)$, 若 $|A F|=|A M|$, 则 ($\quad$)'
options:
  A: 直线 $A B$ 的斜率为 $2 \sqrt{6}$
  B: $|O B|=|O F|$
  C: $|A B|>4|O F|$
  D: $\angle O A M+\angle O B M<180^{\circ}$
answer:
- A
- C
- D
