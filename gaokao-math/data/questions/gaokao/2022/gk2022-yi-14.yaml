stem: 从甲、乙等 5 名同学中随机选 3 名参加社区服务工作, 则甲、乙都人选的概率为 ______
answer: \frac{3}{10}
answer_kind: expr
solution: |-
  【详解】从 5 名同学中随机选 3 名的方法数为 $\mathrm{C}_{5}^{3}=10$

  甲、乙都人选的方法数为 $\mathrm{C}_{3}^{1}=3$, 所以甲、乙都人选的概率 $P=\frac{3}{10}$

  故答案为: $\frac{3}{10}$
