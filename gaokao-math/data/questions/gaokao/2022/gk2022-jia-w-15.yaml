stem: '记双曲线 $C: \frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}=1(a>0, b>0)$ 的离心率为 $e$, 写出满足条件“直线 $y=2 x$ 与 $C$ 无公 共点”的 $e$ 的一个值'
parts:
