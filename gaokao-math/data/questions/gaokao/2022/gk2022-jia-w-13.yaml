stem: 已知向量 $\vec{a}=(m, 3), \vec{b}=(1, m+1)$. 若 $\vec{a} \perp \vec{b}$, 则 $m=$ ______
answer: -\frac{3}{4}
answer_kind: expr
solution: |-
  【详解】由题意知: $\vec{a} \cdot \vec{b}=m+3(m+1)=0$, 解得 $m=-\frac{3}{4}$.

  故答案为: $-\frac{3}{4}$.
