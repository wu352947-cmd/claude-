stem: |-
  记 $\triangle A B C$ 的内角 $A, B, C$ 的对边分别为 $a, b, c$, 已知

  $\sin C \sin (A-B)=\sin B \sin (C-A)$

  (1) 若 $A=2 B$, 求 $C$;

  (2) 证明: $2 a^{2}=b^{2}+c^{2}$
parts:
