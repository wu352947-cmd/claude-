stem: |-
  已知函数 $f(x)=x^{3}-x, g(x)=x^{2}+a$, 曲线 $y=f(x)$ 在点 $\left(x_{1}, f\left(x_{1}\right)\right)$ 处的切线也是曲线 $y=g(x)$ 的切线.

  (1) 若 $x_{1}=-1$, 求 $a$;

  (2) 求 $a$ 的取值范围.
