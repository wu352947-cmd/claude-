stem: 从正方体的 8 个顶点中任选 4 个, 则这 4 个点在同一个平面的概率为 ______
answer: \frac{6}{35}
answer_kind: expr
solution: |-
  【详解】从正方体的 8 个顶点中任取 4 个, 有 $n=\mathrm{C}_{8}^{4}=70$ 个结果, 这 4 个点在同一个平面 的有 $m=6+6=12$ 个, 故所求概率 $P=\frac{m}{n}=\frac{12}{70}=\frac{6}{35}$.

  故答案为: $\frac{6}{35}$.
