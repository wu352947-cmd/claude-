stem: 我国南宋著名数学家秦九韶, 发现了从三角形三边求面积的公式, 他把这种方法称为 “三斜求积”, 它填补了我国传统数学的一个空白. 如果把这个方法写成公式, 就是 $S=\sqrt{\frac{1}{4}\left[c^{2} a^{2}-\left(\frac{c^{2}+a^{2}-b^{2}}{2}\right)^{2}\right]}$, 其中 $a, b, c$ 是三角形的三边, $S$ 是三角形的面积. 设 某三角形的三边 $a=\sqrt{2}, b=\sqrt{3}, c=2$, 则该三角形的面积 $S=\underline{\qquad}$
answer: \frac{\sqrt{23}}{4}
