stem: 已知向量 $\vec{a}=(2,1), \vec{b}=(-2,4)$, 则 ||$^{\prime} a-b \mid$ ()
options:
  A: '2'
  B: '3'
  C: '4'
  D: '5'
answer: D
solution: |-
  【详解】因为 $\vec{a}-\vec{b}=(2,1)-(-2,4)=(4,-3)$, 所以 $|\vec{a}-\vec{b}|=\sqrt{4^{2}+(-3)^{2}}=5$.

  故选: D
