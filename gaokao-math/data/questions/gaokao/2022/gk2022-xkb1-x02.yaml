stem: 在 $\triangle A B C$ 中, 点 $D$ 在边 $A B$ 上, $B D=2 D A$. 记 $\overrightarrow{C A}=\vec{m}, \overrightarrow{C D}=\vec{n}$, 则 $\overrightarrow{C B}=(\qquad)$
