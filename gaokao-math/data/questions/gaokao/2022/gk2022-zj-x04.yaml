stem: 为了得到函数 $y=2 \sin 3 x$ 的图象, 只要把函数 $y=2 \sin \left(3 x+\frac{\pi}{5}\right)$ 图象上所有的点 ($\qquad$)
options:
  A: 向左平移 $\frac{\pi}{5}$ 个单位长度
  B: 向右平移 $\frac{\pi}{5}$ 个单位长度
  C: 向左平移 $\frac{\pi}{15}$ 个单位长度
  D: 向右平移 $\frac{\pi}{15}$ 个单位长度
answer: D
