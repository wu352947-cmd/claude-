stem: 某社区通过公益讲座以普及社区居民的垃圾分类知识. 为了解讲座效果, 随机抽取 10 位社区居民，让他们在讲座前和讲座后各回答一份垃圾分类知识问卷，这 10 位社区居民在讲座前和讲座后问卷答题的正确率如下图:则 ()
figure: b954a6f3821bd56a.png
options:
  A: 讲座前问卷答题的正确率的中位数小于 $70 \%$
  B: 讲座后问卷答题的正确率的平均数大于 $85 \%$
  C: 讲座前问卷答题的正确率的标准差小于讲座后正确率的标准差
  D: 讲座后问卷答题的正确率的极差大于讲座前正确率的极差
answer: B
solution: 【详解】讲座前中位数为 $\frac{70 \%+75 \%}{2}>70 \%$, 所以 $\mathrm{A}$ 错;讲座后问卷答题的正确率只有一个是 $80 \%, 4$ 个 $85 \%$, 剩下全部大于等于 $90 \%$, 所以讲座后问卷答题的正确率的平均数大于 $85 \%$, 所以 $\mathrm{B}$ 对;讲座前问卷答题的正确率更加分散,所以讲座前问卷答题的正确率的标准差大于讲座后正确率的标准差,所以 $\mathrm{C}$ 错;讲座后问卷答题的正确率的极差为 $100 \%-80 \%=20 \%$,讲座前问卷答题的正确率的极差为 $95 \%-60 \%=35 \%>20 \%$, 所以 $D$ 错.故选:B.
