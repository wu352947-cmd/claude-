stem: 设集合 $A=\{-2,-1,0,1,2\}, B=\left\{x \mid 0 \leq x<\frac{5}{2}\right\}$, 则 $A \cap B=()$
options:
  A: $\{0,1,2\}$
  B: $\{-2,-1,0\}$
  C: $\{0,1\}$
  D: $\{1,2\}$
answer: A
solution: |-
  【详解】因为 $A=\{-2,-1,0,1,2\}, B=\left\{x \mid 0 \leq x<\frac{5}{2}\right\}$, 所以 $A \cap B=\{0,1,2\}$.

  故选: A.
