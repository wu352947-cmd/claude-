stem: 设全集 $U=\{-2,-1,0,1,2,3\}$, 集合 $A=\{-1,2\}, B=\left\{x \mid x^{2}-4 x+3=0\right\}$, 则 $\complement_{U}(A \cup B)=()$
options:
  A: $\{1,3\}$
  B: $\{0,3\}$
  C: $\{-2,1\}$
  D: $\{-2,0\}$
answer: D
solution: |-
  【详解】由题意, $B=\left\{x \mid x^{2}-4 x+3=0\right\}=\{1,3\}$, 所以 $A \cup B=\{-1,1,2,3\}$,

  所以 $\complement_{U}(A \cup B)=\{-2,0\}$.

  故选: D.
