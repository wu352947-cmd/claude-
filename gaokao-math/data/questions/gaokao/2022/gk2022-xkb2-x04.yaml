stem: 角 $\alpha, \beta$ 满足 $\sin (\alpha+\beta)+\cos (\alpha+\beta)=2 \sqrt{2} \cos \left(\alpha+\frac{\pi}{4}\right) \sin \beta$, 则 ($\quad$)
