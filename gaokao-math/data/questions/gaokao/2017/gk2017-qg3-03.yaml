stem: '某城市为了解游客人数的变化规律, 提高旅游服务质量, 收集并整理了 2014 年 1 月至 2016 年 12 月期间月接待游客量（单位: 万人) 的数据,绘制了下面的折线图.根据该折线图，下列结论错误的是（）'
figure: eb85bd6e745d51ce.png
options:
  A: 月接待游客量逐月增加
  B: 年接待游客量逐年增加
  C: 各年的月接待游客量高峰期大致在 7,8 月
  D: 各年 1 月至 6 月的月接待游客量相对于 7 月至 12 月, 波动性更小, 变化比较平稳
answer: A
solution: '解: 由已有中 2014 年 1 月至 2016 年 12 月期间月接待游客量 (单位:万人) 的数据可得:月接待游客量逐月有增有减, 故 $\mathrm{A}$ 错误;年接待游客量逐年增加, 故 B 正确;各年的月接待游客量高峰期大致在 7,8 月, 故 C 正确;各年 1 月至 6 月的月接待游客量相对于 7 月至 12 月，波动性更小，变化比较平稳, 故 D 正确;故选: A.'
