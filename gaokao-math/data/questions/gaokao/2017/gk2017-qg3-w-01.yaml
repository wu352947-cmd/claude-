stem: 已知集合 $A=\{1,2,3,4\}, B=\{2,4,6,8\}$, 则 $A \cap B$ 中元素的个 数为 ( )
options:
  A: '1'
  B: '2'
  C: '3'
  D: '4'
answer: B
solution: |-
  解: $\because$ 集合 $A=\{1,2,3,4\}, B=\{2,4,6,8\}$,

  $\therefore A \cap B=\{2,4\}$

  $\therefore A \cap B$ 中元素的个数为 2 .

  故选: B.
