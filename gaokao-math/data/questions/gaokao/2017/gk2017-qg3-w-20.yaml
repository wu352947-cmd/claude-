stem: |-
  在直角坐标系 $x O y$ 中, 曲线 $y=x^{2}+m x-2$ 与 $x$ 轴交于 $A 、 B$ 两点, 点 $\mathrm{C}$ 的坐标为 $(0,1)$, 当 $\mathrm{m}$ 变化时, 解答下列问题:
  （1）能否出现 $A C \perp B C$ 的情况? 说明理由;
  (2) 证明过 $A 、 B 、 C$ 三点的圆在 $y$ 轴上截得的弦长为定值.
