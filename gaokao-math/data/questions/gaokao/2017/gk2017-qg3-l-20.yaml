stem: |-
  已知抛物线 $C: y^{2}=2 x$, 过点 $(2,0)$ 的直线।交 $C$ 于 $A, B$ 两点, 圆 $M$ 是以线段 $A B$ 为直径的圆.

  (1) 证明：坐标原点 $O$ 在圆 $M$ 上;

  (2) 设圆 $M$ 过点 $P(4,-2)$, 求直线 $।$ 与圆 $M$ 的方程.
