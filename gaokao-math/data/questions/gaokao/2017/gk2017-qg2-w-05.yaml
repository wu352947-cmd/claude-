stem: 若 $a>1$, 则双曲线 $\frac{x^{2}}{a^{2}}-y^{2}=1$ 的离心率的取值范围是（ ）
options:
  A: $(\sqrt{2},+\infty)$
  B: $(\sqrt{2}, 2)$
  C: $(1, \sqrt{2})$
  D: $(1,2)$
answer: C
solution: |-
  解 $a>1$, 则双曲线 $\frac{x^{2}}{a^{2}}-y^{2}=1$ 的离心率为 $\frac{c}{a}=\frac{\sqrt{1+a^{2}}}{a}=\sqrt{1+\frac{1}{a^{2}}} \in(1, \sqrt{2}$ ).

  故选: C.
