difficulty_label: 中档
stem: |-
  某超市计划按月订购一种酸奶，每天进货量相同，进货成本每瓶 4 元，售价每瓶 6 元，末售出的酸奶降价处理，以每瓶 2 元的价格当天全部处 理完. 根据往年销售经验, 每天需求量与当天最高气温 (单位: $\left.{ }^{\circ} \mathrm{C}\right)$ 有关. 如 果最高气温不低于 25 ， 需求量为 500 瓶；如果最高气温位于区间[20，25), 需求量为 300 瓶; 如果最高气温低于 20 , 需求量为 200 瓶. 为了确定六月份 的订购计划, 统计了前三年六月份各天的最高气温数据, 得下面的频数分布 表:

  $$\begin{array}{|c|c|c|c|c|c|c|}\hline \text{最高气温} & { [10,15) } & { [15,20) } & { [20,25) } & { [25,30) } & { [30,35) } & { [35,40) } \\ \hline \text{天数} & 2 & 16 & 36 & 25 & 7 & 4 \\ \hline \end{array}$$

  以最高气温位于各区间的频率估计最高气温位于该区间的概率.

  (1) 求六月份这种酸奶一天的需求量不超过 300 瓶的概率;

  （2）设六月份一天销售这种酸奶的利润为 $Y$ (单位：元)，当六月份这种酸奶一 天的进货量为 450 瓶时, 写出 $Y$ 的所有可能值, 并估计 $Y$ 大于零的概率.
