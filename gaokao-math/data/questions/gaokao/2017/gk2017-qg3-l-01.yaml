stem: 已知集合 $A=\left\{(x, y) \mid x^{2}+y^{2}=1\right\}, B=\{(x, y) \mid y=x\}$, 则 $A \cap B$ 中元 素的个数为 $(\quad)$
options:
  A: '3'
  B: '2'
  C: '1'
  D: '0'
answer: B
solution: |-
  解: 由 $\left\{\begin{array}{l}x^{2}+y^{2}=1 \\ y=x\end{array}\right.$, 解得: $\left\{\begin{array}{l}x=\frac{\sqrt{2}}{2} \\ y=\frac{\sqrt{2}}{2}\end{array}\right.$ 或 $\left\{\begin{array}{c}x=-\frac{\sqrt{2}}{2} \\ y=\frac{\sqrt{2}}{2}\end{array}\right.$,

  $\therefore A \cap B$ 的元素的个数是 2 个,

  故选: B.
