stem: 曲线 $y=x^{2}+\frac{1}{x}$ 在点 $(1,2)$ 处的切线方程为 ______
answer: x-y+1=0
answer_kind: equation
solution: |-
  解: 曲线 $y=x^{2}+\frac{1}{x}$, 可得 $y^{\prime}=2 x-\frac{1}{x^{2}}$,

  切线的斜率为: $k=2-1=1$.

  切线方程为: $y-2=x-1$, 即: $x-y+1=0$.

  故答案为: $x-y+1=0$.
