stem: |-
  设数列 $\left\{a_{n}\right\}$ 满足 $a_{1}+3 a_{2}+\ldots+(2 n-1) a_{n}=2 n$.
  (1) 求 $\left\{a_{n}\right\}$ 的通项公式;
  (2) 求数列 $\left\{\frac{a_{n}}{2 n+1}\right\}$ 的前 $n$ 项和.
