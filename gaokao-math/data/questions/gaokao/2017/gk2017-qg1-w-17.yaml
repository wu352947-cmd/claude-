stem: |-
  记 $S_{n}$ 为等比数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和. 已知 $S_{2}=2, S_{3}=-6$.

  （1）求 $\left\{a_{n}\right\}$ 的通项公式;

  (2) 求 $S_{n}$, 并判断 $S_{n+1}, S_{n}, S_{n+2}$ 是否成等差数列.
