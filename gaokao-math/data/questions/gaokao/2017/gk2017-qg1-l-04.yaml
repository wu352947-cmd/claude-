stem: 记 $S_{n}$ 为等差数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和. 若 $a_{4}+a_{5}=24, S_{6}=48$, 则 $\left\{a_{n}\right\}$ 的公 差为 $(\quad)$
options:
  A: '1'
  B: '2'
  C: '4'
  D: '8'
answer: C
solution: |-
  解: $\because S_{n}$ 为等差数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和, $a_{4}+a_{5}=24, S_{6}=48$, $\therefore\left\{\begin{array}{l}a_{1}+3 d+a_{1}+4 d=24 \\ 6 a_{1}+\frac{6 \times 5}{2} d=48\end{array}\right.$,

  解得 $\mathrm{a}_{1}=-2, \mathrm{d}=4$,

  $\therefore\left\{a_{n}\right\}$ 的公差为 4 .

  故选: C.
