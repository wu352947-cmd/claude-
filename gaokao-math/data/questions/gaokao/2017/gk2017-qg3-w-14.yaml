stem: 双曲线 $\frac{x^{2}}{a^{2}}-\frac{y^{2}}{9}=1(a>0)$ 的一条渐近线方程为 $y=\frac{3}{5} x$, 则 $a=$ ______
answer: '5'
answer_kind: expr
solution: |-
  解: 双曲线 $\frac{x^{2}}{a^{2}}-\frac{y^{2}}{9}=1(a>0)$ 的一条渐近线方程为 $y=\frac{3}{5} x$, 可得 $\frac{3}{a}=\frac{3}{5}$, 解得 $a=5$.

  故答案为: 5 .
