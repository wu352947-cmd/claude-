stem: |-
  已知函数 $f(x)=a e^{2 x+}(a-2) e^{x}-x$.

  （1）讨论 $f(x)$ 的单调性;

  (2) 若 $f(x)$ 有两个零点, 求 $a$ 的取值范围.
