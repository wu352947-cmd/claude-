stem: 下列各式的运算结果为纯虚数的是（ ）
options:
  A: $i(1+i)^{2}$
  B: $i^{2}(1-i)$
  C: $(1+\mathrm{i})^{2}$
  D: $i(1+i)$
answer: C
solution: |-
  解: A. $i(1+i)^{2}=i \cdot 2 i=-2$, 是实数.

  B. $i^{2}(1-i)=-1+i$, 不是纯虚数.

  C. $(1+i)^{2}=2 i$ 为纯虚数.

  D. $i(1+i)=i-1$ 不是纯虚数.

  故选: C.
