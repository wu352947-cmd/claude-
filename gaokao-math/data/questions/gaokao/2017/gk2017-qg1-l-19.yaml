stem: |-
  为了监控某种零件的一条生产线的生产过程, 检验员每天从该生 产线上随机抽取 16 个零件, 并测量其尺寸（单位 $\mathrm{cm}$ ）. 根据长期生产经验 ，可以认为这条生产线正常状态下生产的零件的尺寸服从正态分布 $N\left(\mu, \sigma^{2}\right.$ ) .

  （1）假设生产状态正常, 记 $X$ 表示一天内抽取的 16 个零件中其尺寸在（ $\mu-3 \sigma$ $, \mu+3 \sigma)$ 之外的零件数, 求 $P(X \geqslant 1)$ 及 $X$ 的数学期望;

  （2）一天内抽检零件中, 如果出现了尺寸在（ $\mu-3 \sigma, \mu+3 \sigma)$ 之外的零件, 就 认为这条生产线在这一天的生产过程可能出现了异常情况, 需对当天的生产 过程进行检查.

  （i ）试说明上述监控生产过程方法的合理性;

  (ii ) 下面是检验员在一天内抽取的 16 个零件的尺寸:

  $$\begin{array}{|c|c|c|c|c|c|c|c|}\hline 9.95 & 10.12 & 9.96 & 9.96 & 10.01 & 9.92 & 9.98 & 10.04 \\ \hline 10.26 & 9.91 & 10.13 & 10.02 & 9.22 & 10.04 & 10.05 & 9.95 \\ \hline \end{array}$$

  经计算得 $\bar{x}=\frac{1}{16} \sum_{i=1}^{16} x_{i}=9.97, s=\sqrt{\frac{1}{16} \sum_{i=1}^{16}\left(x_{i}-\bar{x}\right)^{2}}=\sqrt{\frac{1}{16}\left(\sum_{i=1}^{16} x_{i}{ }^{2}-16 \bar{x}^{2}\right)} \approx 0.212$, 其中 $x_{i}$ 为抽取的第 $i$ 个零件的尺寸, $i=1,2, \ldots, 16$.

  用样本平均数 $\bar{x}$ 作为 $\mu$ 的估计值 $\mu$, 用样本标准差 $s$ 作为 $\sigma$ 的估计值 $\sigma$, 利用估 计值判断是否需对当天的生产过程进行检查？剔除 $(\mu-3 \sigma, \mu+3 \sigma)$ 之 外的数据, 用剩下的数据估计 $\mu$ 和 $\sigma$ （精确到 0.01 ）.

  附: 若随机变量 $Z$ 服从正态分布 $N\left(\mu, \sigma^{2}\right)$, 则 $P(\mu-3 \sigma<Z<\mu+3 \sigma)=0.9974$, $0.9974^{16} \approx 0.9592, \sqrt{0.008} \approx 0.09$
