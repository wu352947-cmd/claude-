solution: |-
  解：（1）由题可知尺寸落在 $(\mu-3 \sigma, \mu+3 \sigma)$ 之内的概率为 0.9974 ,

  则落在 $(\mu-3 \sigma, \mu+3 \sigma)$ 之外的概率为 $1-0.9974=0.0026$,

  因为 $P(X=0)=C_{16}^{0} \times(1-0.9974){ }^{0} \times 0.9974^{16} \approx 0.9592$,

  所以 $P(X \geqslant 1)=1-P(X=0)=0.0408$,

  又因为 $X \sim B(16,0.0026)$,

  所以 $E(X)=16 \times 0.0026=0.0416$;

  （2）（i ) 如果生产状态正常, 一个零件尺寸在 $(\mu-3 \sigma, \mu+3 \sigma)$ 之外的 概率只有 0.0026 , 一天内抽取的 16 个零件中, 出现尺寸在 $\left(\mu-3 \sigma, \mu^{-} \mu^{+3}\right.$ G）之外的零件的概率只有 0.0408 , 发生的概率很小. 因此一旦发生这种状 况, 就有理由认为这条生产线在这一天的生产过程可能出现了异常情况, 需 对当天的生产过程进行检查，可见上述监控生产过程的方法是合理的.

  (ii) 由 $\bar{x}=9.97, s \approx 0.212$, 得 $\mu$ 的估计值为 $\mu=9.97, \sigma$ 的估计值为 $\sigma=0.212$, 由样本数据可以看出一个

  零件的尺寸在 $(\mu-3 \sigma, \mu+3 \sigma)$ 之外, 因此需对当天的生产过程进行检查.

  剔除 $(\mu-3 \sigma, \mu+3 \sigma ）$ 之外的数据 9.22 , 剩下的数据的平均数为 $\frac{1}{15}(16 \times 9.97-9.22)=10.02$

  因此 $\mu$ 的估计值为 10.02 .

  $\sum_{i=1}^{16} x_{i}^{2}=16 \times 0.212^{2}+16 \times 9.97^{2} \approx 1591.134$

  剔除 $(\mu-3 \sigma, \mu+3 \sigma)$ 之外的数据 9.22 , 剩下的数据的样本方差为 $\frac{1}{15}\left(1591.134-9.22^{2}-15 \times 10.02^{2}\right) \approx 0.008$,

  因此 $\sigma$ 的估计值为 $\sqrt{0.008} \approx 0.09$.
