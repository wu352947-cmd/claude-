stem: 在矩形 $A B C D$ 中, $A B=1, A D=2$, 动点 $P$ 在以点 $C$ 为圆心且与 $B D$ 相 切的圆上. 若 $\overrightarrow{\mathrm{AP}}=\lambda \overrightarrow{\mathrm{AB}}+\mu \overrightarrow{\mathrm{AD}}$, 则 $\lambda+\mu$ 的最大值为 ($\qquad$)
