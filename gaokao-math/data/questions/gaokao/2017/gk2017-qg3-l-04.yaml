stem: $(\mathrm{x}+\mathrm{y})(2 \mathrm{x}-\mathrm{y})^{5}$ 的展开式中的 $x^{3} \mathrm{y}^{3}$ 系数为 $(\quad)$
options:
  A: '-80'
  B: '-40'
  C: '40'
  D: '80'
answer: C
solution: |-
  解: $(2 x-y)^{5}$ 的展开式的通项公式: $T_{r+1}=\left[_{5}^{r}(2 x)^{5-r}(-y)^{r}=2^{5-r}\right.$ $(-1){ }^{r}\left[{ }_{5}^{r} x^{5-r} y\right.$

  令 $5-r=2, r=3$, 解得 $r=3$.

  令 $5-r=3, r=2$, 解得 $r=2$.

  $\therefore(x+y)(2 x-y)^{5}$ 的展开式中的 $x^{3} y^{3}$ 系数 $=2^{2} \times(-1)^{3}\left[_{5}^{3}+2^{3} \times 1 \times\left[_{5}^{2}=40\right.\right.$. 故选: C.
