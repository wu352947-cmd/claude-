stem: |-
  设 $O$ 为坐标原点, 动点 $M$ 在椭圆 $C: \frac{x^{2}}{2}+y^{2}=1$ 上, 过 $M$ 作 $x$ 轴的 垂线, 垂足为 $N$, 点 $P$ 满足 $\overrightarrow{\mathrm{NP}}=\sqrt{2} \overrightarrow{\mathrm{NM}}$.

  (1) 求点 $P$ 的轨迹方程;

  （2）设点 $Q$ 在直线 $x=-3$ 上, 且 $\overrightarrow{\mathrm{OP}} \bullet \overrightarrow{\mathrm{PQ}}=1$. 证明: 过点 $P$ 且垂直于 $\mathrm{OQ}$ 的直线 $\mid$ 过 $C$ 的左焦点 $F$.
