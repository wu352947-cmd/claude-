answer: C
solution: '解: 函数 $\mathrm{y}=\frac{\sin 2 \mathrm{x}}{1-\cos \mathrm{x}}$,可知函数是奇函数, 排除选项 $\mathrm{B}$,当 $x=\frac{\pi}{3}$ 时, $f\left(\frac{\pi}{3}\right)=\frac{\frac{\sqrt{3}}{2}}{1-\frac{1}{2}}=\sqrt{3}$, 排除 $A$, $x=\pi$ 时, $f(\pi)=0$, 排除 $D$.故选: C.'
