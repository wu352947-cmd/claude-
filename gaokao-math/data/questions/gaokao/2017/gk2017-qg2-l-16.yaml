stem: '已知 $F$ 是抛物线 $C: y^{2}=8 x$ 的焦点, $M$ 是 $C$ 上一点, $F M$ 的延长线交 $y$ 轴于点 $N$. 若 $M$ 为 $F N$ 的中点, 则 $|F N|=$ ______'
answer: '6'
answer_kind: expr
solution: |-
  解: 抛物线 $C: y^{2}=8 x$ 的焦点 $F(2,0), M$ 是 $C$ 上一点, $F M$ 的延长线

  交 $y$ 轴于点 $N$. 若 $M$ 为 $F N$ 的中点,

  可知 $M$ 的横坐标为: 1 , 则 $M$ 的纵坐标为: $\pm 2 \sqrt{2}$,

  $|\mathrm{FN}|=2|\mathrm{FM}|=2 \sqrt{(1-2)^{2}+( \pm 2 \sqrt{2}-0)^{2}}=6$. 故答案为: 6 .
