stem: 已知向量 $\vec{a}=(-2,3), \vec{b}=(3, m)$, 且 $\vec{a} \perp \vec{b}$, 则 $m=$ ______
answer: '2'
answer_kind: expr
solution: |-
  解: $\because$ 向量 $\vec{a}=(-2,3), \vec{b}=(3, m)$, 且 $\vec{a} \perp \vec{b}$, $\therefore \vec{a} \cdot \vec{b}=-6+3 m=0$

  解得 $m=2$.

  故答案为: 2 .
