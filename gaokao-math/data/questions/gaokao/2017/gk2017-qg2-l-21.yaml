stem: |-
  已知函数 $f(x)=a x^{2}-a x-x \ln x$, 且 $f(x) \geqslant 0$.

  (1) 求 $a$;

  (2) 证明: $f(x)$ 存在唯一的极大值点 $x_{0}$, 且 $e^{-2}<f\left(x_{0}\right)<2^{-2}$.
