stem: |-
  设函数 $f(x)=\left(1-x^{2}\right) e^{x}$.

  （1）讨论 $f(x)$ 的单调性;

  （2）当 $x \geqslant 0$ 时, $f(x) \leqslant a x+1$, 求 $a$ 的取值范围.
