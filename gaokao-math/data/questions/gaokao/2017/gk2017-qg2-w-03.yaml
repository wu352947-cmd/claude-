stem: 函数 $f(x)=\sin \left(2 x+\frac{\pi}{3}\right)$ 的最小正周期为（ $)$
options:
  A: $4 \pi$
  B: $2 \pi$
  C: $\pi$
  D: $\frac{\pi}{2}$
answer: C
solution: |-
  解：函数 $\mathrm{f}(\mathrm{x})=\sin \left(2 x+\frac{\pi}{3}\right)$ 的最小正周期为: $\frac{2 \pi}{2}=\pi$.

  故选: C.
