stem: 如图, 在下列四个正方体中, $A, B$ 为正方体的两个顶点, $M, N, Q$为所在棱的中点, 则在这四个正方体中, 直线 $\mathrm{AB}$ 与平面 $\mathrm{MNQ}$ 不平行的是( )
figure: 6d06f73ba8508d27.png
options:
  A: 见图中 A
  B: 见图中 B
  C: 见图中 C
  D: 见图中 D
answer: A
solution: |-
  解：对于选项 $B$, 由于 $A B / / M Q$, 结合线面平行判定定理可知 $B$ 不满足题意;
  对于选项 $C$, 由于 $A B / / M Q$, 结合线面平行判定定理可知 $C$ 不满足题意;对于选项 $D$, 由于 $A B / / N Q$, 结合线面平行判定定理可知 $D$ 不满足题意;所以选项 $A$ 满足题意,故选: A.
