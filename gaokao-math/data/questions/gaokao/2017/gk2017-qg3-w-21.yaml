stem: |-
  已知函数 $f(x)=\ln x+a x^{2}+(2 a+1) x$.

  (1) 讨论 $f(x)$ 的单调性;

  （2）当 $a<0$ 时, 证明 $f(x) \leqslant-\frac{3}{4 a}-2$.
