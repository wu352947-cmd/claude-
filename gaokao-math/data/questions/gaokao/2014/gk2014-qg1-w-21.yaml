stem: |-
  设函数 $f(x)=a \ln x+\frac{1-a}{2} x^{2}-b x(a \neq 1)$, 曲线 $y=f(x)$ 在点（1, $f(1 ）$ 处的切线斜率为 0 ,

  (1) 求 b;

  （2）若存在 $x_{0} \geqslant 1$, 使得 $f\left(x_{0}\right)<\frac{a}{a-1}$, 求 $a$ 的取值范围. 请考生在第 22, 23, 24 题中任选一题作答, 如果多做, 则按所做的第一题记分。
