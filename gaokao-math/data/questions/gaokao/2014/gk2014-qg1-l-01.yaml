stem: 已知集合 $A=\left\{x \mid x^{2}-2 x-3 \geqslant 0\right\}, B=\{x \mid-2 \leqslant x<2\}$, 则 $A \cap B=(\quad)$
options:
  A: $[1,2)$
  B: $[-1,1]$
  C: $[-1,2)$
  D: $[-2,-1]$
answer: D
solution: |-
  解: 由 $\mathrm{A}$ 中不等式变形得: $(x-3)(x+1) \geqslant 0$,

  解得: $x \geqslant 3$ 或 $x \leqslant-1$, 即 $A=(-\infty,-1] \cup[3,+\infty)$,

  $\because B=[-2,2)$,

  $\therefore A \cap B=[-2,-1]$.

  故选：D.
