stem: |-
  已知数列 $\left\{a_{n}\right\}$ 满足 $a_{1}=1, a_{n+1}=3 a_{n}+1$.

  （I ) 证明 $\left\{a_{n}+\frac{1}{2}\right\}$ 是等比数列, 并求 $\left\{a_{n}\right\}$ 的通项公式;

  （II）证明: $\frac{1}{a_{1}}+\frac{1}{a_{2}}+\ldots+\frac{1}{a_{n}}<\frac{3}{2}$.
