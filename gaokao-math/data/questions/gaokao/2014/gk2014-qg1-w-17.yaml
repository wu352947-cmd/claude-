stem: |-
  已知 $\left\{a_{n}\right\}$ 是递增的等差数列, $a_{2}, a_{4}$ 是方程 $x^{2}-5 x+6=0$ 的根.

  （1）求 $\left\{a_{n}\right\}$ 的通项公式;

  (2) 求数列 $\left\{\frac{a_{n}}{2^{n}}\right\}$ 的前 $\mathrm{n}$ 项和.
