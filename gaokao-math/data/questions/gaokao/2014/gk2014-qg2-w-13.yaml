stem: 甲、乙两名运动员各自等可能地从红、白、蓝 3 种颜色的运动服中 选择 1 种, 则他们选择相同颜色运动服的概率为 ______
answer: \frac{1}{3}
answer_kind: expr
solution: |-
  解: 所有的选法共有 $3 \times 3=9$ 种, 而他们选择相同颜色运动服的选法共 有 3 种,

  故他们选择相同颜色运动服的概率为 $\frac{3}{9}=\frac{1}{3}$,

  故答案为: $\frac{1}{3}$.
