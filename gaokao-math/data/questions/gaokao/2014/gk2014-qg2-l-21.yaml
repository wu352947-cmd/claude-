stem: |-
  已知函数 $f(x)=e^{x}-e^{-x}-2 x$.

  (I) 讨论 $f(x)$ 的单调性;

  （II）设 $g(x)=f(2 x)-4 b f(x)$, 当 $x>0$ 时, $g(x)>0$, 求 $b$ 的最大值; (III) 已知 $1.4142<\sqrt{2}<1.4143$, 估计 $\ln 2$ 的近似值（精确到 0.001 ）.
