stem: $\frac{1+3 i}{1-i}=(\quad)$
options:
  A: $1+2 \mathrm{i}$
  B: $-1+2 i$
  C: $1-2 i$
  D: $-1-2 i$
answer: B
solution: |-
  解：化简可得 $\frac{1+3 i}{1-i}=\frac{(1+3 i)(1+i)}{(1-i)(1+i)}=\frac{1-3+4 i}{1-i^{2}}=\frac{-2+4 i}{2}=-1+2 i$

  故选: B.
