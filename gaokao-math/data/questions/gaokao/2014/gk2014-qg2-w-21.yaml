difficulty_label: 压轴
stem: |-
  已知函数 $f(x)=x^{3}-3 x^{2}+a x+2$, 曲线 $y=f(x)$ 在点 $(0,2)$ 处的 切线与 $x$ 轴交点的横坐标为 -2 .

  （I）求 a;

  （II ）证明: 当 $k<1$ 时, 曲线 $y=f(x)$ 与直线 $y=k x-2$ 只有一个交点.
