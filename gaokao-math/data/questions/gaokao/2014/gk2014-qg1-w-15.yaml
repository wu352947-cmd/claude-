source: 2014 全国I卷（文科） 第 15 题 · 来源：GAOKAO-Bench（Apache-2.0）
year: 2014
kps:
  func.piecewise: 1.0
difficulty_label: 中档
stem: 设函数 $f(x)=\left\{\begin{array}{ll}e^{x-1}, & x<1 \\ \frac{1}{3}, & x \geqslant 1\end{array}\right.$, 则使得 $f(x) \leqslant 2$ 成立的 $x$ 的取值 范围是
parts:
- label: 答案
  points: 5.0
  answer: $x \leqslant 8$
  rubric:
  - 与参考答案一致即得分
solution: |-
  解: $x<1$ 时, $e^{x-1} \leqslant 2$,

  $\therefore x \leqslant \ln 2+1$

  $\therefore x<1$;

  $x \geqslant 1$ 时,$\quad x^{\frac{1}{3}} \leqslant 2$,

  $\therefore x \leqslant 8$,

  $\therefore 1 \leqslant x \leqslant 8$,

  综上，使得 $f(x) \leqslant 2$ 成立的 $x$ 的取值范围是 $x \leqslant 8$.

  故答案为: $x \leqslant 8$.
