stem: |-
  已知点 $P(2,2)$, 圆 $C: x^{2}+y^{2}-8 y=0$, 过点 $P$ 的动直线 $\mid$ 与圆 $C$ 交于 $A, B$ 两点, 线段 $A B$ 的中点为 $M, O$ 为坐标原点.

  (1) 求 $M$ 的轨迹方程;

  （2）当 $|O P|=|O M|$ 时, 求 $\mid$ 的方程及 $\triangle P O M$ 的面积.
