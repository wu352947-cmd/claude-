stem: 已知集合 $A=\{-2,0,2\}, B=\left\{x \mid x^{2}-x-2=0\right\}$, 则 $A \cap B=(\quad)$
options:
  A: $\varnothing$
  B: $\{2\}$
  C: $\{0\}$
  D: $\{-2\}$
answer: B
solution: |-
  解: $\because A=\{-2,0,2\}, B=\left\{x \mid x^{2}-x-2=0\right\}=\{-1,2\}$,

  $\therefore A \cap B=\{2\}$.

  故选: B.
