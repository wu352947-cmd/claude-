stem: 已知双曲线 $\frac{x^{2}}{a^{2}}-\frac{y^{2}}{3}=1(a>0)$ 的离心率为 2 , 则实数 $a=(\quad)$
options:
  A: '2'
  B: $\frac{\sqrt{6}}{2}$
  C: $\frac{\sqrt{5}}{2}$
  D: '1'
answer: D
solution: |-
  解: 由题意,

  $\mathrm{e}=\frac{\mathrm{c}}{\mathrm{a}}=\frac{\sqrt{\mathrm{a}^{2}+3}}{\mathrm{a}}=2$,

  解得, $a=1$.

  故选：D.
