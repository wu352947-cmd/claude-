type: fill
source: 2014 全国I卷 第 14 题 · 来源：GAOKAO-Bench（Apache-2.0）
year: 2014
kps:
  novel.definition: 1.0
difficulty_label: 基础
points: 5.0
stem: |-
  甲、乙、丙三位同学被问到是否去过 A，B，C三个城市时,

  甲说：我去过的城市比乙多，但没去过 $B$ 城市;

  乙说：我没去过C 城市;

  丙说：我们三人去过同一城市;

  由此可判断乙去过的城市为 ______
answer: A
answer_kind: expr
solution: |-
  解：由乙说：我没去过 $C$ 城市, 则乙可能去过 $A$ 城市或 $B$ 城市, 但甲说: 我去过的城市比乙多, 但没去过 $B$ 城市, 则乙只能是去过 $A, B$ 中的任 一个

  再由丙说：我们三人去过同一城市,

  则由此可判断乙去过的城市为 $A$.

  故答案为: $A$.
