stem: 偶函数 $y=f(x)$ 的图象关于直线 $x=2$ 对称, $f(3)=3$, 则 $f(-1)=$ ______
answer: '3'
answer_kind: expr
solution: |-
  解: 法 1: 因为偶函数 $y=f(x)$ 的图象关于直线 $\mathrm{x}=2$ 对称,

  所以 $f(2+x)=f(2-x)=f(x-2)$,

  即 $f(x+4)=f(x) ，$

  则 $f(-1)=f(-1+4)=f(3)=3$,

  法 2: 因为函数 $\mathrm{y}=\mathrm{f}(\mathrm{x})$ 的图象关于直线 $\mathrm{x}=2$ 对称,

  所以 $f(1)=f(3)=3$,

  因为 $f(x)$ 是偶函数,

  所以 $f(-1)=f(1)=3$,

  故答案为: 3 .
