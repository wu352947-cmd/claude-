stem: '已知抛物线 $C: y^{2}=x$ 的焦点为 $F, A\left(x_{0}, y_{0}\right)$ 是 $C$ 上一点, $A F=\left|\frac{5}{4} x_{0}\right|$ , 则 $x_{0}=(\quad)$'
options:
  A: '1'
  B: '2'
  C: '4'
  D: '8'
answer: A
solution: |-
  解：抛物线 $c: y^{2}=x$ 的焦点为 $F\left(\frac{1}{4}, 0\right)$,

  $\because A\left(x_{0}, y_{0}\right)$ 是 $C$ 上一点, $A F=\left|\frac{5}{4} x_{0}\right|, x_{0}>0$.

  $\therefore \frac{5}{4} x_{0}=x_{0}+\frac{1}{4}$

  解得 $x_{0}=1$.

  故选: A.
