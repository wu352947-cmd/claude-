stem: 设向量 $\vec{a}, \vec{b}$ 满足 $|\vec{a}+\vec{b}|=\sqrt{10},|\vec{a}-\vec{b}|=\sqrt{6}$, 则 $\vec{a} \bullet \vec{b}=(\quad)$
options:
  A: '1'
  B: '2'
  C: '3'
  D: '5'
answer: A
solution: |-
  解: $\because|\vec{a}+\vec{b}|=\sqrt{10},|\vec{a}-\vec{b}|=\sqrt{6}$,

  $\therefore$ 分别平方得 $\vec{a}^{2}+2 \vec{a} \bullet \vec{b}+\vec{b}^{2}=10, \vec{a}^{2}-2 \vec{a} \cdot \vec{b}+\vec{b}^{2}=6$, 两式相减得 $4 \vec{a} \bullet \vec{b}=10-6=4$,

  即 $\vec{a} \cdot \vec{b}=1$,

  故选: A.
