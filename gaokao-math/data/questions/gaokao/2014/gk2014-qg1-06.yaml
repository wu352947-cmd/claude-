stem: 如图, 圆 $\mathrm{O}$ 的半径为 $1, \mathrm{A}$ 是圆上的定点, $\mathrm{P}$ 是圆上的动点, 角 $\mathrm{x}$ 的始边为射线 $O A$, 终边为射线 $O P$, 过点 $P$ 作直线 $O A$ 的垂线, 垂足为 $M$, 将点 $M$ 到直线 $O P$ 的距离表示为 $x$ 的函数 $f(x)$, 则 $y=f(x)$ 在 $[0, \pi]$ 的图象大致为 $(\quad)$
figure: 3af685260d5c180f.png
options:
  A: 见图中 A
  B: 见图中 B
  C: 见图中 C
  D: 见图中 D
answer: C
solution: '解: 在直角三角形 $O M P$ 中, $O P=1, \angle P O M=x$, 则 $O M=|\cos x|$, $\therefore$ 点 $\mathrm{M}$ 到直线 $\mathrm{OP}$ 的距离表示为 $\mathrm{x}$ 的函数 $\mathrm{f}(\mathrm{x})=\mathrm{OM}|\sin \mathrm{x}|$ $=|\cos x| \cdot|\sin x|=\frac{1}{2}|\sin 2 x|$,其周期为 $T=\frac{\pi}{2}$, 最大值为 $\frac{1}{2}$, 最小值为 0 ,故选: C.'
