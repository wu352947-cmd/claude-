stem: 若 $\tan \alpha>0$, 则 $(\quad)$
options:
  A: $\sin \alpha>0$
  B: $\cos \alpha>0$
  C: $\sin 2 \alpha>0$
  D: $\cos 2 \alpha>0$
answer: C
solution: |-
  解: $\because \tan \alpha>0$,

  $\therefore \frac{\sin \alpha}{\cos \alpha}>0$,

  则 $\sin 2 \alpha=2 \sin \alpha \cos \alpha>0$.

  故选: C.
