stem: |-
  已知数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和为 $S_{n}, a_{1}=1, a_{n} \neq 0, a_{n} a_{n+1}=\lambda S_{n}-1$, 其中 $\lambda$ 为常数.

  ( I ) 证明: $a_{n+2}-a_{n}=\lambda$

  (II ) 是否存在 $\lambda$, 使得 $\left\{a_{n}\right\}$ 为等差数列? 并说明理由.
