stem: 设 $z=\frac{1}{1+i}+i, \quad$ 则 $|z|=(\quad)$
options:
  A: $\frac{1}{2}$
  B: $\frac{\sqrt{2}}{2}$
  C: $\frac{\sqrt{3}}{2}$
  D: '2'
answer: B
solution: |-
  解: $z=\frac{1}{1+i}+i=\frac{1-i}{(1+i)(1-i)}+i=\frac{1}{2}+\frac{1}{2} i$.

  故 $|z|=\sqrt{\frac{1}{4}+\frac{1}{4}}=\frac{\sqrt{2}}{2}$.

  故选: B.
