stem: |-
  设函数 $f(x)=a e^{x} \ln x+\frac{b e^{x-1}}{x}$, 曲线 $y=f(x)$ 在点 $(1, f(1))$ 处 得切线方程为 $y=e(x-1)+2$.
  (I) 求 $a 、 b$;
  ( II ) 证明: $f(x)>1$.
parts:
