stem: '已知抛物线 $C: y^{2}=8 x$ 的焦点为 $F$, 准线为 $I, P$ 是 $I$ 上一点, $Q$ 是直 线 $P F$ 与 $C$ 的一个交点, 若 $\overrightarrow{F P}=4 \overrightarrow{F Q}$, 则 $|Q F|=(\quad)$'
options:
  A: $\frac{7}{2}$
  B: '3'
  C: $\frac{5}{2}$
  D: '2'
answer: B
solution: |-
  解：设 $Q$ 到 $I$ 的距离为 $d$, 则 $|Q F|=d$,

  $\because \overrightarrow{\mathrm{FP}}=4 \overrightarrow{\mathrm{F} 0}$

  $\therefore|P Q|=3 d$

  $\therefore$ 不妨设直线 $P F$ 的斜率为 $-\frac{2 \sqrt{2} \mathrm{d}}{\mathrm{d}}=-2 \sqrt{2}$,

  $\because F(2,0)$,

  $\therefore$ 直线 $P F$ 的方程为 $y=-2 \sqrt{2}(x-2)$,

  与 $y^{2}=8 x$ 联立可得 $x=1$,

  $\therefore|Q F|=d=1+2=3$,

  故选：B.
