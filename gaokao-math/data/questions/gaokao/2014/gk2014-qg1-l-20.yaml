stem: |-
  已知点 $A(0,-2)$, 椭圆 $\left.E: \frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}=1 （ a>b>0\right)$ 的离心率为 $\frac{\sqrt{3}}{2}$ , $F$ 是椭圆的右焦点, 直线 $A F$ 的斜率为 $\frac{2 \sqrt{3}}{3}, O$ 为坐标原点.

  (I ) 求 $E$ 的方程;

  （II ) 设过点 $A$ 的直线 $I$ 与 $E$ 相交于 $P, Q$ 两点, 当 $\triangle O P Q$ 的面积最大时, 求 $I$ 的方程.
