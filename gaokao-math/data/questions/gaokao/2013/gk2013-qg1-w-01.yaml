stem: 已知集合 $A=\{1,2,3,4\}, B=\left\{x \mid x=n^{2}, n \in A\right\}$, 则 $A \cap B=(\quad)$
options:
  A: $\{1,4\}$
  B: $\{2,3\}$
  C: $\{9,16\}$
  D: $\{1,2\}$
answer: A
solution: |-
  解：根据题意得: $x=1,4,9,16$, 即 $B=\{1,4,9,16\}$,

  $\because A=\{1,2,3,4\}$,

  $\therefore A \cap B=\{1,4\}$.

  故选: A.
