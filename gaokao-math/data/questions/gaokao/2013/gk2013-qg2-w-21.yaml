stem: |-
  已知函数 $f(x)=x^{2} e^{-x}$

  ( I ) 求 $f(x)$ 的极小值和极大值;

  (II ) 当曲线 $\mathrm{y}=\mathrm{f}(\mathrm{x})$ 的切线 $\mathrm{I}$ 的斜率为负数时, 求 $\mathrm{I}$ 在 $\mathrm{x}$ 轴上截距的取值范围.
