stem: |-
  一批产品需要进行质量检验, 检验方案是: 先从这批产品中任取 4 件作检验, 这 4 件产品中优质品的件数记为 $\mathrm{n}$. 如果 $\mathrm{n}=3$, 再从这批产品中任 取 4 件作检验, 若都为优质品, 则这批产品通过检验 如果 $n=4$, 再从这批产 品中任取 1 件作检验, 若为优质品, 则这批产品通过检验; 其他情况下, 这 批产品都不能通过检验. 假设这批产品的优质品率为 $50 \%$, 即取出的产品是 优质品的概率都为 $\frac{1}{2}$, 且各件产品是否为优质品相互独立.

  ( I ) 求这批产品通过检验的概率;

  (II ) 已知每件产品检验费用为 100 元, 凡抽取的每件产品都需要检验, 对这批 产品作质量检验所需的费用记为 $X$ (单位：元）, 求 $X$ 的分布列及数学期望.
