solution: |-
  解: ( I ) 设第一次取出的 4 件产品中恰有 3 件优质品为事件 $\mathrm{A}_{1}$, 第 一次取出的 4 件产品全是优质品为事件 $\mathrm{A}_{2}$,

  第二次取出的 4 件产品全是优质品为事件 $\mathrm{B}_{1}$, 第二次取出的 1 件产品是优质品 为事件 $B_{2}$,

  这批产品通过检验为事件 $A$, 依题意有 $A=\left(A_{1} B_{1}\right) \cup\left(A_{2} B_{2}\right)$, 且 $A_{1} B_{1}$ 与 $A_{2} B_{2}$ 互斥,

  所以 $P(A)=P\left(A_{1} B_{1}\right)+P\left(A_{2} B_{2}\right)=P\left(A_{1}\right) P\left(B_{1} \mid A_{1}\right)+P\left(A_{2}\right) P\left(B_{2} \mid A_{2}\right)$ $=\frac{4}{16} \times \frac{1}{16}+\frac{1}{16} \times \frac{1}{2}=\frac{3}{64}$

  (II ) $X$ 可能的取值为 $400,500,800$, 并且 $P(X=800)=\frac{1}{4}, P(X=500)=\frac{1}{16}$, $\mathrm{P}(\mathrm{X}=400)=1-\frac{1}{16}-\frac{1}{4}=\frac{11}{16}$, 故 $\mathrm{X}$ 的分布列如下：

  $$\begin{array}{|c|c|c|c|}\hline X & 400 & 500 & 800 \\ \hline \end{array}$$

  $$\begin{array}{|c|c|c|c|}\hline \mathrm{P} & \frac{11}{16} & \frac{1}{16} & \frac{1}{4} \\ \hline \end{array}$$

  故 $\mathrm{EX}=400 \times \frac{11}{16}+500 \times \frac{1}{16}+800 \times \frac{1}{4}=506.25$
