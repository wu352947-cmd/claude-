stem: |-
  已知函数 $f(x)=x^{2}+a x+b, g(x)=e^{x}(c x+d)$, 若曲线 $y=f(x)$ 和 曲线 $y=g(x)$ 都过点 $P(0,2)$, 且在点 $P$ 处有相同的切线 $y=4 x+2$.

  (I ) 求 $a, b, c, d$ 的值;

  (II ) 若 $x \geqslant-2$ 时, $f(x) \leqslant k g(x)$, 求 $k$ 的取值范围.
