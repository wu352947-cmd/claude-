difficulty_label: 压轴
stem: |-
  已知圆 $M:(x+1)^{2}+y^{2}=1$, 圆 $N:(x-1)^{2}+y^{2}=9$, 动圆 $P$ 与圆 $M$ 外切并与圆 $N$ 内切, 圆心 $P$ 的轨迹为曲线 $C$.

  (I ) 求 C 的方程;

  ( II ) I 是与圆 $P$, 圆 $M$ 都相切的一条直线, $\mid$ 与曲线 $C$ 交于 $A, B$ 两点, 当圆 $P$ 的半径最长时, 求 $|A B|$.
