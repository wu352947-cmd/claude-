stem: '已知双曲线 $c: \frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}=1(a>0, b>0)$ 的离心率为 $\frac{\sqrt{5}}{2}$, 则 $c$ 的渐 近线方程为 ( )'
options:
  A: $y= \pm \frac{1}{4} x$
  B: $y= \pm \frac{1}{3} x$
  C: $y= \pm x$
  D: $y= \pm \frac{1}{2} x$
answer: D
solution: |-
  解: 由双曲线 $c: \frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}=1(a>0, b>0)$,

  则离心率 $e=\frac{c}{a}=\frac{\sqrt{a^{2}+b^{2}}}{a}=\frac{\sqrt{5}}{2}$, 即 $4 b^{2}=a^{2}$,

  故渐近线方程为 $y= \pm \frac{b}{a} x= \pm \frac{1}{2} x$,

  故选：D.
