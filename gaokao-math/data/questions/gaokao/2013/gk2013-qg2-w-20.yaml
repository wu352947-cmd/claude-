stem: |-
  在平面直角坐标系 $x O y$ 中, 已知圆 $P$ 在 $x$ 轴上截得线段长为 $2 \sqrt{2}$, 在 $\mathrm{y}$ 轴上截得线段长为 $2 \sqrt{3}$.

  ( I ) 求圆心 $P$ 的轨迹方程;

  (II) 若 $P$ 点到直线 $y=x$ 的距离为 $\frac{\sqrt{2}}{2}$, 求圆 $P$ 的方程.
