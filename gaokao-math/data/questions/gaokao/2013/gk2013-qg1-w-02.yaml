stem: $\frac{1+2 i}{(1-i)^{2}}=(\quad)$
options:
  A: $-1-\frac{1}{2} \mathrm{i}$
  B: $-1+\frac{1}{2} \mathrm{i}$
  C: $1+\frac{1}{2} \mathrm{i}$
  D: $1-\frac{1}{2} \mathrm{i}$
answer: B
solution: |-
  解: $\frac{1+2 i}{(1-i)^{2}}=\frac{1+2 i}{-2 i}=\frac{(1+2 i) i}{-2 i \cdot i}=\frac{-2+i}{2}=-1+\frac{1}{2} i$.

  故选: B.
