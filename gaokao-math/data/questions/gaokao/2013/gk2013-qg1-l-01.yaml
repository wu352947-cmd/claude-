stem: 已知集合 $A=\left\{x \mid x^{2}-2 x>0\right\}, B=\{x \mid-\sqrt{5}<x<\sqrt{5}\}$, 则（）
options:
  A: $A \cap B=\emptyset$
  B: $A \cup B=R$
  C: $B \subseteq A$
  D: $A \subseteq B$
answer: B
solution: |-
  解: $\because$ 集合 $A=\left\{x \mid x^{2}-2 x>0\right\}=\{x \mid x>2$ 或 $x<0\}$,

  $\therefore A \cap B=\{x \mid 2<x<\sqrt{5}$ 或 $-\sqrt{5}<x<0\}, A \cup B=R$,

  故选: B.
