stem: '设椭圆 C: $\frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}=1(a>b>0)$ 的左、右焦点分别为 $F_{1} 、 F_{2}, P$ 是 C 上的点 $P F_{2} \perp F_{1} F_{2}, \angle P F_{1} F_{2}=30^{\circ}$, 则 $C$ 的离心率为 $(\quad)$'
options:
  A: $\frac{\sqrt{6}}{6}$
  B: $\frac{1}{3}$
  C: $\frac{1}{2}$
  D: $\frac{\sqrt{3}}{3}$
answer: D
solution: |-
  解: $\left|\mathrm{PF}_{2}\right|=\mathrm{x}, \because \mathrm{PF}_{2} \perp \mathrm{F}_{1} \mathrm{F}_{2}, \angle \mathrm{PF}_{1} \mathrm{F}_{2}=30^{\circ}$,

  $\therefore\left|P_{1}\right|=2 x,\left|F_{1} F_{2}\right|=\sqrt{3} x$,

  又 $\left|\mathrm{PF}_{1}\right|+\left|\mathrm{PF}_{2}\right|=2 \mathrm{a},\left|\mathrm{F}_{1} \mathrm{F}_{2}\right|=2 \mathrm{c}$

  $\therefore 2 a=3 x, 2 c=\sqrt{3} x$,

  $\therefore \mathrm{C}$ 的离心率为: $\mathrm{e}=\frac{2 \mathrm{c}}{2 \mathrm{a}}=\frac{\sqrt{3}}{3}$.

  故选: D.
