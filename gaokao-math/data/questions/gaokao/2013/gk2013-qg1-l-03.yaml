difficulty_label: 基础
points: 5.0
stem: 为了解某地区中小学生的视力情况, 拟从该地区的中小学生中抽取 部分学生进行调查, 事先已经了解到该地区小学、初中、高中三个学段学生 的视力情况有较大差异, 而男女生视力情况差异不大. 在下面的抽样方法中, 最合理的抽样方法是（）
options:
  A: 简单的随机抽样
  B: 按性别分层抽样
  C: 按学段分层抽样
  D: 系统抽样
answer: C
solution: |-
  解：我们常用的抽样方法有: 简单随机抽样、分层抽样和系统抽样, 而事先已经了解到该地区小学、初中、高中三个学段学生的视力情况有较大差异 ，而男女生视力情况差异不大.

  了解某地区中小学生的视力情况, 按学段分层抽样, 这种方式具有代表性, 比较 合理.

  故选: C.
