stem: |-
  已知函数 $f(x)=\mathrm{e}^{\mathrm{x}}-\ln (\mathrm{x}+\mathrm{m})$

  （I）设 $x=0$ 是 $f(x)$ 的极值点, 求 $m$, 并讨论 $f(x)$ 的单调性;

  (II）当 $m \leqslant 2$ 时, 证明 $f(x)>0$. 选考题: (第 22 题～第 24 题为选考题, 考生根据要求作答. 请考生在第 22、
