stem: 如图, 有一个水平放置的透明无盖的正方体容器, 容器高 $8 \mathrm{cm}$, 将一个球放在容器口, 再向容器注水, 当球面恰好接触水面时测得水深为 $6 \mathrm{cm}$,如不计容器的厚度, 则球的体积为 ( )
figure: d318c4ec098e4a47.png
options:
  A: $\frac{500 \pi}{3} \mathrm{cm}^3$
  B: $\frac{866 \pi}{3} \mathrm{cm}^3$
  C: $\frac{1372 \pi}{3} \mathrm{cm}^3$
  D: $\frac{2048 \pi}{3} \mathrm{cm}^3$
answer: A
solution: '解: 设正方体上底面所在平面截球得小圆 M,则圆心 $M$ 为正方体上底面正方形的中心. 如图.设球的半径为 $R$, 根据题意得球心到上底面的距离等于 $(R-2) \mathrm{cm}$,而圆 $M$ 的半径为 4 , 由球的截面圆性质, 得 $R^2=(R-2)^2+4^2$,解出 $R=5$,$\therefore$ 根据球的体积公式, 该球的体积 $\mathrm{V}=\frac{4 \pi}{3} \mathrm{R}^3=\frac{4 \pi}{3} \times 5^3=\frac{500 \pi}{3} \mathrm{cm}^3$.故选: A.'
