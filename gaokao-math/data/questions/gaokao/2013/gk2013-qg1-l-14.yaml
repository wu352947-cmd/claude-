stem: 若数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和为 $S_{n}=\frac{2}{3} a_{n}+\frac{1}{3}$, 则数列 $\left\{a_{n}\right\}$ 的通项公式是 $a_{n}=$ ______
answer: (-2)^{n-1}
answer_kind: expr
solution: |-
  解：当 $n=1$ 时, $a_{1}=s_{1}=\frac{2}{3} a_{1}+\frac{1}{3}$, 解得 $a_{1}=1$

  当 $n \geqslant 2$ 时, $a_{n}=S_{n}-S_{n-1}=\left(\frac{2}{3} a_{n}+\frac{1}{3}\right)-\left(\frac{2}{3} a_{n-1}+\frac{1}{3}\right)=\frac{2}{3} a_{n}-\frac{2}{3} a_{n-1}$,

  整理可得 $\frac{1}{3} a_{n}=-\frac{2}{3} a_{r-1}$, 即 $\frac{a_{n}}{a_{n-1}}=-2$,

  故数列 $\left\{a_{n}\right\}$ 从第二项开始是以 -2 为首项, -2 为公比的等比数列, 故当 $n \geqslant 2$ 时, $a_{n}=(-2)^{n-1}$, 经验证当 $n=1$ 时, 上式也适合,

  故答案为: $(-2)^{n-1}$
