stem: |-
  已知等差数列 $\left\{a_{n}\right\}$ 的公差不为零, $a_{1}=25$, 且 $a_{1}, a_{11}, a_{13}$ 成等比数 列.
  ( I ) 求 $\left\{a_{n}\right\}$ 的通项公式;
  (II) 求 $\mathrm{a}_{1}+\mathrm{a}_{4}+\mathrm{a}_{7}+\ldots+\mathrm{a}_{3 n-2}$.
