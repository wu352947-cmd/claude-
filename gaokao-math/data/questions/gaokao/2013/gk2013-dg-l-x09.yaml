stem: 若函数 $f(x)=x^{2}+a x+x$ 在 $\left(\frac{1}{2},+\infty\right)$ 是增函数, 则 $a$ 的取值范围是 （$\qquad$）
options:
  A: $[-1,0]$
  B: $[-1,+\infty)$
  C: $[0,3]$
  D: $[3,+\infty)$
