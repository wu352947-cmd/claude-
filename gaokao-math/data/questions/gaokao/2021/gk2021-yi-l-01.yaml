stem: 设 $2(z+\bar{z})+3(z-\bar{z})=4+6 i$ ，则 $z=(\quad)$
options:
  A: $1-2 i$
  B: $1+2 i$
  C: $1+i$
  D: $1-i$
answer: C
solution: |-
  解析:

  设 $z=a+b i$, 则 $\bar{z}=a-b i, 2(z+\bar{z})+3(z-\bar{z})=4 a+6 b i=4+6 i$, 所以 $a=1, b=1$,

  所以 $z=1+i$.
