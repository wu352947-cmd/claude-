stem: 双曲线 $\frac{x^{2}}{4}-\frac{y^{2}}{5}=1$ 的右焦点到直线 $x+2 y-8=0$ 的距离为 ______
answer: \sqrt{5}
answer_kind: expr
solution: |-
  解析:

  $\frac{x^{2}}{4}-\frac{y^{2}}{5}=1$ 的右焦点为 $(3,0)$, 到直线 $x+2 y-8=0$ 的距离 $d=\frac{|3-8|}{\sqrt{1^{2}+2^{2}}}=\sqrt{5}$.
