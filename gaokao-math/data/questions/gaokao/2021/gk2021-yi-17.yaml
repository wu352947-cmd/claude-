stem: |-
  某厂研制了一种生产高精产品的设备, 为检验新设备生产产品的某项指标有无提高, 用 一台旧设备和一台新设备各生产了 10 件产品，得到各件产品该项指标数据如下:

  $$\begin{array}{|l|l|l|l|l|l|l|l|l|l|l|}\hline \text{旧设备} & 9.8 & 10.3 & 10.0 & 10.2 & 9.9 & 9.8 & 10.0 & 10.1 & 10.2 & 9.7 \\ \hline \text{新设备} & 10.1 & 10.4 & 10.1 & 10.0 & 10.1 & 10.3 & 10.6 & 10.5 & 10.4 & 10.5 \\ \hline \end{array}$$

  旧设备和新设备生产产品的该项指标的样本平均数分别记为 $\bar{x}$ 和 $\bar{y}$, 样本方差分别记为 $s_{1}^{2}$ 和 $s_{2}^{2}$.

  (1) 求 $\bar{x}, \bar{y}, s_{1}^{2}, s_{2}^{2}$;

  (2) 判断新设备生产产品的该项指标的均值较旧设备是否有显著提高（如果 $\bar{y}-\bar{x} \geq 2 \sqrt{\frac{s_{1}^{2}+s_{2}^{2}}{10}}$, 则认为新设备生产产品的该项指标的均值较旧设备有显著提高, 否则 不认为有显著提高).
