stem: 已知 $a, b \in \mathrm{R}, a b>0$, 函数 $f(x)=a x^{2}+b(x \in \mathrm{R})$. 若 $f(s-t), f(s), f(s+t)$ 成等比数列, 则平面上点 $(s, t)$ 的轨迹是 ($\quad$)
