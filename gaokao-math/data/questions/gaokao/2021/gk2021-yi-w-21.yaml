stem: |-
  已知函数 $f(x)=x^{3}-x^{2}+a x+1$.

  (1) 讨论 $f(x)$ 的单调性;

  (2) 求曲线 $y=f(x)$ 过坐标原点的切线与曲线 $y=f(x)$ 的公共点的坐标.
