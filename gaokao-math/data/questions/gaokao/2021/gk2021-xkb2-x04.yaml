stem: '北斗三号全球卫星导航系统是我国航天事业的重要成果. 在卫星导航系统中, 地球静止同步卫星的轨道 位于地球赤道所在平面, 轨道高度为 $36000 \mathrm{km}$ (轨道高度是指卫星到地球表面的距离). 将地球看作是一 个球心为 $O$, 半径 $r$ 为 $6400 \mathrm{km}$ 的球, 其上点 $A$ 的纬度是指 $O A$ 与赤道平面所成角的度数. 地球表面上能直 接观测到一颗地球静止同步轨道卫星点的纬度最大值为 $\alpha$, 记卫星信号覆盖地球表面的表面积为 $S=2 \pi r^{2}(1-\cos \alpha)$ （单位: $\mathrm{km}^{2}$ ), 则 $S$ 占地球表面积的百分比约为 ($\quad$)'
options:
  A: $26 \%$
  B: $34 \%$
  C: $42 \%$
  D: $50 \%$
answer: C
