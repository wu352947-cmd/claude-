stem: |-
  记 $S_{n}$ 为数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和, $b_{n}$ 为数列 $\left\{S_{n}\right\}$ 的前 $n$ 项积, 已知 $\frac{2}{S_{n}}+\frac{1}{b_{n}}=2$.

  (1) 证明：数列 $\left\{b_{n}\right\}$ 是等差数列;

  (2) 求 $\left\{a_{n}\right\}$ 的通项公式.
