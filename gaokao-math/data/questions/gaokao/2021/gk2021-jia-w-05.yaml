stem: 点 $(3,0)$ 到双曲线 $\frac{x^{2}}{16}-\frac{y^{2}}{9}=1$ 的一条渐近线的距离为 $(\quad)$
options:
  A: $\frac{9}{5}$
  B: $\frac{8}{5}$
  C: $\frac{6}{5}$
  D: $\frac{4}{5}$
answer: A
solution: |-
  【详解】由题意可知, 双曲线的渐近线方程为: $\frac{x^{2}}{16}-\frac{y^{2}}{9}=0$ ，即 $3 x \pm 4 y=0$ ，

  结合对称性，不妨考虑点 $(3,0)$ 到直线 $3 x+4 y=0$ 的距离: $d=\frac{9+0}{\sqrt{9+16}}=\frac{9}{5}$.

  故选: A.
