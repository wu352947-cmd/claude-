stem: 设集合 $M=\{1,3,5,7,9\}, N=\{x \mid 2 x>7\}$, 则 $M \cap N=(\quad)$
options:
  A: $\{7,9\}$
  B: $\{5,7,9\}$
  C: $\{3,5,7,9\}$
  D: $\{1,3,5,7,9\}$
answer: B
solution: |-
  【详解】 $N=\left(\frac{7}{2},+\infty\right)$, 故 $M \cap N=\{5,7,9\}$,

  故选: B.
