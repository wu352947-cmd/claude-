stem: 已知向量 $\vec{a}=(3,1), \vec{b}=(1,0), \vec{c}=\vec{a}+k \vec{b}$. 若 $\vec{a} \perp \vec{c}$, 则 $k=$ ______
answer: -\frac{10}{3}
answer_kind: expr
solution: |-
  【详解】 $\because \vec{a}=(3,1), \vec{b}=(1,0), \therefore \vec{c}=\vec{a}+k \vec{b}=(3+k, 1)$ ，

  $\because \vec{a} \perp \vec{c}, \therefore \vec{a} \diamond \vec{c}=3(3+k)+1 \times 1=0$, 解得 $k=-\frac{10}{3}$,

  故答案为: $-\frac{10}{3}$.
