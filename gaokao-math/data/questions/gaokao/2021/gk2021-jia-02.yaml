stem: 为了解某地农村经济情况, 对该地农户家庭年收人进行抽样调查, 将农户家庭年收人的调查数据整理得到如下频率分布直方图:根据此频率分布直方图, 下面结论中不正确的是（）
figure: 48600972f6e40c74.png
options:
  A: 该地农户家庭年收人低于 4.5 万元的农户比率估计为 $6 \%$
  B: 该地农户家庭年收人不低于 10.5 万元的农户比率估计为 $10 \%$
  C: 估计该地农户家庭年收人的平均值不超过 6.5 万元
  D: 估计该地有一半以上的农户, 其家庭年收人介于 4.5 万元至 8.5 万元之间
answer: C
solution: '【详解】因为频率直方图中的组距为 1 , 所以各组的直方图的高度等于频率.样本频率直方图中的频率即可作为总体的相应比率的估计值.该地农户家庭年收人低于 4.5 万元的农户的比率估计值为 $0.02+0.04=0.06=6 \%$, 故 A 正确;该地农户家庭年收人不低于 10.5 万元的农户比率估计值为 $0.04+0.02 \times 3=0.10=10 \%$, 故 B 正确;该地农户家庭年收人介于 4.5 万元至 8.5 万元之间的比例估计值为$0.10+0.14+0.20 \times 2=0.64=64 \%>50 \%$, 故 D 正确;该地农户家庭年收人的平均值的估计值为$3 \times 0.02+4 \times 0.04+5 \times 0.10+6 \times 0.14+7 \times 0.20+8 \times 0.20+9 \times 0.10+10 \times 0.10+11 \times 0.04+12 \times 0.02+13 \times 0.02+14 \times 0.02=7.68$ (万元), 超过 6.5 万元, 故 C 错误.综上, 给出结论中不正确的是 C.故选: C.'
