stem: 已知向量 $\vec{a}=(1,3), \vec{b}=(3,4)$, 若 $(\vec{a}-\lambda \vec{b}) \perp \vec{b}$, 则 $\lambda=$ ______
answer: \frac{3}{5}
answer_kind: expr
solution: |-
  解析:

  由题意得 $(\vec{a}-\lambda \vec{b}) \cdot \vec{b}=0$ ， 即 $15-25 \lambda=0$ ， 解得 $\lambda=\frac{3}{5}$.
