stem: |-
  已知双曲线 $C: \frac{x^{2}}{m}-y^{2}=1(m>0)$ 的一条渐近线为 $\sqrt{3} x+m y=0$, 则 $C$ 的焦距

  为 ______
answer: '4'
answer_kind: expr
solution: |-
  解析:

  易知双曲线渐近线方程为 $y= \pm \frac{b}{a} x$, 由题意得 $a^{2}=m, b^{2}=1$, 且一条渐近线方程为 $y=-\frac{\sqrt{3}}{m} x$, 则有 $m=0$ (舍去), $m=3$, 故焦距为 $2 c=4$.
