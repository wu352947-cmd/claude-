year: 2021
kps:
  deriv.extremum: 1.0
difficulty_label: 较难
points: 5.0
stem: 设 $a \neq 0$, 若 $x=a$ 为函数 $f(x)=a(x-a)^{2}(x-b)$ 的极大值点, 则
options:
  A: $a<b$
  B: $a>b$
  C: $a b<a^{2}$
  D: $a b>a^{2}$
answer: D
solution: |-
  解析:

  $f^{\prime}(x)=2 a(x-a)(x-b)+a(x-a)^{2}=a(x-a)(3 x-2 b-a)$

  当 $a>0$ 时, 原函数先增再减后增.

  原函数在 $f^{\prime}(x)=0$ 的较小零点时取得极大值.

  即 $a<\frac{a+2 b}{3}$, 即 $a<b, \therefore a^{2}<a b$.

  当 $a<0$ 时, 原函数先减再增后减.

  原函数在 $f^{\prime}(x)=0$ 的较大零点时取得极大值.

  即 $a>\frac{a+2 b}{3}, a>b, a^{2}<a b$, 故选 D.
