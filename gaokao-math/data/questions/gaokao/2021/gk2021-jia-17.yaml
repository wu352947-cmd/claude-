stem: |-
  甲、乙两台机床生产同种产品, 产品按质量分为一级品和二级品, 为了比较两台机床产品的质量, 分别 用两台机床各生产了 200 件产品, 产品的质量情况统计如下表:

  $$\begin{array}{|c|c|c|c|}\hline  & \text{一级品} & \text{二级品} & \text{合计} \\ \hline \text{甲机床} & 150 & 50 & 200 \\ \hline \text{乙机床} & 120 & 80 & 200 \\ \hline \text{合计} & 270 & 130 & 400 \\ \hline \end{array}$$

  （1）甲机床、乙机床生产的产品中一级品的频率分别是多少?

  (2) 能否有 $99 \%$ 的把握认为甲机床的产品质量与乙机床的产品质量有差异?

  附: $\quad K^{2}=\frac{n(a d-b c)^{2}}{(a+b)(c+d)(a+c)(b+d)}$

  $$\begin{array}{|c|c|c|c|}\hline P\left(K^{2} \geq k\right) & 0.050 & 0.010 & 0.001 \\ \hline k & 3.841 & 6.635 & 10.828 \\ \hline \end{array}$$
parts:
- label: (1)
  points: 5
  answer: ''
- label: (2)
  points: 7.0
  answer: ''
solution: |-
  【详解】(1) 甲机床生产的产品中的一级品的频率为 $\frac{150}{200}=75 \%$,

  乙机床生产的产品中的一级品的频率为 $\frac{120}{200}=60 \%$.

  (2) $K^{2}=\frac{400(150 \times 80-120 \times 50)^{2}}{270 \times 130 \times 200 \times 200}=\frac{400}{39}>10>6.635$,

  故能有 $99 \%$ 的把握认为甲机床的产品与乙机床的产品质量有差异.
