stem: '记 $S_{n}$ 为数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和, 已知 $a_{n}>0, a_{2}=3 a_{1}$, 且数列 $\left\{\sqrt{S_{n}}\right\}$ 是等差数列, 证明: $\left\{a_{n}\right\}$ 是等差数 列.'
