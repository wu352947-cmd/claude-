stem: 已知向量 $\vec{a}=(2,5), \vec{b}=(\lambda, 4)$, 若 $\vec{a} / / \vec{b}$, 则 $\lambda=$ ______
answer: \frac{8}{5}
answer_kind: expr
solution: |-
  解析:

  由已知 $\vec{a} / / \vec{b}$ 可得 $2 \times 4=5 \lambda \Rightarrow \lambda=\frac{8}{5}$.
