stem: 已知 $(1-i)^{2} z=3+2 i$, 则 $z=(\quad)$
options:
  A: $-1-\frac{3}{2} i$
  B: $-1+\frac{3}{2} i$
  C: $-\frac{3}{2}+i$
  D: $-\frac{3}{2}-i$
answer: B
solution: |-
  【详解】 $(1-i)^{2} z=-2 i z=3+2 i$,

  $z=\frac{3+2 i}{-2 i}=\frac{(3+2 i) \cdot i}{-2 i \cdot i}=\frac{-2+3 i}{2}=-1+\frac{3}{2} i$

  故选: B.
