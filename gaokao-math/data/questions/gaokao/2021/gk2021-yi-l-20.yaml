stem: |-
  设函数 $f(x)=\ln (a-x)$, 已知 $x=0$ 是函数 $y=x f(x)$ 的极值点.

  (1) 求 $a$;

  (2) 设函数 $g(x)=\frac{x+f(x)}{x f(x)}$, 证明: $g(x)<1$.
