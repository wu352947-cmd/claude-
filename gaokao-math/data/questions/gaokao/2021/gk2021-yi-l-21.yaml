stem: |-
  已知抛物线 $C: x^{2}=2 p y(p>0)$ 的焦点为 $F$, 且 $F$ 与圆 $M: x^{2}+(y+4)^{2}=1$ 上点的 距离的最小值为 4 .

  (1) 求 $p$;

  (2) 若点 $P$ 在 $M$ 上, $P A, P B$ 是 $C$ 的两条切线, $A, B$ 是切点, 求 $\triangle P A B$ 面积的最 大值.
