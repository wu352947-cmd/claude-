stem: 已知 $f(x)$ 为偶函数, 当 $x<0$ 时, $f(x)=\ln (-x)+3 x$, 则曲线 $y=f(x)$ 在点 $(1,-3)$ 处的切线方程是 ______
answer: 2 x+y+1=0
answer_kind: equation
solution: |-
  解: $f(x)$ 为偶函数, 可得 $f(-x)=f(x)$,

  当 $x<0$ 时, $f(x)=\ln (-x)+3 x$, 即有

  $x>0$ 时, $f(x)=\ln x-3 x, f^{\prime}(x)=\frac{1}{x}-3$,

  可得 $f(1)=\ln 1-3=-3, f^{\prime} \quad(1)=1-3=-2$,

  则曲线 $y=f(x)$ 在点 $(1,-3)$ 处的切线方程为 $y-(-3)=-2(x-1)$,

  即为 $2 x+y+1=0$.

  故答案为: $2 x+y+1=0$.
