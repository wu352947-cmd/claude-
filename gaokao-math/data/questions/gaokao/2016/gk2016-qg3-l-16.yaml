stem: '已知直线 I: $m x+y+3 m-\sqrt{3}=0$ 与圆 $x^{2}+y^{2}=12$ 交于 $A, B$ 两点, 过 $A$, $B$ 分别作 $\mid$ 的垂线与 $x$ 轴交于 $C, D$ 两点, 若 $|A B|=2 \sqrt{3}$, 则 $|C D|=$ ______'
answer: '4'
answer_kind: expr
solution: |-
  解: 由题意, $|A B|=2 \sqrt{3}, \therefore$ 圆心到直线的距离 $\mathrm{d}=3$,

  $\therefore \frac{|3 m-\sqrt{3}|}{\sqrt{m^{2}+1}}=3$,

  $\therefore \mathrm{m}=-\frac{\sqrt{3}}{3}$

  $\therefore$ 直线 I 的倾斜角为 $30^{\circ}$,

  $\because$ 过 $A, B$ 分别作 $I$ 的垂线与 $x$ 轴交于 $C, D$ 两点,

  $\therefore|\mathrm{CD}|=\frac{2 \sqrt{3}}{\frac{\sqrt{3}}{2}}=4$.

  故答案为: 4 .
