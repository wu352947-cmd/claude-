stem: |-
  等差数列 $\left\{a_{n}\right\}$ 中, $a_{3}+a_{4}=4, a_{5}+a_{7}=6$.

  (I) 求 $\left\{a_{n}\right\}$ 的通项公式;

  (II ) 设 $b_{n}=\left[a_{n}\right]$, 求数列 $\left\{b_{n}\right\}$ 的前 10 项和, 其中 $[x]$ 表示不超过 $x$ 的最大整数, 如 $[0.9]=0,[2.6]=2$.
