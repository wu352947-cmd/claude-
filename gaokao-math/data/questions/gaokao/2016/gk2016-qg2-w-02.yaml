stem: 设复数 $z$ 满足 $z+i=3-i$, 则 $\bar{z}=(\quad)$
options:
  A: $-1+2 i$
  B: $1-2 i$
  C: $3+2 i$
  D: $3-2 i$
answer: C
solution: |-
  解: $\because$ 复数 $z$ 满足 $z+i=3-\mathrm{i}$,

  $\therefore z=3-2 i$, $\therefore \bar{z}=3+2 i$

  故选: C.
