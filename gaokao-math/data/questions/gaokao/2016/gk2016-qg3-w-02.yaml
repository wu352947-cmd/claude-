stem: 若 $z=4+3 i$ ，则 $\frac{\bar{z}}{|z|}=(\quad)$
options:
  A: '1'
  B: '-1'
  C: $\frac{4}{5}+\frac{3}{5} i$
  D: $\frac{4}{5}-\frac{3}{5} i$
answer: D
solution: |-
  解: $z=4+3 i$, 则 $\frac{\bar{z}}{|z|}=\frac{4-3 i}{|4+3 i|}=\frac{4-3 i}{5}=\frac{4}{5}-\frac{3}{5} i$.

  故选: D.
