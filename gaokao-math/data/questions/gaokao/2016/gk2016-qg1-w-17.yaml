stem: |-
  已知 $\left\{a_{n}\right\}$ 是公差为 3 的等差数列, 数列 $\left\{b_{n}\right\}$ 满足 $b_{1}=1, b_{2}=\frac{1}{3}$, $a_{n} b_{n+1}+b_{n+1}=n b_{n}$.

  (I) 求 $\left\{a_{n}\right\}$ 的通项公式;

  (II ) 求 $\left\{b_{n}\right\}$ 的前 $n$ 项和.
