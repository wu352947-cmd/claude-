stem: 为美化环境, 从红、黄、白、紫 4 种颜色的花中任选 2 种花种在一 个花坛中, 余下的 2 种花种在另一个花坛中, 则红色和紫色的花不在同一花 坛的概率是 $(\quad)$
options:
  A: $\frac{1}{3}$
  B: $\frac{1}{2}$
  C: $\frac{2}{3}$
  D: $\frac{5}{6}$
answer: C
solution: |-
  解: 从红、黄、白、紫 4 种颜色的花中任选 2 种花种在一个花坛中, 余 下的 2 种花种在另一个花坛中, 有 $C_{4}^{2}=6$ 种方法, 红色和紫色的花在同一花坛 , 有 2 种方法, 红色和紫色的花不在同一花坛, 有 4 种方法, 所以所求的概 率为 $\frac{4}{6}=\frac{2}{3}$.

  另解: 由列举法可得, 红、黄、白、紫记为 $1,2,3,4$,

  即有 $(12,34),(13,24),(14,23),(23,14),(24,13),(34$,

  12)

  则 $P=\frac{4}{6}=\frac{2}{3}$.

  故选: C.
