stem: 设向量 $\vec{a}=(x, x+1), \vec{b}=(1,2)$, 且 $\vec{a} \perp \vec{b}$, 则 $x=$ ______
answer: -\frac{2}{3}
answer_kind: expr
solution: |-
  解: $\because \overrightarrow{\mathrm{a}} \perp \overrightarrow{\mathrm{b}}$;

  $\therefore \vec{a} \cdot \vec{b}=0$

  即 $x+2(x+1)=0$;

  $\therefore x=-\frac{2}{3}$.

  故答案为: $-\frac{2}{3}$.
