stem: $(2 x+\sqrt{x})^{5}$ 的展开式中, $x^{3}$ 的系数是___. (用数字填写答案)
answer: '10'
answer_kind: expr
solution: |-
  解: $(2 x+\sqrt{x})^{5}$ 的展开式中, 通项公式为: $T_{r+1}=\left[{ }_{5}^{r}(2 x)^{5-r}(\sqrt{x})^{r}=2^{5-r}\right.$ $C_{5}^{r} \cdot x^{5 \frac{r}{2}}$

  令 $5-\frac{r}{2}=3$, 解得 $r=4$

  $\therefore x^{3}$ 的系数 $2 \mathrm{C}_{5}^{4}=10$.

  故答案为: 10 .
