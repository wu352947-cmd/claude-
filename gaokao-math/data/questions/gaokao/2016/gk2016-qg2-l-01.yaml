stem: 已知 $z=(m+3)+(m-1) i$ 在复平面内对应的点在第四象限, 则实 数 $m$ 的取值范围是 $(\quad)$
options:
  A: $(-3,1)$
  B: $(-1,3)$
  C: $(1,+\infty)$
  D: $(-\infty,-3)$
answer: A
solution: |-
  解: $z=(m+3)+(m-1) \mathrm{i}$ 在复平面内对应的点在第四象限,

  可得: $\left\{\begin{array}{l}m+3>0 \\ m-1<0\end{array}\right.$, 解得 $-3<m<1$.

  故选: A.
