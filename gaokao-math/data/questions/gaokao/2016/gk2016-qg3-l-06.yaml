stem: 已知 $a=2^{\frac{4}{3}}, b=3^{\frac{2}{3}}, c=25^{\frac{1}{3}}$, 则 ( )
options:
  A: $b<a<c$
  B: $a<b<c$
  C: $\mathrm{b}<\mathrm{c}<\mathrm{a}$
  D: $c<a<b$
answer: A
solution: |-
  解: $\because a=2^{\frac{4}{3}}=4^{\frac{2}{3}}$,

  $b=3^{\frac{2}{3}}$

  $\mathrm{C}=25^{\frac{1}{3}}=5^{\frac{2}{3}}$

  综上可得： $b<a<c$,

  故选: A.
