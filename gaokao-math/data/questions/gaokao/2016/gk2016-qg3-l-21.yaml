difficulty_label: 压轴
stem: |-
  设函数 $f(x)=a \cos 2 x+(a-1)(\cos x+1)$, 其中 $a>0$, 记f $(x)$ |的最大值为 $A$.
  (I) 求 $f^{\prime}(X)$;
  (II) 求 $A$;
  (III) 证明: If' $(x) \mid \leqslant 2 A$.
