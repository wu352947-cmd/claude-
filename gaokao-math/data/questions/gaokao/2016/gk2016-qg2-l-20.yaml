stem: |-
  已知椭圆 $E: \frac{x^{2}}{t}+\frac{y^{2}}{3}=1$ 的焦点在 $x$ 轴上, $A$ 是 $E$ 的左顶点, 斜率 为 $k(k>0)$ 的直线交 $E$ 于 $A, M$ 两点, 点 $N$ 在 $E$ 上, $M A \perp N A$.

  （I ) 当 $t=4,|A M|=|A N|$ 时, 求 $\triangle A M N$ 的面积;

  （II）当 $2|\mathrm{AM}|=|\mathrm{AN}|$ 时, 求 $\mathrm{k}$ 的取值范围.
