stem: |-
  $\triangle A B C$ 的内角 $A, B, C$ 的对边分别为 $a, b, c$, 已知 $2 \cos C$ ( $a \cos B+b \cos A)=c$.

  (I) 求 C;

  (II ) 若 $\mathrm{c}=\sqrt{7}, \triangle \mathrm{ABC}$ 的面积为 $\frac{3 \sqrt{3}}{2}$, 求 $\triangle \mathrm{ABC}$ 的周长.
