solution: |-
  解: ( I ) $\because$ 在 $\triangle \mathrm{ABC}$ 中, $0<C<\pi, \therefore \sin C \neq 0$

  已知等式利用正弦定理化简得: $2 \cos C(\sin A \cos B+\sin B \cos A)=\sin C$,

  整理得: $2 \cos C \sin (A+B)=\sin C$,

  即 $2 \cos C \sin (\pi-(A+B))=\sin C$

  $2 \cos C \sin C=\sin C$

  $\therefore \cos \mathrm{C}=\frac{1}{2}$,

  $\therefore \mathrm{C}=\frac{\pi}{3}$

  (II) 由余弦定理得 $7=\mathrm{a}^{2}+\mathrm{b}^{2}-2 \mathrm{ab} \cdot \frac{1}{2}$,

  $\therefore(a+b)^{2}-3 a b=7$

  $\because \mathrm{S}=\frac{1}{2} \mathrm{absinc}=\frac{\sqrt{3}}{4} \mathrm{ab}=\frac{3 \sqrt{3}}{2}$,

  $\therefore a b=6$,

  $\therefore(a+b)^{2}-18=7$

  $\therefore a+b=5$,

  $\therefore \triangle \mathrm{ABC}$ 的周长为 $5+\sqrt{7}$.
