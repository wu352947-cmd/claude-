stem: |-
  $\alpha, \beta$ 是两个平面, $m, n$ 是两条直线, 有下列四个命题:

  (1)如果 $m \perp n, m \perp \alpha, n / / \beta$, 那么 $\alpha \perp \beta$.

  (2)如果 $m \perp \alpha, n / / \alpha$, 那么 $m \perp n$.

  (3)如果 $\alpha / / \beta, m \subset \alpha$, 那么 $m / / \beta$.

  (4)如果 $m / / n, \alpha / / \beta$, 那么 $m$ 与 $\alpha$ 所成的角和 $n$ 与 $\beta$ 所成的角相等.

  其中正确的命题是 (填序号)
parts:
- label: 答案
  points: 5.0
  answer: (2)(3)
  rubric:
  - 与参考答案一致即得分
solution: |-
  解: (1)如果 $m \perp n, m \perp \alpha, n / / \beta$, 不能得出 $\alpha \perp \beta$, 故错误; (2)如果 $n / / \alpha$, 则存在直线 $I \subset \alpha$, 使 $n / / l$, 由 $m \perp \alpha$, 可得 $m \perp l$, 那么 $m \perp n$. 故 正确;

  (3)如果 $\alpha / / \beta, m \subset \alpha$, 那么 $m$ 与 $\beta$ 无公共点, 则 $m / / \beta$. 故正确

  (4)如果 $m / / n, \alpha / / \beta$, 那么 $m, n$ 与 $\alpha$ 所成的角和 $m, n$ 与 $\beta$ 所成的角均相等.

  故正确;

  故答案为: (2)(3)
