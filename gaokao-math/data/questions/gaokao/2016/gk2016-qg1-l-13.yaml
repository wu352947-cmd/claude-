stem: 设向量 $\vec{a}=(m, 1), \vec{b}=(1,2)$, 且 $|\vec{a}+\vec{b}|^{2}=|\vec{a}|^{2}+|\vec{b}|^{2}$, 则 $m=$ ______
answer: '-2'
answer_kind: expr
solution: |-
  解: $|\vec{a}+\vec{b}|^{2}=|\vec{a}|^{2}+|\vec{b}|^{2}$,

  可得 $\vec{a} \cdot \vec{b}=0$.

  向量 $\vec{a}=(m, 1), \vec{b}=(1,2)$,

  可得 $m+2=0$, 解得 $m=-2$.

  故答案为: -2 .
