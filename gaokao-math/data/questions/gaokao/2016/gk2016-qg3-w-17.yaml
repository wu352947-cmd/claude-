stem: |-
  已知各项都为正数的数列 $\left\{a_{n}\right\}$ 满足 $a_{1}=1, a_{n}{ }^{2}-\left(2 a_{n+1}-1\right) a_{n}-2 a_{n+1}=0$.
  (1) 求 $a_{2}, a_{3}$;
  (2) 求 $\left\{a_{n}\right\}$ 的通项公式.
