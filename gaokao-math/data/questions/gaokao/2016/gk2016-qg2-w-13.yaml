stem: 已知向量 $\vec{a}=(m, 4), \vec{b}=(3,-2)$, 且 $\vec{a} / / \vec{b}$, 则 $m=$ ______
answer: '-6'
answer_kind: expr
solution: |-
  解: 向量 $\vec{a}=(m, 4), \vec{b}=(3,-2)$, 且 $\vec{a} / / \vec{b}$,

  可得 $12=-2 m$, 解得 $m=-6$.

  故答案为: -6 .
