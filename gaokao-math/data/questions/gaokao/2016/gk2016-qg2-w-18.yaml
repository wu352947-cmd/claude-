stem: |-
  某险种的基本保费为 a（单位: 元), 继续购买该险种的投保人称 为续保人, 续保人本年度的保费与其上年度出险次数的关联如下:

  $$\begin{array}{|c|c|c|c|c|c|c|}\hline \text{上年度出险次数} & 0 & 1 & 2 & 3 & 4 & \geqslant 5 \\ \hline \text{保费} & 0.85 a & a & 1.25 a & 1.5 a & 1.75 a & 2 a \\ \hline \end{array}$$

  随机调查了该险种的 200 名续保人在一年内的出险情况, 得到如下统计表:

  $$\begin{array}{|c|c|c|c|c|c|c|}\hline \text{出险次数} & 0 & 1 & 2 & 3 & 4 & \geqslant 5 \\ \hline \text{频数} & 60 & 50 & 30 & 30 & 20 & 10 \\ \hline \end{array}$$

  （I）记 $A$ 为事件: “一续保人本年度的保费不高于基本保费”. 求 $P$ ( $A$ ）的估计 值;

  ( II ) 记 B 为事件: “一续保人本年度的保费高于基本保费但不高于基本保费的 $160 \%$ ". 求 P (B) 的估计值;

  (III) 求续保人本年度的平均保费估计值.
