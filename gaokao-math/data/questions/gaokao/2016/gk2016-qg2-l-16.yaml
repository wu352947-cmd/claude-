stem: 若直线 $y=k x+b$ 是曲线 $y=\ln x+2$ 的切线, 也是曲线 $y=\ln (x+1 ）$ 的切 线, 则 $b=$ ______
answer: 1-\ln 2
answer_kind: expr
solution: |-
  解：设 $y=k x+b$ 与 $y=\ln x+2$ 和 $y=\ln (x+1)$ 的切点分别为 $\left(x_{1}, k x_{1}+b\right)$ 、 $\left(\mathrm{x}_{2}, \mathrm{kx} \mathrm{x}_{2}+\mathrm{b}\right)$;

  由导数的几何意义可得 $k=\frac{1}{x_{1}}=\frac{1}{x_{2}+1}$, 得 $x_{1}=x_{2}+1$

  再由切点也在各自的曲线上, 可得 $\left\{\begin{array}{l}k x_{1}+b=\ln x_{1}+2 \\ k x_{2}+b=\ln \left(x_{2}+1\right)\end{array}\right.$

  联立上述式子解得 $\left\{\begin{array}{l}k=2 \\ x_{1}=\frac{1}{2} \\ x_{2}=-\frac{1}{2}\end{array}\right.$;

  故答案为:$1-\ln 2$.
