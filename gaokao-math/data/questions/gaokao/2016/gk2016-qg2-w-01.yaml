stem: 已知集合 $A=\{1,2,3\}, B=\left\{x \mid x^{2}<9\right\}$, 则 $A \cap B=（ \quad ）$
options:
  A: $\{-2,-1,0,1,2,3\}$
  B: $\{-2,-1,0,1,2\}$
  C: $\{1,2,3\}$
  D: $\{1,2\}$
answer: D
solution: |-
  解: $\because$ 集合 $A=\{1,2,3\}, B=\left\{x \mid x^{2}<9\right\}=\{x \mid-3<x<3\}$,

  $\therefore A \cap B=\{1,2\}$.

  故选: D.
