stem: 圆 $x^{2}+y^{2}-2 x-8 y+13=0$ 的圆心到直线 $a x+y-1=0$ 的距离为 1 , 则 $a=($
options:
  A: $-\frac{4}{3}$
  B: $-\frac{3}{4}$
  C: $\sqrt{3}$
  D: '2'
answer: A
solution: |-
  解：圆 $x^{2}+y^{2}-2 x-8 y+13=0$ 的圆心坐标为: $(1,4)$,

  故圆心到直线 $a x+y-1=0$ 的距离 $d=\frac{|a+4-1|}{\sqrt{a^{2}+1}}=1$,

  解得: $a=-\frac{4}{3}$,

  故选: A.
