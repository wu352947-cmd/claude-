stem: 设 $(1+2 i)(a+i)$ 的实部与虚部相等, 其中 $a$ 为实数, 则 $a$ 等于 $(\quad)$
options:
  A: '-3'
  B: '-2'
  C: '2'
  D: '3'
answer: A
solution: |-
  解: $(1+2 i)(a+i)=a-2+(2 a+1) i$ 的实部与虚部相等,

  可得： $a-2=2 a+1$,

  解得 $a=-3$.

  故选: A.
