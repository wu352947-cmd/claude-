points: 5.0
stem: 若 $z=1+2 i$, 则 $\frac{4 i}{z \cdot \bar{z}-1}=(\quad)$
options:
  A: '1'
  B: '-1'
  C: i
  D: $-\mathrm{i}$
answer: C
solution: |-
  解: $z=1+2 i$, 则 $\frac{4 i}{z \bar{z}-1}=\frac{4 i}{(1+2 i)(1-2 i)-1}=\frac{4 i}{5-1}=i$.

  故选: C.
