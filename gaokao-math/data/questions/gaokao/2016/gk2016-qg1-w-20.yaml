stem: |-
  在直角坐标系 $x O y$ 中, 直线 $I: y=t （ t \neq 0)$ 交 $y$ 轴于点 $M$, 交抛物 线 $C: y^{2}=2 p x(p>0)$ 于点 $P, M$ 关于点 $P$ 的对称点为 $N$, 连结 $O N$ 并延长交 $C$ 于点 $\mathrm{H}$.

  ( I ) 求 $\frac{|\mathrm{OH}|}{|\mathrm{ON}|}$;

  (II) 除 $\mathrm{H}$ 以外, 直线 $\mathrm{MH}$ 与 $\mathrm{C}$ 是否有其它公共点? 说明理由.
