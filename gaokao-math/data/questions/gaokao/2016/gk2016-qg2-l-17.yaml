stem: |-
  $S_{n}$ 为等差数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和, 且 $a_{1}=1, S_{7}=28$, 记 $b_{n}=\left[\lg a_{n}\right]$, 其 中 $[\mathrm{x}]$ 表示不超过 $\mathrm{x}$ 的最大整数, 如 $[0.9]=0,[\lg 99]=1$.

  (I) 求 $b_{1}, b_{11}, b_{101}$ ；

  (II) 求数列 $\left\{b_{n}\right\}$ 的前 1000 项和.
