stem: |-
  设函数 $f(x)=\ln x-x+1$.

  （1）讨论 $f(x)$ 的单调性;

  （2） 证明当 $x \in(1,+\infty)$ 时, $1<\frac{x-1}{\ln x}<x$;

  （3） 设 $c>1$, 证明当 $x \in(0,1)$ 时, $1+(c-1) x>c^{x}$.
