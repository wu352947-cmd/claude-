stem: 设 $f(x)$ 为奇函数, 且当 $x \geq 0$ 时, $f(x)=e^{x}-1$, 则当 $x<0$ 时, $f(x)=$
options:
  A: $e^{-x}-1$
  B: $\mathrm{e}^{-x}+1$
  C: $-\mathrm{e}^{-x}-1$
  D: $-\mathrm{e}^{-x}+1$
answer: D
solution: 【详解】 $\because f(x)$ 是奇函数, $f^{\prime}\left(x_{0}\right)=\frac{1}{x_{0}}+\frac{1}{x_{0}^{2}}$. 当 $x<0$ 时, $-x>0$, $f(-x)=\mathrm{e}^{-x}-1=-f(x)$, 得 $f(x)=-\mathrm{e}^{-x}+1$. 故选 $\mathrm{D}$.
