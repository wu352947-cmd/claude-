stem: 已知 $a \in\left(0, \frac{\pi}{2}\right), 2 \sin 2 \alpha=\cos 2 \alpha+1$, 则 $\sin \alpha=$
options:
  A: $\frac{1}{5}$
  B: $\frac{\sqrt{5}}{5}$
  C: $\frac{\sqrt{3}}{3}$
  D: $\frac{2 \sqrt{5}}{5}$
answer: B
solution: 【详解】 $\because 2 \sin 2 a=\cos 2 a+1, \therefore 4 \sin a \cdot \cos a=2 \cos ^{2} a \because a \in\left(0, \frac{\pi}{2}\right), \therefore \cos a>0$. $\sin a>0, \quad \therefore \quad 2 \sin a=\cos a$, 又 $\sin ^{2} a+\cos ^{2} a=1, \quad \therefore 5 \sin ^{2} a=1, \quad \sin ^{2} a=\frac{1}{5}$, 又 $\sin a>0, \therefore \sin a=\frac{\sqrt{5}}{5}$, 故选 B.
