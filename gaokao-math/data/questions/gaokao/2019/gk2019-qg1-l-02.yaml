stem: 设复数 $z$ 满足 $|z-\mathrm{i}|=1, z$ 在复平面内对应的点为 $(x, y)$, 则
options:
  A: $(x+1)^{2}+y^{2}=1$
  B: $(x-1)^{2}+y^{2}=1$
  C: $x^{2}+(y-1)^{2}=1$
  D: $x^{2}+(y+1)^{2}=1$
answer: C
solution: 【详解】 $z=x+y i, z-i==x+(y-1) i,|z-i|=\sqrt{x^{2}+(y-1)^{2}}=1$, 则 $x^{2}+(y-1)^{2}=1$. 故选 C.
