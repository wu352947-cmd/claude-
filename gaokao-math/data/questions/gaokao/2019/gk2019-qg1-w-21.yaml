difficulty_label: 压轴
stem: |-
  已知点 $A, B$ 关于坐标原点 $O$ 对称, $|A B|=4, \odot M$ 过点 $A, B$ 且与直线 $x+2=0$ 相切.

  (1) 若 $A$ 在直线 $x+y=0$ 上, 求 $\odot M$ 的半径.

  (2) 是否存在定点 $P$, 使得当 $A$ 运动时, $|M A|-|M P|$ 为定值? 并说明理由.
