stem: 设 $z=-3+2 \mathrm{i}$, 则在复平面内 $\bar{z}$ 对应的点位于
options:
  A: 第一象限
  B: 第二象限
  C: 第三象限
  D: 第四象限
answer: C
solution: 【详解】由 $z=-3+2 i$, 得 $\bar{z}=-3-2 i$, 则 $\bar{z}=-3-2 i$, 对应点 $(-3,-2)$ 位于第三象限. 故选 $\mathrm{C}$.
