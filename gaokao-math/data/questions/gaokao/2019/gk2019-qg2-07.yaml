stem: 设 $\alpha, \beta$ 为两个平面, 则 $\alpha / / \beta$ 的充要条件是
options:
  A: $\alpha$ 内有无数条直线与 $\beta$ 平行
  B: $\alpha$ 内有两条相交直线与 $\beta$ 平行
  C: $\alpha, \beta$ 平行于同一条直线
  D: $\alpha, \beta$ 垂直于同一平面
answer: B
solution: '【详解】由面面平行的判定定理知: $a$ 内两条相交直线都与 $\beta$ 平行是 $a / / \beta$ 的充分条件, 由面面平行性质定理知, 若 $a / / \beta$, 则 $a$ 内任意一条直线都与 $\beta$ 平行, 所以 $a$ 内两条相交 直线都与 $\beta$ 平行是 $a / / \beta$ 的必要条件, 故选 B.'
