stem: 若 $z(1+\mathrm{i})=2 \mathrm{i}$ ，则 $z=(\quad)$
options:
  A: $-1-\mathrm{i}$
  B: $-1+\mathrm{i}$
  C: $1-\mathrm{i}$
  D: $1+\mathrm{i}$
answer: D
solution: 【详解】 $z=\frac{2 \mathrm{i}}{1+\mathrm{i}}=\frac{2 \mathrm{i}(1-\mathrm{i})}{(1+\mathrm{i})(1-\mathrm{i})}=1+\mathrm{i}$. 故选 D.
