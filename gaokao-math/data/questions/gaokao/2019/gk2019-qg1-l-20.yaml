stem: |-
  已知函数 $f(x)=\sin x-\ln (1+x), f^{\prime}(x)$ 为 $f(x)$ 的导数. 证明:

  (1) $f^{\prime}(x)$ 在区间 $\left(-1, \frac{\pi}{2}\right)$ 存在唯一极大值点;

  (2) $f(x)$ 有且仅有 2 个零点.
