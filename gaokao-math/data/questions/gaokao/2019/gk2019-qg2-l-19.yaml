solution: |-
  【详解】(1)由题意可知 $4 a_{n+1}=3 a_{n}-b_{n}+4,4 b_{n+1}=3 b_{n}-a_{n}-4, a_{1}+b_{1}=1, a_{1}-b_{1}=1$, 所以 $4 a_{n+1}+4 b_{n+1}=3 a_{n}-b_{n}+4+3 b_{n}-a_{n}-4=2 a_{n}+2 b_{n}$, 即 $a_{n+1}+b_{n+1}=\frac{1}{2}\left(a_{n}+b_{n}\right)$, 所以数列 $\left\{a_{n}+b_{n}\right\}$ 是首项为 1 、公比为 $\frac{1}{2}$ 的等比数列, $a_{n}+b_{n}=\left(\frac{1}{2}\right)^{n-1}$, 因为 $4 a_{n+1}-4 b_{n+1}=3 a_{n}-b_{n}+4-\left(3 b_{n}-a_{n}-4\right)=4 a_{n}-4 b_{n}+8$, 所以 $a_{n+1}-b_{n+1}=a_{n}-b_{n}+2$, 数列 $\left\{a_{n}-b_{n}\right\}$ 是首项 1 公差为 2 的等差数列, $a_{n}-b_{n}=2 n-1$

  (2)由(1)可知, $a_{n}+b_{n}=\left(\frac{1}{2}\right)^{n-1}, a_{n}-b_{n}=2 n-1$,

  所以 $a_{n}=\frac{1}{2}\left(a_{n}+b_{n}+a_{n}-b_{n}\right)=\frac{1}{2^{n}}+n-\frac{1}{2}, b_{n}=\frac{1}{2}$ 轾 战 $^{n}+b_{n}-\left(a_{n}-b_{n}\right)=\frac{1}{2^{n}}-n+\frac{1}{2}$ 。
