source: 2019 全国II卷（文科） 第 5 题 · 来源：GAOKAO-Bench（Apache-2.0）
year: 2019
kps:
  novel.definition: 1.0
difficulty_label: 基础
points: 5.0
stem: |-
  在 “一带一路” 知识测验后, 甲、乙、丙三人对成绩进行预测.

  甲: 我的成绩比乙高.

  乙: 丙的成绩比我和甲的都高.

  丙: 我的成绩比乙高.

  成绩公布后, 三人成绩互不相同且只有一个人预测正确，那么三人按成绩由高到低的次 序为
options:
  A: 甲、乙、丙
  B: 乙、甲、丙
  C: 丙、乙、甲
  D: 甲、丙、乙
answer: A
solution: 【详解】若甲预测正确, 则乙、丙预测错误, 则甲比乙成绩高, 丙比乙成绩低, 故 3 人成绩 由高到低依次为甲, 乙, 丙; 若乙预测正确, 则丙预测也正确, 不符合题意; 若丙预测正确, 则甲必预测错误, 丙比乙的成绩高, 乙比甲成绩高, 即丙比甲, 乙成绩都高, 即乙预测正确, 不符合题意, 故选 $\mathrm{A}$.
