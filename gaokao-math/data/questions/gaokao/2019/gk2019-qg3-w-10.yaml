stem: '已知 $F$ 是双曲线 $C: \frac{x^{2}}{4}-\frac{y^{2}}{5}=1$ 的一个焦点, 点 $P$ 在 $C$ 上, $O$ 为坐标原点, 若 $|O P|=|O F|$, 则 $\triangle O P F$ 的面积为 $($ ）'
options:
  A: $\frac{3}{2}$
  B: $\frac{5}{2}$
  C: $\frac{7}{2}$
  D: $\frac{9}{2}$
answer: B
solution: 【详解】 设点 $P\left(x_{0}, y_{0}\right)$, 则 $\frac{x_{0}^{2}}{4}-\frac{y_{0}^{2}}{5}=1$ (1). 又 $|O P|=|O F|=\sqrt{4+5}=3$ ， $\therefore x_{0}^{2}+y_{0}^{2}=9$ (2). 由 (1)(2) 得 $y_{0}^{2}=\frac{25}{9}$, 即 $\left|y_{0}\right|=\frac{5}{3}$, $\therefore S_{\triangle O P F}=\frac{1}{2}|O F| \cdot\left|y_{0}\right|=\frac{1}{2} \times 3 \times \frac{5}{3}=\frac{5}{2}$. 故选 B.
