stem: '甲、乙两队进行篮球决赛，采取七场四胜制（当一队赢得四场胜利时, 该队获胜，决赛 结束). 根据前期比赛成绩, 甲队的主客场安排依次为“主主客客主客主”. 设甲队主场取胜 的概率为 0.6 , 客场取胜的概率为 0.5 , 且各场比赛结果相互独立, 则甲队以 $4: 1$ 获胜的概 率是 ______'
answer: '0.216'
answer_kind: expr
solution: '【详解】前五场中有一场客场输时, 甲队以 $4: 1$ 获胜的概率是 $0.6^{3} \times 0.5 \times 0.5 \times 2=0.108$, 前五场中有一场主场输时, 甲队以 $4: 1$ 获胜的概率是 $0.4 \times 0.6^{2} \times 0.5^{2} \times 3=0.108$, 综上所述，甲队以 $4: 1$ 获胜的概率是 $q \neq 00.108+0.108=0.216$.'
