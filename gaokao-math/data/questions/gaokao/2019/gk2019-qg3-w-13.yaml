stem: 已知向量 $\vec{a}=(2,2), \vec{b}=(-8,6)$, 则 $\cos \langle\vec{a}, \vec{b}\rangle=$ ______
answer: -\frac{\sqrt{2}}{10}
answer_kind: expr
solution: '【详解】详解: $\cos \langle\vec{a}, \vec{b}\rangle=\frac{\vec{a} \cdot \vec{b}}{|\vec{a}| \cdot|\vec{b}|}=\frac{2 \times(-8)+2 \times 6}{\sqrt{2^{2}+2^{2}} \times \sqrt{(-8)^{2}+6^{2}}}=-\frac{\sqrt{2}}{10}$.'
