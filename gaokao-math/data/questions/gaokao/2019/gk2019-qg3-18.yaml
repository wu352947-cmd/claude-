stem: |-
  $\triangle A B C$ 的内角 $A, B, C$ 的对边分别为 $a, b, c$, 已知 $a \sin \frac{A+C}{2}=b \sin A$.

  (1) 求 $B$;

  (2) 若 $\triangle A B C$ 为锐角三角形, 且 $c=1$, 求 $\triangle A B C$ 面积的取值范围.
