stem: |-
  某商场为提高服务质量, 随机调查了 50 名男顾客和 50 名女顾客, 每位顾客对该商场的 服务给出满意或不满意的评价, 得到下面列联表:

  $$\begin{array}{|l|l|l|}\hline  & \text{满意} & \text{不满意} \\ \hline \text{男顾客} & 40 & 10 \\ \hline \text{女顾客} & 30 & 20 \\ \hline \end{array}$$

  （1）分别估计男、女顾客对该商场服务满意的概率;

  （2）能否有 $95 \%$ 的把握认为男、女顾客对该商场服务的评价有差异?

  附: $K^{2}=\frac{n(a d-b c)^{2}}{(a+b)(c+d)(a+c)(b+d)}$.

  $$\begin{array}{|c|c|c|c|}\hline P\left(K^{2} \geq k\right) & 0.050 & 0.010 & 0.001 \\ \hline k & 3.841 & 6.635 & 10.828 \\ \hline \end{array}$$
parts:
