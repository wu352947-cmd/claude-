stem: |-
  已知 $F_{1}, F_{2}$ 是椭圆 $C: \frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}=1(a>b>0)$ 的两个焦点, $P$ 为 $C$ 上一点, $O$ 为坐标原点.

  (1) 若 $\bigvee P O F_{2}$ 为等边三角形, 求 $C$ 的离心率;

  (2)如果存在点 $P$, 使得 $P F_{1} \perp P F_{2}$, 且 $\triangle F_{1} P F_{2}$ 的面积等于 16 , 求 $b$ 的值和 $a$ 的 取值范围.
