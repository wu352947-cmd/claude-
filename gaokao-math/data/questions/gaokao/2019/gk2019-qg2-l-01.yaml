stem: 设集合 $A=\left\{x \mid x^{2}-5 x+6>0\right\}, B=\{x \mid x-1<0\}$, 则 $A \cap B=$
options:
  A: $(-\infty, 1)$
  B: $(-2,1)$
  C: $(-3,-1)$
  D: $(3,+\infty)$
answer: A
solution: 【详解】由题意得, $A=\{x \mid x 2$, 或 $x 3\}, B=\{x \mid x<1\}$, 则 $A \cap B=\{x \mid x<1\}$. 故选 A.
