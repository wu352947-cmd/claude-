source: 2019 全国III卷 第 4 题 · 来源：GAOKAO-Bench（Apache-2.0）
year: 2019
kps:
  prob.classical: 1.0
difficulty_label: 基础
points: 5.0
stem: 《西游记》《三国演义》《水淓传》和《红楼梦》是中国古典文学瑰宝, 并称为中国古典小 说四大名著.某中学为了解本校学生阅读四大名著的情况, 随机调查了 100 学生, 其中阅读 过《西游记》或《红楼梦》的学生共有 90 位, 阅读过《红楼梦》的学生共有 80 位, 阅读过 《西游记》且阅读过《红楼梦》的学生共有 60 位, 则该校阅读过《西游记》的学生人数与 该校学生总数比值的估计值为（）
options:
  A: '0.5'
  B: '0.6'
  C: '0.7'
  D: '0.8'
answer: C
solution: 【详解】由题意得, 阅读过 《西游记》的学生人数为 $90-80+60=70$, 则其与该校学生人数之 比为 $70 \div 100=0$. 7 . 故选 C.
