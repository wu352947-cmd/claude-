stem: 已知集合 $A=\{-1,0,1,2\}, B=\left\{x \mid x^{2} \leq 1\right\}$, 则 $A \cap B=(\quad)$
options:
  A: $\{-1,0,1\}$
  B: $\{0,1\}$
  C: $\{-1,1\}$
  D: $\{0,1,2\}$
answer: A
solution: 【详解】由题意得, $B=\{x \mid-1 \leq x \leq 1\}$, 则 $A \cap B=\{-1,0,1\}$. 故选 A.
