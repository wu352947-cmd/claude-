difficulty_label: 基础
points: 5.0
stem: 已知向量 $\boldsymbol{a}=(2,3), \boldsymbol{b}=(3,2)$, 则 $|\boldsymbol{a}-\boldsymbol{b}|=$
options:
  A: $\sqrt{2}$
  B: '2'
  C: $5 \sqrt{2}$
  D: '50'
answer: A
solution: |-
  【详解】由已知, $\boldsymbol{a}-\boldsymbol{b}=(2,3)-(3,2)=(-1,1)$,

  所以 $|\boldsymbol{a}-\boldsymbol{b}|=\sqrt{(-1)^{2}+1^{2}}=\sqrt{2}$ ，

  故选 A
