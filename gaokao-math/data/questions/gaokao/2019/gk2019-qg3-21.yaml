stem: |-
  已知曲线 $C: y=\frac{x^{2}}{2}, D$, 为直线 $y=-\frac{1}{2}$ 上的动点, 过 $D$ 作 $C$ 的两条切线, 切点分别为 $A, B$.

  (1) 证明: 直线 $A B$ 过定点:

  (2) 若以 $E\left(0, \frac{5}{2}\right)$ 为圆心的圆与直线 $A B$ 相切, 且切点为线段 $A B$ 的中点, 求该圆的方程.
