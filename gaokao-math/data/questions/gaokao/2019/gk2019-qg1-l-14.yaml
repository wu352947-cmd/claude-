stem: 记 $S_{n}$ 为等比数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和. 若 $a_{1}=\frac{1}{3}, a_{4}^{2}=a_{6}$, 则 $S_{5}=$ ______
answer: \frac{121}{3}
answer_kind: expr
solution: |-
  【详解】设等比数列的公比为 $q$, 由已知 $a_{1}=\frac{1}{3}, a_{4}{ }^{2}=a_{6}$, 所以 $\left(\frac{1}{3} q^{3}\right)^{2}=\frac{1}{3} q^{5}$, 又 $q \neq 0$,

  所以 $q=3$, 所以 $S_{5}=\frac{a_{1}\left(1-q^{5}\right)}{1-q}=\frac{\frac{1}{3}\left(1-3^{5}\right)}{1-3}=\frac{121}{3}$.
