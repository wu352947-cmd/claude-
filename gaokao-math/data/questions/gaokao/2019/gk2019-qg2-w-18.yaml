stem: |-
  已知 $\left\{a_{n}\right\}$ 是各项均为正数的等比数列, $a_{1}=2, a_{3}=2 a_{2}+16$.

  (1) 求 $\left\{a_{n}\right\}$ 的通项公式;

  (2) 设 $b_{n}=\log _{2} a_{n}$, 求数列 $\left\{b_{n}\right\}$ 的前 $n$ 项和.
