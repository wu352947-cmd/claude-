stem: 我国古代典籍《周易》用 “卦” 描述万物的变化. 每一 “重卦” 由从下到上排列的 6 个爻组成, 爻分为阳父 “——” 和阴爻 “- -” , 如图就是一重卦. 在所有重卦中随机取一重卦, 则该重卦恰有 3 个阳爻的概率是
figure: 37ed0e9dcfca9248.png
options:
  A: $\frac{5}{16}$
  B: $\frac{11}{32}$
  C: $\frac{21}{32}$
  D: $\frac{11}{16}$
answer: A
solution: 【详解】由题知，每一爻有 2 中情况，一重卦的 6 爻有 $2^6$ 情况，其中 6 爻中恰有 3 个阳爻情况有 $\mathrm{C}_6^3$, 所以该重卦恰有 3 个阳父的概率为 $\frac{C_6^3}{2^6}=\frac{5}{16}$, 故选 A.
