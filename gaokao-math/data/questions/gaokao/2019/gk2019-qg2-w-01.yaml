stem: 已知集合 $A=\{x \mid x>-1\}, B=\{x \mid x<2\}$, 则 $A \cap B=$
options:
  A: $(-1,+\infty)$
  B: $(-\infty, 2)$
  C: $(-1,2)$
  D: $\varnothing$
answer: C
solution: 【详解】由题知, $A \cap B=(-1,2)$, 故选 C.
