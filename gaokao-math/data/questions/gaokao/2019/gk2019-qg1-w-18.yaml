stem: |-
  记 $S_{n}$ 为等差数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和, 已知 $S_{9}=-a_{5}$.

  (1) 若 $a_{3}=4$, 求 $\left\{a_{n}\right\}$ 的通项公式;

  (2) 若 $a_{1}>0$, 求使得 $S_{n} \geq a_{n}$ 的 $n$ 的取值范围.
