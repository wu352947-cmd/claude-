stem: 我国高铁发展迅速, 技术先进. 经统计, 在经停某站的高铁列车中, 有 10 个车次的正点 率为 0.97 , 有 20 个车次的正点率为 0.98 , 有 10 个车次的正点率为 0.99 , 则经停该站高铁列 车所有车次的平均正点率的估计值为 ______
answer: '0.98'
answer_kind: expr
solution: 【详解】由题意得, 经停该高铁站的列车正点数约为 $10 \times 0.97+20 \times 0.98+10 \times 0.99=39.2$, 其中高铁个数为 $10+20+10=40$, 所以该站所有高 铁平均正点率约为 $\frac{39.2}{40}=0.98$.
