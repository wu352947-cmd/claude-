stem: '设 $F$ 为双曲线 $C: \frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}=1(a>0, b>0)$ 的右焦点, $O$ 为坐标原点, 以 $O F$ 为直径的 圆与圆 $x^{2}+y^{2}=a^{2}$ 交于 $P$、 $Q$ 两点. 若 $|P Q|=|O F|$, 则 $C$ 的离心率为'
