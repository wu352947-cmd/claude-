difficulty_label: 压轴
stem: |-
  已知点 $A(-2,0), B(2,0)$, 动点 $M(x, y)$ 满足直线 $A M$ 与 $B M$ 的斜率之积为 $-\frac{1}{2}$. 记 $M$ 的轨 迹为曲线 $C$. (1) 求 $C$ 的方程, 并说明 $C$ 是什么曲线;

  (2) 过坐标原点的直线交 $C$ 于 $P, Q$ 两点, 点 $P$ 在第一象限, $P E \perp x$ 轴, 垂足为 $E$, 连结 $Q E$ 并延长交 $C$ 于点 $G$.

  (i) 证明: $\triangle P Q G$ 是直角三角形;

  (ii) 求 $\triangle P Q G$ 面积的最大值.
