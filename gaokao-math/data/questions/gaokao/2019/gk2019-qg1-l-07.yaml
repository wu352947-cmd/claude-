stem: 已知非零向量 $\boldsymbol{a}, \boldsymbol{b}$ 满足 $|a|=2|b|$, 且 $(\boldsymbol{a}-\boldsymbol{b}) \perp \boldsymbol{b}$, 则 $\boldsymbol{a}$ 与 $\boldsymbol{b}$ 的夹角为
options:
  A: $\frac{\pi}{6}$
  B: $\frac{\pi}{3}$
  C: $\frac{2 \pi}{3}$
  D: $\frac{5 \pi}{6}$
answer: B
solution: 【详解】因为 $(a-b) \perp b$, 所以 $(a-b) \cdot b=a \cdot b-b^{2}=0$, 所以 $a \cdot b=b^{2}$, 所以 $\cos \theta=\frac{a \cdot b}{|a| \cdot|b|}=\frac{|b|^{2}}{2|b|^{2}}=\frac{1}{2}$, 所以 $a$ 与 $b$ 的夹角为 $\frac{\pi}{3}$, 故选 B.
