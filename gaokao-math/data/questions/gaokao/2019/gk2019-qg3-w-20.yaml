stem: |-
  已知函数 $f(x)=2 x^{3}-a x^{2}+2$.

  (1) 讨论 $f(x)$ 的单调性;

  (2) 当 $0<a<3$ 时, 记 $f(x)$ 在区间 $[0,1]$ 的最大值为 $M$, 最小值为 $m$, 求 $M-m$ 的取值范 围。
