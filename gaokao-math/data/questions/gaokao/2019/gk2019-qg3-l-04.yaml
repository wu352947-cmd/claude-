stem: $\left(1+2 x^{2}\right)(1+x){ }^{4}$ 的展开式中 $x^{3}$ 的系数为
options:
  A: '12'
  B: '16'
  C: '20'
  D: '24'
answer: A
solution: 【详解】由题意得 $x^{3}$ 的系数为 $C_{4}^{3}+2 C_{4}^{1}=4+8=12$, 故选 A.
