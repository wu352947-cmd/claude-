stem: |-
  设函数 $f(x)=x\left(e^{x}-1\right)-a x^{2}$

  (I) 若 $a=\frac{1}{2}$, 求 $f(x)$ 的单调区间;

  (II) 若当 $x \geqslant 0$ 时 $f(x) \geqslant 0$, 求 $a$ 的取值范围.
