stem: |-
  为调查某地区老年人是否需要志愿者提供帮助, 用简单随机抽样 方法从该地区调查了 500 位老年人，结果如表:

  $$\begin{array}{|c|c|c|}\hline \text{性别} & \text{男} & \text{女} \\ \hline \text{是否需要志愿者} &  &  \\ \hline \text{需要} & 40 & 30 \\ \hline \text{不需要} & 160 & 270 \\ \hline \end{array}$$

  （1）估计该地区老年人中，需要志愿者提供帮助的比例;

  (2) 能否有 $99 \%$ 的把握认为该地区的老年人是否需要志愿者提供帮助与性别有 关?

  (3) 根据（2）的结论, 能否提出更好的调查方法来估计该地区的老年人中需要 志愿者提供帮助的老年人比例? 说明理由.

  $$\begin{array}{|c|c|c|c|}\hline P\left(K^{2} \geqslant k\right) & 0.050 & 0.010 & 0.001 \\ \hline  & 3.841 & 6.635 & 10.828 \\ \hline \end{array}$$

  附: $K^{2}=\frac{n(a d-b c)^{2}}{(a+b)(c+d)(a+c)(b+d)}$.
