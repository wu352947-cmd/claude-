stem: |-
  设函数 $f(x)=e^{x}-1-x-a x^{2}$.

  (1) 若 $a=0$, 求 $f(x)$ 的单调区间;

  (2) 若当 $x \geqslant 0$ 时 $f(x) \geqslant 0$, 求 $a$ 的取值范围.
