stem: |-
  设 $F_{1}, F_{2}$ 分别是椭圆 $E: x^{2}+\frac{y^{2}}{b^{2}}=1(0<b<1)$ 的左、右焦点, 过 $F_{1}$ 的直线 与 $E$ 相交于 $A 、 B$ 两点, 且 $\left|A_{2}\right|,|A B|,\left|B_{2}\right|$ 成等差数列.

  ( I ) 求 $|A B|$;

  (II) 若直线 $\mathrm{l}$ 的斜率为 1 , 求 $\mathrm{b}$ 的值.
