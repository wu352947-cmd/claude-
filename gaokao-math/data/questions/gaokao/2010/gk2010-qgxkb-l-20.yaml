stem: |-
  设 $F_{1}, F_{2}$ 分别是椭圆 $E: \frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}=1(a>b>0)$ 的左、右焦点, 过 $F_{1}$ 斜率为 1 的直线 $e$ 与 $E$ 相交于 $A, B$ 两点, 且 $\left|A F_{2}\right|,|A B|,\left|B F_{2}\right|$ 成等差数列

  (1) 求 $E$ 的离心率;

  (2) 设点 $P(0,-1)$ 满足 $|P A|=|P B|$, 求 $E$ 的方程.
