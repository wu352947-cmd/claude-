  points: 7.0
  answer: ''
solution: |-
  解: (1) 由 $a_{n}=a_{1}+(n-1) d$ 及 $a_{3}=5, a_{10}=-9$ 得

  $a_{1}+9 d=-9, a_{1}+2 d=5$

  解得 $d=-2, a_{1}=9$,

  数列 $\left\{a_{n}\right\}$ 的通项公式为 $a_{n}=11-2 n$

  （2）由（1）知 $S_{n}=n a_{1}+\frac{n(n-1)}{2} d=10 n-n^{2}$.

  因为 $S_{n}=-(n-5)^{2}+25$.

  所以 $n=5$ 时, $S_{n}$ 取得最大值.
