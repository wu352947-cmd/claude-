stem: |-
  设数列满足 $a_{1}=2, a_{n+1}-a_{n}=3 \cdot 2^{2 n-1}$

  （1）求数列 $\left\{a_{n}\right\}$ 的通项公式;

  (2) 令 $b_{n}=n a_{n}$, 求数列 $\left\{b_{n}\right\}$ 的前 $n$ 项和 $S_{n}$.
