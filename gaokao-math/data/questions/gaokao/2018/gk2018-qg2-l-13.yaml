stem: 曲线 $y=2 \ln (x+1)$ 在点 $(0,0)$ 处的切线方程为 ______
answer: y=2 x
answer_kind: equation
solution: |-
  解: $\because y=2 \ln (x+1)$,

  $\therefore y^{\prime}=\frac{2}{x+1}$,

  当 $x=0$ 时, $y^{\prime}=2$,

  $\therefore$ 曲线 $y=2 \ln (x+1)$ 在点 $(0,0)$ 处的切线方程为 $y=2 x$.

  故答案为: $y=2 x$.
