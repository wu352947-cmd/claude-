stem: 设 $z=\frac{1-i}{1+i}+2 i$, 则 $|z|=(\quad)$
options:
  A: '0'
  B: $\frac{1}{2}$
  C: '1'
  D: $\sqrt{2}$
answer: C
solution: |-
  解 $: z=\frac{1-i}{1+i}+2 i=\frac{(1-i)(1-i)}{(1-i)(1+i)}+2 i=-i+2 i=i$,

  则 $|z|=1$.

  故选: C.
