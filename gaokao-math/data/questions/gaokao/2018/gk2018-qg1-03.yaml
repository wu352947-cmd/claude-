stem: 某地区经过一年的新农村建设, 农村的经济收入增加了一倍, 实现翻番. 为更好地了解该地区农村的经济收入变化情况, 统计了该地区新农村建设前后农村的经济收入构成比例, 得到如下饼图:则下面结论中不正确的是 ( ）
figure: bddbf673f0c6390f.png
options:
  A: 新农村建设后, 种植收入减少
  B: 新农村建设后, 其他收入增加了一倍以上
  C: 新农村建设后, 养殖收入增加了一倍
  D: 新农村建设后, 养殖收入与第三产业收入的总和超过了经济收入的一半
answer: A
solution: '解: 设建设前经济收入为 $a$, 建设后经济收入为 $2 a$. A 项，种植收入 $37 \% \times 2 a-60 \% a=14 \% a>0$,故建设后, 种植收入增加, 故 A 项错误. B 项，建设后，其他收入为 $5 \% \times 2 a=10 \% a$,建设前, 其他收入为 $4 \% a$,故 $10 \% \mathrm{a} \div 4 \% \mathrm{a}=2.5>2$,故 B 项正确.C 项, 建设后, 养殖收入为 $30 \% \times 2 a=60 \% a$,建设前，养殖收入为 $30 \% \mathrm{a}$,故 $60 \% \mathrm{a} \div 30 \% \mathrm{a}=2$,故 C 项正确.$\mathrm{D}$ 项, 建设后, 养殖收入与第三产业收入总和为 $(30 \%+28 \%) \times 2 a=58 \% \times 2 a$,经济收入为 $2 \mathrm{a}$,故（58\% $\times 2 a ） \div 2 a=58 \%>50 \%$ ，故 D 项正确.因为是选择不正确的一项,故选: A.'
