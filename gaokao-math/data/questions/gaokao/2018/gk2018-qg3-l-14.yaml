stem: 曲线 $y=(a x+1) e^{x}$ 在点 $(0,1)$ 处的切线的斜率为 -2 , 则 $a=$ ______
answer: '-3'
answer_kind: expr
solution: |-
  解: 曲线 $y=(a x+1) e^{x}$, 可得 $y^{\prime}=a e^{x}+(a x+1) e^{x}$,

  曲线 $y=(a x+1) e^{x}$ 在点 $(0,1)$ 处的切线的斜率为 -2 ,

  可得: $a+1=-2$, 解得 $a=-3$.

  故答案为: -3 .
