stem: 已知集合 $A=\left\{(x, y) \mid x^{2}+y^{2} \leqslant 3, x \in Z, y \in Z\right\}$, 则 $A$ 中元素的个数为
options:
  A: '9'
  B: '8'
  C: '5'
  D: '4'
answer: A
solution: |-
  解: 当 $x=-1$ 时, $y^{2} \leqslant 2$, 得 $y=-1,0,1$,

  当 $x=0$ 时, $y^{2} \leqslant 3$, 得 $y=-1,0,1$,

  当 $x=1$ 时, $y^{2} \leqslant 2$, 得 $y=-1,0,1$,

  即集合 $A$ 中元素有 9 个, 故选：A.
