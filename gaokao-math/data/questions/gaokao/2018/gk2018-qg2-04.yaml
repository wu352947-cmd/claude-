stem: 已知向量 $\vec{a}, \vec{b}$ 满足 $|\vec{a}|=1, \vec{a} \cdot \vec{b}=-1$, 则 $\vec{a} \cdot(2 \vec{a}-\vec{b})=(\quad)$
options:
  A: '4'
  B: '3'
  C: '2'
  D: '0'
answer: B
solution: |-
  解: 向量 $\vec{a}, \vec{b}$ 满足 $|\vec{a}|=1, \vec{a} \cdot \vec{b}=-1$, 则 $\vec{a} \bullet(2 \vec{a}-\vec{b})=2 \vec{a}-\vec{a} \cdot \vec{b}=2+1=3$

  故选: B.
