stem: 已知圆锥的顶点为 $S$, 母线 $S A, S B$ 互相垂直, $S A$ 与圆锥底面所成 角为 $30^{\circ}$. 若 $\triangle S A B$ 的面积为 8 , 则该圆锥的体积为 ______
answer: 8 \pi
answer_kind: expr
solution: |-
  解: 圆锥的顶点为 $S$, 母线 $S A, S B$ 互相垂直, $\triangle S A B$ 的面积为 8 , 可得 $: \frac{1}{2} S^{2}=8$, 解得 $\mathrm{SA}=4$,

  $\mathrm{SA}$ 与圆锥底面所成角为 $30^{\circ}$. 可得圆锥的底面半径为: $2 \sqrt{3}$, 圆锥的高为: 2 , 则该圆锥的体积为: $V=\frac{1}{3} \times \pi \times(2 \sqrt{3})^{2} \times 2=8 \pi$.

  故答案为: $8 \pi$.
