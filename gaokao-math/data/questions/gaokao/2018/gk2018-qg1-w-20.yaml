stem: |-
  设抛物线 $C: y^{2}=2 x$, 点 $A(2,0), B(-2,0)$, 过点 $A$ 的直线 $I$ 与 $C$ 交于 $M, N$ 两点.

  （1）当 $\mathrm{l}$ 与 $\mathrm{x}$ 轴垂直时, 求直线 BM 的方程;

  (2) 证明: $\angle \mathrm{ABM}=\angle \mathrm{ABN}$.
