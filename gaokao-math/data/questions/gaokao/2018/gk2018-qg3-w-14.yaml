solution: |-
  解: 某公司有大量客户, 且不同年龄段客户对其服务的评价有较大差异, 为了解客户的评价, 该公司准备进行抽样调查,

  可供选择的抽样方法有简单随机抽样、分层抽样和系统抽样,

  则最合适的抽样方法是分层抽样.

  故答案为: 分层抽样.
