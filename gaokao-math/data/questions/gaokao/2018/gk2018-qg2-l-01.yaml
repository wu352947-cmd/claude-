stem: $\frac{1+2 i}{1-2 i}=(\quad)$
options:
  A: $-\frac{4}{5}-\frac{3}{5} i$
  B: $-\frac{4}{5}+\frac{3}{5} i$
  C: $-\frac{3}{5}-\frac{4}{5} i$
  D: $-\frac{3}{5}+\frac{4}{5} i$
answer: D
solution: |-
  解: $\frac{1+2 i}{1-2 i}=\frac{(1+2 i)(1+2 i)}{(1-2 i)(1+2 i)}=-\frac{3}{5}+\frac{4}{5} i$.

  故选: D.
