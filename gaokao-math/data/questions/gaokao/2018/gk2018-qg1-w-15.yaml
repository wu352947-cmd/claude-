stem: 直线 $y=x+1$ 与圆 $x^{2}+y^{2}+2 y-3=0$ 交于 $A, B$ 两点, 则 $|A B|=$ ______
answer: 2 \sqrt{2}
answer_kind: expr
solution: |-
  解：圆 $x^{2}+y^{2}+2 y-3=0$ 的圆心 $(0,-1)$, 半径为: 2 ,

  圆心到直线的距离为: $\frac{|0+1+1|}{\sqrt{2}}=\sqrt{2}$,

  所以 $|A B|=2 \sqrt{2^{2}-(\sqrt{2})^{2}}=2 \sqrt{2}$.

  故答案为: $2 \sqrt{2}$.
