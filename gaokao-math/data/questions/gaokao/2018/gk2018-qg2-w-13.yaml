stem: 曲线 $y=2 \ln x$ 在点 $(1,0)$ 处的切线方程为 ______
answer: y=2 x-2
answer_kind: equation
solution: |-
  解: $\because y=2 \ln x$,

  $\therefore y^{\prime}=\frac{2}{x}$,

  当 $x=1$ 时,$y^{\prime}=2$

  $\therefore$ 曲线 $y=2 \ln x$ 在点 $(1,0)$ 处的切线方程为 $y=2 x-2$.

  故答案为: $y=2 x-2$.
