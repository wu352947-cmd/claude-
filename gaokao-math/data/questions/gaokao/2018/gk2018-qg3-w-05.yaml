stem: 若某群体中的成员只用现金支付的概率为 0.45 , 既用现金支付也用非 现金支付的概率为 0.15 , 则不用现金支付的概率为 $($ )
options:
  A: '0.3'
  B: '0.4'
  C: '0.6'
  D: '0.7'
answer: B
solution: |-
  解：某群体中的成员只用现金支付, 既用现金支付也用非现金支付, 不 用现金支付，是互斥事件，

  所以不用现金支付的概率为: $1-0.45-0.15=0.4$.

  故选: B.
