stem: 已知函数  $\left\{\begin{array}{l}e^{x}, x \leqslant 0， \\ ln x, x>0 \end{array}, g(x)=f(x)+x+a \right.$.若 $g(x)$ 存在 $2$ 个零点, 则 $a$ 的取值范围是 ($\qquad$)
