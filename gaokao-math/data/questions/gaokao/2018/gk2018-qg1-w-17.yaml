stem: |-
  已知数列 $\left\{a_{n}\right\}$ 满足 $a_{1}=1, n a_{n+1}=2(n+1) a_{n}$, 设 $b_{n}=\frac{a_{n}}{n}$.

  (1) 求 $b_{1}, b_{2}, b_{3}$;

  (2) 判断数列 $\left\{b_{n}\right\}$ 是否为等比数列, 并说明理由;

  (3) 求 $\left\{a_{n}\right\}$ 的通项公式.
