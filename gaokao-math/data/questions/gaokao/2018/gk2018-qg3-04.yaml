stem: 若 $\sin a=\frac{1}{3}$, 则 $\cos 2 a=(\quad)$
options:
  A: $\frac{8}{9}$
  B: $\frac{7}{9}$
  C: $-\frac{7}{9}$
  D: $-\frac{8}{9}$
answer: B
solution: |-
  解: $\because \sin a=\frac{1}{3}$,

  $\therefore \cos 2 a=1-2 \sin ^{2} a=1-2 \times \frac{1}{9}=\frac{7}{9}$.

  故选: $B$.
