stem: 已知函数 $f(x)=\log _{2}\left(x^{2}+a\right)$, 若 $f(3)=1$, 则 $a=$ ______
answer: '-7'
answer_kind: expr
solution: |-
  解: 函数 $\mathrm{f}(\mathrm{x})=\log _{2}\left(\mathrm{x}^{2}+\mathrm{a}\right)$, 若 $\mathrm{f}(3)=1$,

  可得: $\log _{2}(9+a)=1$, 可得 $a=-7$.

  故答案为: -7 .
