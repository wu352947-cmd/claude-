stem: 等轴双曲线 $C$ 的中心在原点, 焦点在 $x$ 轴上, $C$ 与抛物线 $y^{2}=16 x$ 的 准线交于点 $A$ 和点 $B,|A B|=4 \sqrt{3}$, 则 $C$ 的实轴长为（ )
options:
  A: $\sqrt{2}$
  B: $2 \sqrt{2}$
  C: '4'
  D: '8'
answer: C
solution: |-
  解: 设等轴双曲线 $c: x^{2}-y^{2}=a^{2}(a>0)$,

  $y^{2}=16 x$ 的准线 $l: x=-4$,

  $\because C$ 与抛物线 $y^{2}=16 x$ 的准线 $\mid: x=-4$ 交于 $A, B$ 两点, $|A B|=4 \sqrt{3}$

  $\therefore A(-4,2 \sqrt{3})$, B $(-4,-2 \sqrt{3})$,

  将 $A$ 点坐标代入双曲线方程得 $\mathrm{a}^{2}=(-4)^{2}-(2 \sqrt{3})^{2}=4$,

  $\therefore a=2,2 a=4$.

  故选: C.
