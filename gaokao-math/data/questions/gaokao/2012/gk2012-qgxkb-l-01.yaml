stem: 已知集合 $A=\{1,2,3,4,5\}, B=\{(x, y) \mid x \in A, y \in A, x-y \in A\}$, 则 $B$ 中所含元素的个数为（ $)$
options:
  A: '3'
  B: '6'
  C: '8'
  D: '10'
answer: D
solution: |-
  解: 由题意, $x=5$ 时, $y=1,2,3,4$,

  $x=4$ 时 $, y=1,2,3$ ，

  $x=3$ 时, $y=1,2$,

  $x=2$ 时,$y=1$

  综上知, $\mathrm{B}$ 中的元素个数为 10 个

  故选: D.
