stem: |-
  已知函数 $f(x)$ 满足 $f(x)=f^{\prime} （ 1 ） e^{x-1}-f(0) x+\frac{1}{2} x^{2}$;

  （1）求 $f(x)$ 的解析式及单调区间;

  (2) 若 $\mathrm{f}(\mathrm{x}) \geqslant \frac{1}{2} \mathrm{x}^{2}+a x+b$, 求 $(a+1) b$ 的最大值.
