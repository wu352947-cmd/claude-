solution: |-
  解: (1) $f(x)=f^{\prime}(1) e^{x-1}-f(0) x+\frac{1}{2} x^{2} \Rightarrow f^{\prime}(x)=f^{\prime}(1) e^{x-1}-f($ 0) $+x$

  令 $x=1$ 得: $f(0)=1$

  $\therefore f(x)=f^{\prime}(1) e^{x-1}-x^{2}+\frac{1}{2} x^{2}$ 令 $x=0$, 得 $\left.f(0)=f^{\prime} （ 1\right) e^{-1}=1$ 解得 $f^{\prime}(1)=e$ 故函数的解析式为 $f(x)=e^{x}-x+\frac{1}{2} x^{2}$

  令 $g(x)=f^{\prime}(x)=e^{x}-1+x$

  $\therefore g^{\prime}(x)=e^{x}+1>0$, 由此知 $y=g(x)$ 在 $x \in R$ 上单调递增

  当 $x>0$ 时, $f^{\prime}(x)>f^{\prime}(0)=0$; 当 $x<0$ 时, 有

  $f^{\prime}(x)<f^{\prime}(0)=0$ 得:

  函数 $f(x)=e^{x}-x+\frac{1}{2} x^{2}$ 的单调递增区间为 $(0,+\infty)$, 单调递减区间为 $(-\infty$,

  0)

  (2) $f(x) \geqslant \frac{1}{2} x^{2}+a x+b \Leftrightarrow h(x)=e^{x_{-}} \quad(a+1) x-b \geqslant 0$ 得 $h^{\prime}(x)=e^{x_{-}} \quad(a+1)$

  (1)当 $a+1 \leqslant 0$ 时, $h^{\prime}(x)>0 \Rightarrow y=h(x)$ 在 $x \in R$ 上单调递增, $x \rightarrow-\infty$ 时, $h(x) \rightarrow-$ $\infty$ 与 $\mathrm{h}(\mathrm{x}) \geqslant 0$ 矛盾

  (2)当 $a+1>0$ 时, $h^{\prime}(x)>0 \Leftrightarrow x>\ln \left(a+1 ， h^{\prime}(x)<0 \Leftrightarrow x<\ln (a+1)\right.$

  得: 当 $x=\ln (a+1)$ 时, $h(x){ }_{\min }=(a+1)-(a+1) \ln (a+1)-b \geqslant 0$, 即 $(a+1$

  )$-(a+1) \ln (a+1) \geqslant b$

  $\therefore(a+1) b \leqslant(a+1)^{2-}(a+1)^{2} \ln (a+1), \quad(a+1>0)$

  令 $F(x)=x^{2}-x^{2} \ln x(x>0)$, 则 $F^{\prime}(x)=x(1-2 \ln x)$

  $\therefore F^{\prime}(x)>0 \Leftrightarrow 0<x<\sqrt{e}, F^{\prime}(x)<0 \Leftrightarrow x>\sqrt{e}$

  当 $x=\sqrt{\mathrm{e}}$ 时, $F(x)_{\text {max }}=\frac{\mathrm{e}}{2}$

  即当 $a=\sqrt{e}-1, b=\frac{\sqrt{e}}{2}$ 时, $(a+1) b$ 的最大值为 $\frac{e}{2}$
