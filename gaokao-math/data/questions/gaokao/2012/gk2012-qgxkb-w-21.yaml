stem: |-
  设函数 $f(x)=e^{x}-a x-2$.

  （I）求 $f(x)$ 的单调区间;

  (II ) 若 $a=1, k$ 为整数, 且当 $x>0$ 时, $(x-k) f^{\prime}(x)+x+1>0$, 求 $k$ 的最大 值.
