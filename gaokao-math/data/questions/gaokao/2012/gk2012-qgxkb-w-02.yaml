stem: 复数 $z=\frac{-3+i}{2+i}$ 的共轭复数是（ ）
options:
  A: $2+i$
  B: $2-\mathrm{i}$
  C: $-1+i$
  D: $-1-i$
answer: D
solution: |-
  解：复数 $z=\frac{-3+i}{2+i}=\frac{(-3+i)(2-i)}{(2+i)(2-i)}=\frac{-5+5 i}{5}=-1+i$.

  所以复数的共轭复数为: $-1-\mathrm{i}$.

  故选: D.
