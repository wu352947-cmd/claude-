stem: '设 $F_{1}$、 $F_{2}$ 是椭圆 $E: \frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}=1(a>b>0)$ 的左、右焦点, $P$ 为直线 $x=\frac{3 a}{2}$ 上一点, $\triangle F_{2} P F_{1}$ 是底角为 $30^{\circ}$ 的等腰三角形, 则 $E$ 的离心率为 （$\qquad $）'
