stem: 平面 $\alpha$ 截球 $\mathrm{O}$ 的球面所得圆的半径为 1 , 球心 $\mathrm{O}$ 到平面 $\alpha$ 的距离为 $\sqrt{2}$ , 则此球的体积为 ( )
options:
  A: $\sqrt{6} \pi$
  B: $4 \sqrt{3} \pi$
  C: $4 \sqrt{6} \pi$
  D: $6 \sqrt{3} \pi$
answer: B
solution: |-
  解: 因为平面 $\alpha$ 截球 $O$ 的球面所得圆的半径为 1 , 球心 0 到平面 $\alpha$ 的 距离为 $\sqrt{2}$,

  所以球的半径为: $\sqrt{(\sqrt{2})^{2}+1}=\sqrt{3}$.

  所以球的体积为: $\frac{4 \pi}{3}(\sqrt{3})^{3}=4 \sqrt{3} \pi$.

  故选: B.
