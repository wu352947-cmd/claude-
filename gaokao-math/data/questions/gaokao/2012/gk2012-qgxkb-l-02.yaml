stem: 将 2 名教师, 4 名学生分成 2 个小组, 分别安排到甲、乙两地参加社 会实践活动, 每个小组由 1 名教师和 2 名学生组成, 不同的安排方案共有（ )
options:
  A: 12 种
  B: 10 种
  C: 9 种
  D: 8 种
answer: A
solution: |-
  解：第一步, 为甲地选一名老师, 有 $C_{2}^{1}=2$ 种选法;

  第二步, 为甲地选两个学生, 有 $C_{4}^{2}=6$ 种选法;

  第三步, 为乙地选 1 名教师和 2 名学生, 有 1 种选法

  故不同的安排方案共有 $2 \times 6 \times 1=12$ 种

  故选: A.
