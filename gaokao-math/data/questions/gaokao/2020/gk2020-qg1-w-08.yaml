stem: 设 $a \log _{3} 4=2$ ，则 $4^{-a}=(\quad)$
options:
  A: $\frac{1}{16}$
  B: $\frac{1}{9}$
  C: $\frac{1}{8}$
  D: $\frac{1}{6}$
answer: B
solution: |-
  【详解】由 $a \log _{3} 4=2$ 可得 $\log _{3} 4^{a}=2$ ，所以 $4^{a}=9$,

  所以有 $4^{-a}=\frac{1}{9}$,

  故选: B.
