stem: |-
  某沙漠地区经过治理, 生态系统得到很大改善, 野生动物数量有所增加.为调查该地区某种野生动物的 数量, 将其分成面积相近的 200 个地块, 从这些地块中用简单随机抽样的方法抽取 20 个作为样区, 调查得 到样本数据 $\left(x_{i}, y_{i}\right)(i=1,2, \ldots, 20)$, 其中 $x_{i}$ 和 $y_{i}$ 分别表示第 $i$ 个样区的植物覆盖面积(单位: 公顷)和这种野 生动物的数量, 并计算得 $\sum_{i=1}^{20} x_{i}=60, \sum_{i=1}^{20} y_{i}=1200, \sum_{i=1}^{20}\left(x_{i}-\bar{x}\right)^{2}=80, \sum_{i=1}^{20}\left(y_{i}-\bar{y}\right)^{2}=9000$, $\sum_{i=1}^{20}\left(x_{i}(-\bar{x}) y_{i}-\bar{y}\right)=800$

  (1) 求该地区这种野生动物数量的估计值 (这种野生动物数量的估计值等于样区这种野生动物数量的平 均数乘以地块数）;

  (2) 求样本 $\left(x_{i}, y_{i}\right)(i=1,2, \ldots, 20)$ 的相关系数（精确到 0.01$)$;

  (3) 根据现有统计资料, 各地块间植物覆盖面积差异很大.为提高样本的代表性以获得该地区这种野生动 物数量更准确的估计, 请给出一种你认为更合理的抽样方法, 并说明理由.

  附: 相关系数 $r=\frac{\sum_{i=1}^{n}\left(x_{i}(-\bar{x}) y_{i}-\bar{y}\right)}{\sqrt{\sum_{i=1}^{n}\left(x_{i}(-\bar{x})^{2} \sum_{i=1}^{n} y_{i}-\bar{y}\right)^{2}}}, \quad \sqrt{2}=1.414$.
