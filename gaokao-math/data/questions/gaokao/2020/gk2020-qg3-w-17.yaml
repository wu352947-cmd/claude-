stem: |-
  设等比数列 $\left\{a_{n}\right\}$ 满足 $a_{1}+a_{2}=4, a_{3}-a_{1}=8$.

  (1) 求 $\left\{a_{n}\right\}$ 的通项公式;

  (2) 记 $S_{n}$ 为数列 $\left\{\log _{3} a_{n}\right\}$ 的前 $n$ 项和. 若 $S_{m}+S_{m+1}=S_{m+3}$, 求 $m$.
