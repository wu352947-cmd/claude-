difficulty_label: 压轴
stem: |-
  设函数 $f(x)=x^{3}+b x+c$, 曲线 $y=f(x)$ 在点 $\left(\frac{1}{2}, f\left(\frac{1}{2}\right)\right)$ 处的切线与 $y$ 轴垂直.

  (1) 求 $b$.

  (2) 若 $f(x)$ 有一个绝对值不大于 1 的零点, 证明: $f(x)$ 所有零点的绝对值都不大于 1 .
