difficulty_label: 中档
points: 5.0
stem: '设 $O$ 为坐标原点, 直线 $x=2$ 与抛物线 $C: y^{2}=2 p x(p>0)$ 交于 $D, E$ 两点, 若 $O D \perp O E$, 则 $C$ 的焦点坐标为 $(\quad)$'
options:
  A: $\left(\frac{1}{4}, 0\right)$
  B: $\left(\frac{1}{2}, 0\right)$
  C: $(1,0)$
  D: $(2,0)$
answer: B
solution: '【详解】因为直线 $x=2$ 与抛物线 $y^{2}=2 p x(p>0)$ 交于 $C, D$ 两点, 且 $O D \perp O E$, 根据抛物线的对称性可以确定 $\angle D O x=\angle C O x=\frac{\pi}{4}$, 所以 $C(2,2)$, 代人抛物线方程 $4=4 p$, 求得 $p=1$, 所以其焦点坐标为 $\left(\frac{1}{2}, 0\right)$, 故选: B.'
