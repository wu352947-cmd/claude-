stem: 若 $\sin x=-\frac{2}{3}$, 则 $\cos 2 x=$ ______
answer: \frac{1}{9}
answer_kind: expr
solution: |-
  【详解】 $\cos 2 x=1-2 \sin ^{2} x=1-2 \times\left(-\frac{2}{3}\right)^{2}=1-\frac{8}{9}=\frac{1}{9}$.

  故答案为: $\frac{1}{9}$.
