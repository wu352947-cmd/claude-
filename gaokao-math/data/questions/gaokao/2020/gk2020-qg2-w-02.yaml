stem: $(1-\mathrm{i})^{4}=(\quad)$
options:
  A: '-4'
  B: '4'
  C: $-4 i$
  D: $4 i$
answer: A
solution: |-
  【详解】 $(1-i)^{4}\left([=1-i)^{2}\right]^{2}\left(=1-2 i+i^{2}\right)^{2}-(=2 i)^{2}-=4$.

  故选: A.
