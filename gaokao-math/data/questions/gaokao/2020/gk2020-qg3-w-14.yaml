stem: '设双曲线 $C: \frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}=1(a>0, b>0)$ 的一条渐近线为 $y=\sqrt{2} x$, 则 $C$ 的离心率为 ______'
answer: \sqrt{3}
answer_kind: expr
solution: |-
  【详解】由双曲线方程 $\frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}=1$ 可得其焦点在 $x$ 轴上，

  因为其一条渐近线为 $y=\sqrt{2} x$,

  所以 $\frac{b}{a}=\sqrt{2}, e=\frac{c}{a}=\sqrt{1+\frac{b^{2}}{a^{2}}}=\sqrt{3}$.

  故答案为: $\sqrt{3}$
