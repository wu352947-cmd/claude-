stem: |-
  设 $\left\{a_{n}\right\}$ 是公比不为 1 的等比数列, $a_{1}$ 为 $a_{2}, a_{3}$ 的等差中项.

  (1) 求 $\left\{a_{n}\right\}$ 的公比;

  (2) 若 $a_{1}=1$, 求数列 $\left\{n a_{n}\right\}$ 的前 $n$ 项和.
