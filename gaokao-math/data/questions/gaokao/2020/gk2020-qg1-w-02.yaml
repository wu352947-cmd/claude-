stem: 若 $z=1+2 i+i^{3}$ ，则 $|z|=(\quad)$
options:
  A: '0'
  B: '1'
  C: $\sqrt{2}$
  D: '2'
answer: C
solution: |-
  【详解】因为 $z=1+2 i+i^{3}=1+2 i-i=1+i$, 所以 $|z|=\sqrt{1^{2}+1^{2}}=\sqrt{2}$.

  故选: C.
