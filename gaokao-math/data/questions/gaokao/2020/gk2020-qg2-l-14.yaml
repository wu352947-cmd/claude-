stem: 4 名同学到 3 个小区参加垃圾分类宣传活动, 每名同学只去 1 个小区, 每个小区至少安排 1 名同学, 则不同 的安排方法共有 种 ______
answer: '36'
answer_kind: expr
solution: |-
  【详解】 $\because 4$ 名同学到 3 个小区参加垃圾分类宣传活动, 每名同学只去 1 个小区, 每个小区至少安排 1 名同学

  $\therefore$ 先取2名同学看作一组, 选法有: $C_{4}^{2}=6$

  现在可看成是 3 组同学分配到 3 个小区, 分法有: $A_{3}^{3}=6$

  根据分步乘法原理, 可得不同的安排方法 $6 \times 6=36$ 种

  故答案为: 36 .
