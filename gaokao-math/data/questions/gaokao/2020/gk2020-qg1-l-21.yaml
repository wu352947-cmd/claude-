stem: |-
  已知函数 $f(x)=\mathrm{e}^{x}+a x^{2}-x$.

  （1）当 $a=1$ 时, 讨论 $f(x)$ 的单调性;

  (2) 当 $x \geq 0$ 时, $f(x) \geq \frac{1}{2} x^{3}+1$, 求 $a$ 的取值范围.
