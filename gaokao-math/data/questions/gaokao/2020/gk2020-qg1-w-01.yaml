stem: 已知集合 $A=\left\{x \mid x^{2}-3 x-4<0\right\}, B=\{-4,1,3,5\}$, 则 $\left.A \cap B=（ \quad\right)$
options:
  A: $\{-4,1\}$
  B: $\{1,5\}$
  C: $\{3,5\}$
  D: $\{1,3\}$
answer: D
solution: |-
  【详解】由 $x^{2}-3 x-4<0$ 解得 $-1<x<4$,

  所以 $A=\{x \mid-1<x<4\}$,

  又因为 $B=\{-4,1,3,5\}$, 所以 $A \cap B=\{1,3\}$,

  故选: D.
