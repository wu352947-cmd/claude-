solution: |-
  【分析】

  (1) 利用递推公式得出 $a_{2}, a_{3}$, 猜想得出 $\left\{a_{n}\right\}$ 的通项公式, 利用数学归纳法证明即可;

  （2）由错位相减法求解即可.

  【详解】(1) 由题意可得 $a_{2}=3 a_{1}-4=9-4=5, a_{3}=3 a_{2}-8=15-8=7$, 由数列 $\left\{a_{n}\right\}$ 的前三项可猜想数列 $\left\{a_{n}\right\}$ 是以 3 为首项, 2 为公差的等差数列, 即 $a_{n}=2 n+1$, 证明如下:

  当 $n=1$ 时, $a_{1}=3$ 成立;

  假设 $n=k$ 时, $a_{k}=2 k+1$ 成立.

  那么 $n=k+1$ 时, $a_{k+1}=3 a_{k}-4 k=3(2 k+1)-4 k=2 k+3=2(k+1)+1$ 也成立.

  则对任意的 $n \in N^{*}$, 都有 $a_{n}=2 n+1$ 成立;

  (2) 由 (1) 可知, $a_{n} \cdot 2^{n}=(2 n+1) \cdot 2^{n}$

  $S_{n}=3 \times 2+5 \times 2^{2}+7 \times 2^{3}+\cdots+(2 n-1) \cdot 2^{n-1}+(2 n+1) \cdot 2^{n}$, (1)

  $2 S_{n}=3 \times 2^{2}+5 \times 2^{3}+7 \times 2^{4}+\cdots+(2 n-1) \cdot 2^{n}+(2 n+1) \cdot 2^{n+1}$

  由(1)-(2)得: $-S_{n}=6+2 \times\left(2^{2}+2^{3}+\cdots+2^{n}\right)-(2 n+1) \cdot 2^{n+1}$

  $=6+2 \times \frac{2^{2} \times\left(1-2^{n-1}\right)}{1-2}-(2 n+1) \cdot 2^{n+1}=(1-2 n) \cdot 2^{n+1}-2$,

  即 $S_{n}=(2 n-1) \cdot 2^{n+1}+2$.
