stem: |-
  设数列 $\left\{a_{n}\right\}$ 满足 $a_{1}=3, a_{n+1}=3 a_{n}-4 n$.

  (1) 计算 $a_{2}, a_{3}$, 猜想 $\left\{a_{n}\right\}$ 的通项公式并加以证明;

  (2) 求数列 $\left\{2^{n} a_{n}\right\}$ 的前 $n$ 项和 $S_{n}$.
