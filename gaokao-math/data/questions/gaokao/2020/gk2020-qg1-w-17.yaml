stem: |-
  某厂接受了一项加工业务, 加工出来的产品(单位：件)按标准分为 $A, B, C, D$ 四个等级.加工业务约定 : 对于 $A$ 级品、 $B$ 级品、 $C$ 级品, 厂家每件分别收取加工费 90 元, 50 元, 20 元; 对于 $\mathrm{D}$ 级品, 厂家每件要赔 偿原料损失费 50 元.该厂有甲、乙两个分厂可承接加工业务.甲分厂加工成本费为 25 元/件，乙分厂加工成本 费为 20 元/件.厂家为决定由哪个分厂承接加工业务, 在两个分厂各试加工了100件这种产品, 并统计了这些 产品的等级, 整理如下:

  甲分厂产品等级的频数分布表

  $$\begin{array}{|l|l|l|l|l|}\hline \text{等级} & A & B & C & D \\ \hline \text{频数} & 40 & 20 & 20 & 20 \\ \hline \end{array}$$

  乙分厂产品等级的频数分布表

  $$\begin{array}{|l|l|l|l|l|}\hline \text{等级} & A & B & C & D \\ \hline \text{频数} & 28 & 17 & 34 & 21 \\ \hline \end{array}$$

  （1）分别估计甲、乙两分厂加工出来的一件产品为 $\mathrm{A}$ 级品的概率;

  (2) 分别求甲、乙两分厂加工出来的 100 件产品的平均利润, 以平均利润为依据, 厂家应选哪个分厂承接 加工业务?
