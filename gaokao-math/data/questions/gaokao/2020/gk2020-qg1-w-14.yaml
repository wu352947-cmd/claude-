stem: 设向量 $\boldsymbol{a}=(1,-1), \boldsymbol{b}=(m+1,2 m-4)$, 若 ${ }^{\prime} a \perp b^{\prime}$, 则 $m=$ ______
answer: '5'
answer_kind: expr
solution: |-
  【详解】由 ${ }^{\prime} a \perp b$

  又因为 $\vec{a}=(1,-1), \vec{b}=(m+1,2 m-4)$,

  所以 $\vec{a} \cdot \vec{b}=1 \cdot(m+1)+(-1) \cdot(2 m-4)=0$ ，

  即 $m=5$ ，

  故答案为: 5 .
