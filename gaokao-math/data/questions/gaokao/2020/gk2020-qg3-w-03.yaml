stem: 设一组样本数据 $x_{1}, x_{2}, \ldots, x_{n}$ 的方差为 0.01 , 则数据 $10 x_{1}, 10 x_{2}, \ldots, 10 x_{n}$ 的方差为 $($ )
options:
  A: '0.01'
  B: '0.1'
  C: '1'
  D: '10'
answer: C
solution: |-
  【详解】因为数据 $a x_{i}+b,(i=1,2, \mathrm{L}, n)$ 的方差是数据 $x_{i},(i=1,2, \mathrm{L}, n)$ 的方差的 $a^{2}$ 倍,

  所以所求数据方差为 $10^{2} \times 0.01=1$

  故选: C
