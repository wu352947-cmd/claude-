stem: |-
  已知函数 $f(x)=2 \ln x+1$.

  (1) 若 $f(x) \leq 2 x+c$, 求 $c$ 的取值范围;

  （2）设 $a>0$ 时, 讨论函数 $g(x)=\frac{f(x)-f(a)}{x-a}$ 的单调性.
