stem: |-
  已知 $F$ 为双曲线 $C: \frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}=1(a>0, b>0)$

  的右焦点, $A$ 为 $C$ 的右顶点, $B$ 为 $C$ 上的点, 且 $B F$ 垂直于 $x$ 轴. 若 $A B$ 的斜率为 3 , 则 $C$ 的离心率为 ______
answer: '2'
answer_kind: expr
solution: |-
  【详解】依题可得, $\frac{|B F|}{|A F|}=3$, 而 $|B F|=\frac{b^{2}}{a},|A F|=c-a$, 即 $\frac{\frac{b^{2}}{a}}{c-a}=3$, 变形得 $c^{2}-a^{2}=3 a c-3 a^{2}$ , 化简可得, $e^{2}-3 e+2=0$, 解得 $e=2$ 或 $e=1$ (舍去).

  故答案为: 2 .
