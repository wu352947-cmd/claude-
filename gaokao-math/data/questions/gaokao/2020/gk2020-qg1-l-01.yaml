stem: 若 $\mathrm{z}=1+i$ ，则 $\left|\mathrm{z}^{2}-2 z\right|=(\quad)$
options:
  A: '0'
  B: '1'
  C: $\sqrt{2}$
  D: '2'
answer: D
solution: |-
  【详解】由题意可得: $z^{2}=(1+i)^{2}=2 i$, 则 $z^{2}-2 z=2 i-2(1+i)=-2$.

  故 $\left|z^{2}-2 z\right|=|-2|=2$.

  故选: D.
