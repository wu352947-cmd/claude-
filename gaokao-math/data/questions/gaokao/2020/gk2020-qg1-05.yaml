stem: '某校一个课外学习小组为研究某作物种子的发芽率 $y$ 和温度 $x$ (单位: ${ }^{\circ} \mathrm{C}$ ) 的关系, 在 20 个不同的温度条件下进行种子发芽实验, 由实验数据 $\left(x_i, y_i\right)(i=1,2, \cdots, 20)$ 得到下面的散点图:由此散点图, 在 $10^{\circ} \mathrm{C}$ 至 $40^{\circ} \mathrm{C}$ 之间, 下面四个回归方程类型中最适宜作为发芽率 $y$ 和温度 $x$ 的回归方程类型的是 ( )'
figure: 81c84ef657dff9d6.png
options:
  A: $y=a+b x$
  B: $y=a+b x^2$
  C: $y=a+b \mathrm{e}^x$
  D: $y=a+b \ln x$
answer: D
solution: '【详解】由散点图分布可知, 散点图分布在一个对数函数的图象附近,因此, 最适合作为发芽率 $y$ 和温度 $x$ 的回归方程类型的是 $y=a+b \ln x$.故选: D.'
