stem: |-
  $\triangle A B C$ 的内角 $A, B, C$ 的对边分别为 $a, b, c$, 已知 $\cos ^{2}\left(\frac{\pi}{2}+A\right)+\cos A=\frac{5}{4}$.

  (1) 求 $A$;

  (2) 若 $b-c=\frac{\sqrt{3}}{3} a$, 证明: $\triangle A B C$ 是直角三角形.
