stem: |-
  已知 $f(x) = \mathrm{e}^x - \frac{2}{3}\sin x$。

  (1)求曲线 $y = f(x)$ 在点 $(0, f(0))$ 处的切线方程；

  (2)当 $x \in \left[-\frac{1}{3}, +\infty\right)$ 时，证明 $f(x) \geq 1 + \frac{x}{3}$；

  (3)求实数 $a$ 的最大可能值，使得 $f\left(\frac{1}{1}\right) \cdot f\left(\frac{1}{2}\right) \cdot f\left(\frac{1}{3}\right) \cdots f\left(\frac{1}{n}\right) \geq (n+1)^a$ 对任意的 $n \in \mathbf{N}^*$ 都成立。
parts:
- label: (1)
  points: 5.0
  answer: $x - 3y + 3 = 0$
- label: (2)
  points: 5.0
  answer: 证明略
- label: (3)
  points: 5.0
  answer: $a$ 的最大值为 $\frac{1}{3}$
