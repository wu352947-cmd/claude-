stem: |-
  已知等差数列 $\{a_n\}$ 与等比数列 $\{b_n\}$ 满足：$a_1 = 2$，$b_1 = 1$，$a_2 = b_1 + b_2$，$a_4 = b_3 - b_1$。
      (1) 求数列 $\{a_n\}$，$\{b_n\}$ 的通项公式；
      (2) 记 $E_n = \{ x \in \mathbf{R} \mid x \le n, \exists k \in \mathbf{N}^*, x = a_k \text{ 或 } x = b_k \}$，记 $c_n$ 为 $E_n$ 中的元素个数。
      (i) 求 $c_{3^n}$；
      (ii) 求 $\sum_{m=1}^{3^n - 1} (-1)^m \cdot a_m \cdot c_m$。
