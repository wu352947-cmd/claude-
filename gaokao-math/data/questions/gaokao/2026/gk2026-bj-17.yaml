stem: |-
  现从全校学生中随机抽取200人统计数学成绩，成绩分组及对应人数如下：

  $$\begin{array}{|c|c|c|c|c|c|}\hline \text{成绩分组} & [81,94) & [94,107) & [107,120) & [120,135) & [135,150] \\ \hline \text{人数} & 40 & 60 & 60 & 32 & 8 \\ \hline\end{array}$$
  以频率估计概率，完成下列问题：

  (1) 求数学成绩低于120分的概率；

  (2) 从学校随机抽取4人，求2人不低于120且2人小于94的概率；

  (3) 每组数据取左端、中间、右端，比较 $s_{\text{左}}^2$ 、 $s_{\text{中}}^2$ 、 $s_{\text{右}}^2$ 的大小关系。
