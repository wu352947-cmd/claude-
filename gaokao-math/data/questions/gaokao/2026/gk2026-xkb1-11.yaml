stem: 已知圆$C_1:(x+1)^2+y^2=1$，圆$C_2:(x-1)^2+y^2=1$，圆$C_3:x^2+(y-\sqrt{3})^2=1$，直线$l:y=kx+b$与$C_1,C_2,C_3$均有两个交点。记$l$被$C_1,C_2,C_3$截得的弦长为$s_1,s_2,s_3$，则（ ）
options:
  A: $k$可以取任意实数
  B: 满足$s_1=s_2=s_3$的直线$l$共有3条
  C: 满足$s_1+s_2+s_3=3$的直线$l$多于3条
  D: 当$b=0$时，$s_1+s_2+s_3$的最大值为$\dfrac{2\sqrt{21}}{3}$
answer:
- B
- C
- D
