difficulty_label: 中档
stem: |-
  设整数$N\geqslant2$，某同学用一个球进行投篮练习，至多投篮$N$次，当且仅当投中1次时或$N$次均未投中时，停止练习，设该同学每次投中的概率为$p\ (0<p<1)$，各次投中与否相互独立，记$X$为停止练习时该同学的投篮次数。
  (1) 当$N=4$，$p=\dfrac{1}{3}$时，求$X$的分布列；
  (2) 设$k,m$均为自然数，
  (i) 当$k\leqslant N-1$时，求$P(X>k)$；
  (ii) 当$k+m\leqslant N-1$时，证明：$P(X>k+m\mid X>k)=P(X>m)$。
parts:
- label: (1)
  points: 6
  answer: $$\begin{array}{|c|c|c|c|c|}\hline X & 1 & 2 & 3 & 4 \\ \hline P & \dfrac{1}{3} & \dfrac{2}{9} & \dfrac{4}{27} & \dfrac{8}{27} \\ \hline\end{array}$$
- label: (2)
  points: 9.0
  answer: (i)$(1-p)^k$
solution: |-
  （数据集只提供了参考答案，没有解答过程）

  参考答案：(1) $$\begin{array}{|c|c|c|c|c|}\hline X & 1 & 2 & 3 & 4 \\ \hline P & \dfrac{1}{3} & \dfrac{2}{9} & \dfrac{4}{27} & \dfrac{8}{27} \\ \hline\end{array}$$；(2) (i)$(1-p)^k$
