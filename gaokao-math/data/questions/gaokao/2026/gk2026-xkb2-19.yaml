stem: |-
  已知函数$f(x)=xe^x+ax+b$，曲线$y=f(x)$在点$(0,f(0))$处的切线方程为$y=-2x+1$.
  (1)求$a$，$b$；
  (2)当$x>0$时，$f(x+m)-f(x)>m$，求$m$的取值范围；
  (3)当$x>0$时，$f(x+k)+f(k-x)>2f(k)$，求$k$的最小值。
parts:
- label: (1)
