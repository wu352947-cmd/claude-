stem: |-
  设函数 $f(x) = x^2 + mx - 4e^{nx-1}(n\in Z)$ ，曲线 $y = f(x)$ 在点 $(-1,f(-1))$ 处的切线方程为 $4x + e^{2}y + e^{2} + 8 = 0$。

  (1) 求 $m$ ， $n$ 的值；

  (2) 求 $f(x)$ 的极值点个数；

  (3) 求 $y = kx - 1(k > 0)$ 与 $f(x)$ 交点个数。
