stem: 已知三角函数 $f(t)=A\sin(\omega t+\varphi)+B$（$A>0$，$B\in \mathbf{R}$，$\omega>0$，$0\le \varphi<2\pi$），若 $v=f(t)$，当 $v=0$ 或 $v=4$ 时其导数为 $0$，初始速度为 $0$，且速度第一次达到 $4$ 时用时为 $0.1$ 秒，则 $f(t)=\underline{\quad\quad}$.
answer: 2\sin(10\pi t+\frac{3\pi}{2})+2
