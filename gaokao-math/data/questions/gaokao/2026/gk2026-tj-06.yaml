stem: 已知函数 $f(x) = |\ln x|$，若 $a = f(2^{0.3})$，$b = f(3^{0.3})$，$c = f(3^{-0.5})$，则 $a, b, c$ 的大小关系为（ ）
options:
  A: $a < b < c$
  B: $b < a < c$
  C: $c < b < a$
  D: $c < a < b$
answer: A
