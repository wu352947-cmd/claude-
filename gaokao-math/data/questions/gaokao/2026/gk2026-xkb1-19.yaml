stem: |-
  已知函数$f(x)$的定义域为$R$，且当$x<0$时，$f(x)=2^x$，对任意$x_0\in R$，定义集合$D(x_0)=\{d\in R\mid f(x_0+d)>f(x_0)\}$。
  (1) 若当$x\geqslant0$时，$f(x)=1-x$，求$D(-1)$；
  (2) 若$f(x)$是奇函数，$f(x_1)\leqslant f(x_2)$，且$x_1x_2\neq0$，证明：$D(x_2)\subseteq D(x_1)$；
  (3) 设$f(x)$满足：$\textcircled1$ 若$f(x_1)\leqslant f(x_2)$，则$D(x_2)\subseteq D(x_1)$；$\textcircled2$ 当$0<x<1$时，$f(x)<f(0)$。
  (i) 证明：$f(0)\geqslant1$；
  (ii) 证明：$f(x)$在区间$(0,+\infty)$单调递增。
