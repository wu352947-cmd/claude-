stem: |-
  已知直三棱柱 $ABC - A_1B_1C_1$，$\angle BAC = 90^\circ$，$AB = AC = 2$，$BB_1 = \sqrt{2}$，$E$、$D$ 分别为 $A_1B_1$、$AC$ 的中点。

  (1) 证明：$DE \parallel$ 平面 $BB_1C_1C$；

  (2) 点 $P$ 在平面 $A_1B_1C_1$ 内，且 $EP \parallel B_1C_1$，再从条件$\textcircled{1}$、条件$\textcircled{2}$、条件$\textcircled{3}$这三个条件中选择一个作为已知，使得 $P$ 唯一确定，求平面 $PAD$ 与平面 $PDE$ 的夹角的余弦值。

  $\textcircled{1}$ $PA = PD$；

  $\textcircled{2}$ $PA \perp BC$；

  $\textcircled{3}$ $BB_1 \parallel$ 平面 $PDE$。

  注：如果选择条件$\textcircled{1}$、条件$\textcircled{2}$、条件$\textcircled{3}$分别解答，按第一个解答计分。
