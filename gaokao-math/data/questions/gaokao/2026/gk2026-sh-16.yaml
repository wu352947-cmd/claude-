stem: 已知空间直角坐标系中有一正方体，其三组棱分别与 $x$ 轴、$y$ 轴、$z$ 轴重合，顶点 $A$ 与坐标原点重合，点 $C$ 是正方体底面中与 $A$ 相对的对角顶点，点 $C_1$ 在点 $C$ 的正上方。将正方体绕直线 $AC_1$ 旋转一周，试问点 $C$ 的运动轨迹会经过几个空间卦限$（\quad）$。
options:
  A: $1$
  B: $3$
  C: $4$
  D: $7$
answer: A
