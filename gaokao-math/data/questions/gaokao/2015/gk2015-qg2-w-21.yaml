stem: |-
  设函数 $f(x)=\ln x+a(1-x)$.

  (I) 讨论： $f(x)$ 的单调性;

  (II ) 当 $f(x)$ 有最大值, 且最大值大于 $2 a-2$ 时, 求 $a$ 的取值范围.
