stem: 已知集合 $\mathrm{A}=\{-2,-1,0,1,2\}, B=\{x \mid(x-1)(x+2)<0\}$, 则 $A \cap B=(\quad)$
options:
  A: $\{-1,0\}$
  B: $\{0,1\}$
  C: $\{-1,0,1\}$
  D: $\{0,1,2\}$
answer: A
solution: |-
  解: $\mathrm{B}=\{x \mid-2<x<1\}, \mathrm{A}=\{-2,-1,0,1,2\}$;

  $\therefore A \cap B=\{-1,0\}$.

  故选: A.
