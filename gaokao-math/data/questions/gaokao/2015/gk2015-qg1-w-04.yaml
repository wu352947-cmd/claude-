stem: 如果 3 个正整数可作为一个直角三角形三条边的边长, 则称这 3 个 数为一组勾股数. 从 $1,2,3,4,5$ 中任取 3 个不同的数, 则这 3 个数构成 一组勾股数的概率为 ( $)$
options:
  A: $\frac{3}{10}$
  B: $\frac{1}{5}$
  C: $\frac{1}{10}$
  D: $\frac{1}{20}$
answer: C
solution: |-
  解: 从 $1,2,3,4,5$ 中任取 3 个不同的数, 有 $(1,2,3),(1,2$, $4),(1,2,5),(1,3,4),(1,3,5),(1,4,5)(2,3,4)$, $(2,3,5),(2,4,5),(3,4,5)$ 共 10 种,

  其中只有 $(3,4,5)$ 为勾股数,

  故这 3 个数构成一组勾股数的概率为 $\frac{1}{10}$.

  故选: C.
