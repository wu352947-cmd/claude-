  (1) 求 $\left\{a_{n}\right\}$ 的通项公式:

  (II ) 设 $b_{n}=\frac{1}{a_{n} a_{r+1}}$, 求数列 $\left\{b_{n}\right\}$ 的前 $n$ 项和.
