stem: 已知等比数列 $\left\{a_{n}\right\}$ 满足 $a_{1}=3, a_{1}+a_{3}+a_{5}=21$, 则 $a_{3}+a_{5}+a_{7}=(\quad)$
options:
  A: '21'
  B: '42'
  C: '63'
  D: '84'
answer: B
solution: |-
  解: $\because a_{1}=3, a_{1}+a_{3}+a_{5}=21$,

  $\therefore a_{1}\left(1+q^{2}+q^{4}\right)=21$

  $\therefore q^{4}+q^{2}+1=7$

  $\therefore q^{4}+q^{2}-6=0$

  $\therefore q^{2}=2$

  $\therefore a_{3}+a_{5}+a_{7}=a_{1}\left(q^{2}+q^{4}+q^{6}\right)=3 \times(2+4+8)=42$.

  故选: B.
