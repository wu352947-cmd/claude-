stem: 若为 $a$ 实数, 且 $\frac{2+a i}{1+i}=3+i$, 则 $a=(\quad)$
options:
  A: '-4'
  B: '-3'
  C: '3'
  D: '4'
answer: D
solution: |-
  解：由 $\frac{2+a i}{1+i}=3+i$, 得 $2+a i=(1+i) \quad(3+i)=2+4 i$,

  则 $a=4$,

  故选: D.
