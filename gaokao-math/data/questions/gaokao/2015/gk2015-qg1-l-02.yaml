stem: $\sin 20^{\circ} \cos 10^{\circ}-\cos 160^{\circ} \sin 10^{\circ}=(\quad ）$
options:
  A: $\frac{\sqrt{3}}{2}$
  B: $\frac{\sqrt{3}}{2}$
  C: $-\frac{1}{2}$
  D: $\frac{1}{2}$
answer: D
solution: |-
  解: $\sin 20^{\circ} \cos 10^{\circ}-\cos 160^{\circ} \sin 10^{\circ}$ $=\sin 20^{\circ} \cos 10^{\circ}+\cos 20^{\circ} \sin 10^{\circ}$

  $=\sin 30^{\circ}$

  $=\frac{1}{2}$

  故选: D.
