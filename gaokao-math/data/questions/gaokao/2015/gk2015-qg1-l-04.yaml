year: 2015
kps:
  prob.classical: 1.0
difficulty_label: 基础
points: 5.0
stem: 投篮测试中, 每人投 3 次, 至少投中 2 次才能通过测试. 已知某同 学每次投篮投中的概率为 0.6 , 且各次投篮是否投中相互独立, 则该同学通过 测试的概率为 $(\quad)$
options:
  A: '0.648'
  B: '0.432'
  C: '0.36'
  D: '0.312'
answer: A
solution: |-
  解：由题意可知: 同学 3 次测试满足 $X \sim B(3,0.6 ）$,

  该同学通过测试的概率为 $C_{3}^{2}(0.6)^{2} \times(1-0.6)+C_{3}^{3}(0.6)^{3}=0.648$.

  故选: $A$.
