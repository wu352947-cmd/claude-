stem: |-
  已知函数 $f(x)=x^{3}+a x+\frac{1}{4}, g(x)=-\ln x$

  (i) 当 $a$ 为何值时, $x$ 轴为曲线 $y=f(x)$ 的切线;

  （ii）用 $\min \{m, n\}$ 表示 $m, n$ 中的最小值，设函数 $h(x)=\min \{f(x) ， g （ x)$ \}$(x>0)$, 讨论 $h(x)$ 零点的个数.
