stem: 已知 $S_{n}$ 是等差数列 $\left\{a_{n}\right\}$ 的前 $n$ 项和, 若 $a_{1}+a_{3}+a_{5}=3$, 则 $S_{5}=(\quad)$
options:
  A: '5'
  B: '7'
  C: '9'
  D: '11'
answer: A
solution: |-
  解: 由等差数列 $\left\{a_{n}\right\}$ 的性质, $a_{1}+a_{3}+a_{5}=3=3 a_{3}$, 解得 $a_{3}=1$.

  则 $S_{5}=\frac{5\left(a_{1}+a_{5}\right)}{2}=5 a_{3}=5$.

  故选: A.
