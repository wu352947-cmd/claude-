stem: 已知函数 $f(x)=a x^{3}+x+1$ 的图象在点（1，f(1））处的切线过点（ 2, 7）, 则 $a=$ ______
answer: '1'
answer_kind: expr
solution: |-
  解: 函数 $f(x)=a x^{3}+x+1$ 的导数为: $f^{\prime}(x)=3 a x^{2}+1, f^{\prime}(1)=3 a+1$, 而 $f(1)=a+2$

  切线方程为: $y-a-2=(3 a+1)(x-1)$, 因为切线方程经过 $(2,7)$,

  所以 7- $a-2=(3 a+1)(2-1)$,

  解得 $a=1$.

  故答案为: 1 .
