stem: |-
  椭圆 $C: \frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}=1, \quad(a>b>0)$ 的离心率 $\frac{\sqrt{2}}{2}$, 点 $(2, \sqrt{2})$ 在 $C$ 上.

  (1) 求椭圆 C 的方程;

  (2) 直线 $I$ 不过原点 $O$ 且不平行于坐标轴, $I$ 与 $C$ 有两个交点 $A, B$, 线段 $A B$ 的 中点为 $M$. 证明: 直线 $O M$ 的斜率与 $\mathrm{I}$ 的斜率的乘积为定值.
