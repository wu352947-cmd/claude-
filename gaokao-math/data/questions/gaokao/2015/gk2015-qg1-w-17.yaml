stem: |-
  已知 $a, b, c$ 分别是 $\triangle A B C$ 内角 $A, B, C$ 的对边, $\sin ^{2} B=2 \sin A \sin C$

  (I ) 若 $a=b$, 求 $\cos B$;

  （II ) 设 $B=90^{\circ}$, 且 $a=\sqrt{2}$, 求 $\triangle A B C$ 的面积.
