stem: 根据如图给出的 2004 年至 2013 年我国二氧化硫年排放量（单位:万吨）柱形图, 以下结论中不正确的是（）
figure: bb6f20a6c9333fa1.png
options:
  A: 逐年比较, 2008 年减少二氧化硫排放量的效果最显著
  B: 2007 年我国治理二氧化硫排放显现成效
  C: 2006 年以来我国二氧化硫年排放量呈减少趋势
  D: 2006 年以来我国二氧化硫年排放量与年份正相关
answer: D
solution: '解: A 从图中明显看出 2008 年二氧化硫排放量比 2007 年的二氧化硫排放量明显减少, 且减少的最多, 故 A 正确;B2004- 2006 年二氧化硫排放量越来越多，从 2007 年开始二氧化硫排放量变少'
