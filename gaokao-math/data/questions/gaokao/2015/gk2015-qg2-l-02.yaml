stem: 若 $a$ 为实数, 且 $(2+a i)(a-2 i)=-4 i$, 则 $a=(\quad)$
options:
  A: '-1'
  B: '0'
  C: '1'
  D: '2'
answer: B
solution: |-
  解：因为 $(2+a i)(a-2 i)=-4 i$, 所以 $4 a+\left(a^{2}-4\right) i=-4 i$,

  $4 a=0$, 并且 $a^{2}-4=-4$,

  所以 $a=0$; 故选：B.
