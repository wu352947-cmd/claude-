stem: 设函数 $f^{\prime}(x)$ 是奇函数 $f(x)(x \in R)$ 的导函数, $f(-1)=0$, 当 $x$ $>0$ 时, $x f^{\prime}(x)-f(x)<0$, 则使得 $f(x)>0$ 成立的 $x$ 的取值范围是 ($\qquad$)
options:
  A: $(-\infty,-1) \cup(0,1)$
  B: $(-1,0) \cup(1,+\infty)$
  C: $(-\infty,-1) \cup(-1,0)$
  D: $(0,1) \cup(1,+\infty)$
answer: A
