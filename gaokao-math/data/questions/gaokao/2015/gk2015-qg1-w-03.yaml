stem: 已知复数 $z$ 满足 $(z-1) i=1+i$, 则 $z=(\quad)$
options:
  A: $-2-\mathrm{i}$
  B: $-2+i$
  C: 2- $i$
  D: $2+i$
answer: C
solution: |-
  解：由 $(z-1) i=1+i$ ，得 $z-1=\frac{1+i}{i}=\frac{-i(1+i)}{-i^{2}}=1-i$, $\therefore \mathrm{z}=2-\mathrm{i}$.

  故选: C.
