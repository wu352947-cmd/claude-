stem: |-
  已知过点 $A(0,1)$ 且斜率为 $k$ 的直线 I 与圆 $C:(x-2)^{2}+(y-3$ )$^{2}=1$ 交于点 $M 、 N$ 两点.

  (1) 求 $\mathrm{k}$ 的取值范围;

  （2）若 $\overrightarrow{O M} \bullet \overrightarrow{O N}=12$, 其中 $O$ 为坐标原点, 求 $|M N|$.
