stem: 已知函数 $f(x)=\left\{\begin{array}{l}2^{x-1}-2, x \leqslant 1 \\ -\log _{2}(x+1), x>1\end{array}\right.$, 且 $f(a)=-3$, 则 $f(6-a$ )$=(\quad)$
options:
  A: $-\frac{7}{4}$
  B: $-\frac{5}{4}$
  C: $-\frac{3}{4}$
  D: $-\frac{1}{4}$
answer: A
solution: |-
  解: 由题意, $a \leqslant 1$ 时, $2^{\alpha-1}-2=-3$, 无解;

  $a>1$ 时, $-\log _{2}(a+1)=-3, \therefore \alpha=7$,

  $\therefore f(6-a)=f(-1)=2^{-1-1}-2=-\frac{7}{4}$.

  故选: A.
