stem: 已知集合 $A=\{x \mid-1<x<2\}, B=\{x \mid 0<x<3\}$, 则 $A \cup B=(\quad)$
options:
  A: $(-1,3)$
  B: $(-1,0)$
  C: $(0,2)$
  D: $(2,3)$
answer: A
solution: |-
  解: $\because A=\{x \mid-1<x<2\}, B=\{x \mid 0<x<3\}$,

  $\therefore A \cup B=\{x \mid-1<x<3\}$

  故选：A.
