stem: '已知椭圆 $E$ 的中心在坐标原点, 离心率为 $\frac{1}{2}, E$ 的右焦点与抛物线 $C$ : $y^{2}=8 x$ 的焦点重合, $A, B$ 是 $C$ 的准线与 $E$ 的两个交点, 则 $|A B|=(\quad)$'
options:
  A: '3'
  B: '6'
  C: '9'
  D: '12'
answer: B
solution: |-
  解：椭圆 $E$ 的中心在坐标原点, 离心率为 $\frac{1}{2}, \mathrm{E}$ 的右焦点 $(\mathrm{c}, 0)$ 与抛 物线 $C: y^{2}=8 x$ 的焦点 $(2,0)$ 重合，

  可得 $c=2, a=4, b^{2}=12$, 椭圆的标准方程为: $\frac{x^{2}}{16}+\frac{y^{2}}{12}=1$,

  抛物线的准线方程为: $x=-2$,

  由 $\left\{\begin{array}{l}x=-2 \\ \frac{x^{2}}{16}+\frac{y^{2}}{12}=1\end{array}\right.$, 解得 $y= \pm 3$, 所以 $A(-2,3), B(-2,-3)$.

  $|A B|=6$.

  故选: B.
