stem: |
  已知 $f(x)$ 是定义在 $\mathbf{R}$ 上的奇函数，当 $x>0$ 时，$f(x)=x^2-2x$，则 $f(-1)=$
options:
  A: '$-3$'
  B: '$-1$'
  C: '$1$'
  D: '$3$'
answer: C
solution: |
  $f(1)=1-2=-1$，由奇函数得 $f(-1)=-f(1)=1$，选 C。

  易错：直接把 $-1$ 代入 $x^2-2x$ 得 $3$（选 D），忽略了解析式只在 $x>0$ 时成立。
