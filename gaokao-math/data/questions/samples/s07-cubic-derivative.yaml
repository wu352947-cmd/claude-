type: multi
source: 示例题（原创）
kps: {deriv.extremum: 2, deriv.tangent: 1}
difficulty_label: 中档
stem: |
  已知函数 $f(x)=x^3-3x$，则
options:
  A: '$f(x)$ 有两个极值点'
  B: '$f(x)$ 的极小值为 $-2$'
  C: '$f(x)$ 在区间 $(-1,1)$ 上单调递增'
  D: '曲线 $y=f(x)$ 在点 $(0,0)$ 处的切线方程为 $y=3x$'
answer: [A, B]
solution: |
  $f'(x)=3x^2-3=3(x+1)(x-1)$。

  $x<-1$ 或 $x>1$ 时 $f'(x)>0$；$-1<x<1$ 时 $f'(x)<0$。所以 $f$ 在 $(-1,1)$ 上递减，C 错误；
  $x=-1$ 为极大值点、$x=1$ 为极小值点，A 正确；极小值 $f(1)=1-3=-2$，B 正确。

  D：$f'(0)=-3$，切线为 $y=-3x$，错误。

  故选 AB。
