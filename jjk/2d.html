<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07040a">
<title>咒术回战 · 领域展开</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2a3a;--ink:#07040a;--paper:#efe6d8}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:#eee}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#safe{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);pointer-events:none;visibility:hidden}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box;background:radial-gradient(ellipse at 50% 30%,rgba(120,0,16,.55),rgba(7,4,10,.96) 70%);z-index:5;overflow-y:auto;touch-action:pan-y}
.hidden{display:none!important}
.title{text-align:center;line-height:1}
.title .jp{font-family:"Ma Shan Zheng","STKaiti","KaiTi",serif;font-size:clamp(48px,13vw,96px);color:var(--paper);text-shadow:0 0 18px rgba(255,42,58,.7),3px 3px 0 #5a0008;letter-spacing:.06em}
.title .sub{margin-top:8px;font-size:clamp(13px,3.6vw,17px);letter-spacing:.5em;color:#ff8a94}
.chars{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:760px}
.card{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(20,10,16,.75);color:#eee;border-radius:14px;padding:12px 14px;width:min(220px,44vw);text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;font:inherit}
.card b{display:block;font-size:18px;margin-bottom:2px}
.card i{font-style:normal;font-size:12px;color:#bba}
.card .dom{margin-top:8px;font-family:"Ma Shan Zheng","STKaiti",serif;font-size:22px;color:#ff6a76}
.card .sk{font-size:12px;color:#998;margin-top:4px}
.card.sel{border-color:var(--red);background:rgba(90,0,12,.6);transform:translateY(-2px);box-shadow:0 0 0 2px rgba(255,42,58,.35),0 8px 30px rgba(255,42,58,.25)}
.card[data-c=gojo] .dom{color:#8fe3ff}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 40px;font:600 17px/1 inherit;letter-spacing:.3em;color:#fff;background:linear-gradient(180deg,#e0263a,#8a0c1a);box-shadow:0 6px 24px rgba(255,42,58,.4);cursor:pointer}

<body>
<canvas id="c"></canvas>
<div id="safe"></div>

<div id="menu" class="ov">
  <div class="title"><div class="jp">咒术回战</div><div class="sub">领域展开 · 开放世界</div></div>
  <div class="chars">
    <button class="card sel" data-c="sukuna"><b>两面宿傩</b><i>诅咒之王</i><div class="dom">伏魔御厨子</div><div class="sk">解 · 捌 · 开</div></button>
    <button class="card" data-c="gojo"><b>五条悟</b><i>最强咒术师 · 无下限常驻</i><div class="dom">无量空处</div><div class="sk">苍 · 赫 · 茈</div></button>
    <button class="card" data-c="itadori"><b>虎杖悠仁</b><i>宿傩容器 · 黑闪</i><div class="dom">黑闪乱舞</div><div class="sk">逕庭拳 · 飞踢 · 黑闪</div></button>
  </div>
  <button class="btn" id="start">进入世界</button>
  <div class="tips">左半屏拖动移动 · 右侧按键战斗 · 领域槽满后展开领域（开局已满）<br>祓除涩谷、森林、工厂的三只特级咒灵 · 被关进敌方领域时可用「简易领域」或展开领域对决<br>键盘：WASD 移动 · J 攻击 · K/L/I 术式 · 空格 闪避 · F 领域 · P 暂停</div>
  <div class="disc">同人非官方作品，仅供娱乐</div>
</div>

<div id="over" class="ov hidden">
  <h2 id="ovT">你被祓除了</h2>
  <p id="ovP"></p>
  <div class="row"><button class="btn" id="ovA">再来一次</button><button class="btn ghost" id="ovB">返回菜单</button></div>
</div>

<div id="pause" class="ov hidden">
  <h2 style="font-family:'Ma Shan Zheng',serif;font-size:56px;margin:0;color:#efe6d8">暂停</h2>
  <div class="row"><button class="btn" id="resume">继续</button><button class="btn ghost" id="toMenu">返回菜单</button></div>
</div>

<script>
'use strict';
// ================= utils =================
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }
const BRUSH = '"Ma Shan Zheng","STKaiti","KaiTi","Noto Serif SC","Songti SC",serif';
const SANS = '"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif';

// ================= canvas / layout =================
const cv = $('#c'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, BASEZOOM = 1, SAFE = { t: 0, r: 0, b: 0, l: 0 };
let btns = [], MM = 110;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  BASEZOOM = clamp(Math.min(VW, VH) / 640, 0.56, 1.15);
  const cs = getComputedStyle($('#safe'));
  SAFE = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  MM = clamp(Math.min(VW, VH) * 0.27, 84, 150);
  layoutButtons();
}
function layoutButtons() {
  const b = clamp(Math.min(VW, VH) * 0.095, 34, 52);
  const cx = VW - SAFE.r - 18 - b, cy = VH - SAFE.b - 18 - b;
  const P2 = (a, d) => [cx + Math.cos(a * Math.PI / 180) * d * b, cy + Math.sin(a * Math.PI / 180) * d * b];
  const mk = (id, [x, y], r) => ({ id, x, y, r, down: null, pt: 0 });
  btns = [
    mk('atk', [cx, cy], b),
    mk('s0', P2(180, 2.15), b * .68),
    mk('s1', P2(225, 2.15), b * .68),
    mk('s2', P2(270, 2.15), b * .68),
    mk('dash', P2(180, 4.0), b * .6),
    mk('dom', P2(235, 4.25), b * .92),
    mk('pause', [VW - SAFE.r - 12 - MM / 2, SAFE.t + 12 + MM + 24], 17),
  ];
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

// ================= audio =================
let AC = null, master = null, noiseBuf = null; const sfxLast = {};
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination); } catch (e) { AC = null; return; } }
  if (AC.state === 'suspended') AC.resume();
}
function getNoise() { if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return noiseBuf; }
function nz(dur, f, type, vol, q = 1, f2, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = getNoise(); s.loop = true;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;

}
function tn(f, f2, dur, vol, type = 'sine', delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);

const SFX_DEF = {
  slash: () => nz(.09, 4000, 'highpass', .22, .7, 9000),
  swing: () => nz(.08, 1200, 'bandpass', .14, 1.2, 3200),
  hit: () => { tn(170, 55, .12, .3); nz(.05, 900, 'lowpass', .18); },
  bf: () => { tn(90, 28, .55, .5, 'sawtooth'); nz(.35, 260, 'lowpass', .6); tn(1400, 90, .25, .12, 'square'); },
  boom: () => { nz(.8, 700, 'lowpass', .6, .7, 50); tn(70, 28, .7, .5); },
  hurt: () => tn(320, 110, .16, .18, 'square'),
  domain: () => { tn(55, 50, 3.4, .35, 'sawtooth'); tn(110, 100, 3.4, .14, 'triangle'); tn(880, 872, 2.6, .12, 'sine', .7); tn(1320, 1306, 2.2, .06, 'sine', .7); nz(2.6, 320, 'lowpass', .25, .5, 80); },
  edomain: () => { tn(48, 40, 2.2, .35, 'sawtooth'); nz(2, 200, 'lowpass', .3, .5, 60); },
  shatter: () => { for (let i = 0; i < 6; i++) tn(rnd(1500, 3200), rnd(400, 900), .45, .07, 'triangle', i * .035); nz(.6, 3000, 'highpass', .3); },
  pick: () => tn(700, 1150, .1, .1),
  level: () => { tn(500, 1000, .3, .14, 'triangle'); tn(750, 1500, .3, .1, 'triangle', .1); },
  blue: () => { tn(200, 600, .5, .15, 'sine'); nz(.5, 600, 'bandpass', .15, 3, 2000); },
  red: () => { tn(600, 120, .4, .2, 'sawtooth'); nz(.4, 1500, 'bandpass', .2, 2, 300); },
  purple: () => { tn(80, 40, 1.8, .4, 'sawtooth'); tn(160, 900, 1.2, .1, 'sine'); nz(1.8, 400, 'lowpass', .4, .5, 2000); },
  crumble: () => nz(.6, 400, 'lowpass', .35, .6, 80),
  fire: () => { nz(.9, 900, 'bandpass', .35, .8, 200); tn(200, 60, .8, .2, 'sawtooth'); },
  tap: () => tn(300, 600, .06, .12, 'square'),

function sfx(n, gap = .03) { if (!AC) return; const now = performance.now() / 1000; if (sfxLast[n] && now - sfxLast[n] < gap) return; sfxLast[n] = now; SFX_DEF[n](); }

// ================= world =================
const WORLD = 6400, CH = 400, NCH = WORLD / CH, CENTER = { x: 3200, y: 3200 };
const ZONES = {
  school: { name: '东京都立咒术高专', ground: '#25321f' },
  shibuya: { name: '涩谷', ground: '#23232a' },
  forest: { name: '深山森林', ground: '#1a2a1a' },
  factory: { name: '废弃工厂区', ground: '#332f2a' },
  town: { name: '旧住宅区', ground: '#2c2c26' },
};
const BOSS_DEF = [
  { type: 'jogo', name: '漏瑚', zone: '涩谷', x: 4850, y: 1450 },
  { type: 'hanami', name: '花御', zone: '深山森林', x: 1450, y: 4950 },
  { type: 'mahito', name: '真人', zone: '废弃工厂区', x: 4950, y: 4950 },
];
function zoneAt(x, y) {
  const dx = x - CENTER.x, dy = y - CENTER.y;
  if (dx * dx + dy * dy < 1000 * 1000) return 'school';
  if (dx >= 0 && dy < 0) return 'shibuya';
  if (dx < 0 && dy >= 0) return 'forest';
  if (dx >= 0 && dy >= 0) return 'factory';
  return 'town';
}
let chunks = [], allBuildings = [];
function genWorld() {
  const R = mulberry(20181031);
  const rr = (a, b) => a + R() * (b - a);
  chunks = []; allBuildings = [];
  const addB = (c, x, y, w, h, H, kind, wall, roof) => {
    const b = { x, y, w, h, H, kind, wall, roof, hp: kind === 'tower' ? 8 : 5, maxHp: 0, dead: false, cuts: [], seed: Math.floor(R() * 1e9), rub: null };
    b.maxHp = b.hp; c.b.push(b); allBuildings.push(b); return b;
  };
  const treeOk = (c, x, y, r) => !c.b.some(b => x > b.x - r && x < b.x + b.w + r && y > b.y - r - b.H && y < b.y + b.h + r);
  for (let cy = 0; cy < NCH; cy++) for (let cx = 0; cx < NCH; cx++) {
    const x0 = cx * CH, y0 = cy * CH, mx = x0 + CH / 2, my = y0 + CH / 2;
    const z = zoneAt(mx, my);
    const c = { zone: z, b: [], t: [], cx, cy };
    chunks.push(c);
    const nearSpawn = Math.hypot(mx - CENTER.x, my - CENTER.y) < 480;
    const nearBoss = BOSS_DEF.some(b => Math.hypot(mx - b.x, my - b.y) < 520);
    const road = z === 'shibuya' ? 70 : z === 'town' ? 50 : z === 'factory' ? 60 : 0;
    const ax = x0 + road + 14, ay = y0 + road + 14, aw = CH - road - 28, ah = CH - road - 28;
    if (z === 'shibuya' && !nearBoss) {
      const pal = ['#3b4150', '#454a58', '#2f3644', '#4a4048', '#3a4a52', '#50505a'];
      const split = R(), g = 16, H = () => rr(60, 140);
      const tower = (x, y, w, h) => { const col = pal[Math.floor(R() * pal.length)]; addB(c, x, y, w, h, H(), 'tower', col, shade(col, 18)); };
      if (split < .25) tower(ax, ay, aw, ah);
      else if (split < .5) { const s = rr(.35, .65) * aw; tower(ax, ay, s - g / 2, ah); tower(ax + s + g / 2, ay, aw - s - g / 2, ah); }
      else if (split < .75) { const s = rr(.35, .65) * ah; tower(ax, ay, aw, s - g / 2); tower(ax, ay + s + g / 2, aw, ah - s - g / 2); }
      else { const sx = aw / 2, sy = ah / 2; tower(ax, ay, sx - g / 2, sy - g / 2); tower(ax + sx + g / 2, ay, sx - g / 2, sy - g / 2); tower(ax, ay + sy + g / 2, sx - g / 2, sy - g / 2); tower(ax + sx + g / 2, ay + sy + g / 2, sx - g / 2, sy - g / 2); }
    } else if (z === 'town' && !nearBoss) {
      const roofs = ['#7a3b2e', '#4b5a6a', '#6a5a3a', '#3e4a3a', '#5a3a4a'];
      const n = rint(1, 3);
      for (let i = 0; i < n; i++) {
        const w = rr(90, 150), h = rr(80, 130); const x = rr(ax, ax + aw - w), y = rr(ay + 30, ay + ah - h);
        if (c.b.some(b => x < b.x + b.w + 12 && x + w + 12 > b.x && y < b.y + b.h + 12 && y + h + 12 > b.y)) continue;
        addB(c, x, y, w, h, rr(26, 40), 'house', '#8a8070', roofs[Math.floor(R() * roofs.length)]);
      }
      for (let i = 0; i < 5; i++) { const x = rr(ax, ax + aw), y = rr(ay, ay + ah), r = rr(14, 24); if (treeOk(c, x, y, r)) c.t.push({ x, y, r, col: R() < .5 ? '#2f5a2a' : '#3a6a30' }); }
    } else if (z === 'factory' && !nearBoss) {
      const w = rr(180, aw), h = rr(130, ah - 40);
      addB(c, ax + rr(0, aw - w), ay + rr(30, ah - h), w, h, rr(42, 60), 'ware', '#6a5f55', R() < .5 ? '#5a4a3e' : '#4a5258');
      const cols = ['#a0522d', '#2e5e8a', '#3d7a4a', '#8a7a2e'];
      for (let i = 0; i < 3; i++) {
        const cw = rr(60, 80), chh = 26, x = rr(x0 + road + 4, x0 + CH - cw - 4), y = rr(y0 + road + 4, y0 + CH - chh - 4);
        if (c.b.some(b => x < b.x + b.w + 8 && x + cw + 8 > b.x && y < b.y + b.h + 8 && y + chh + 8 > b.y + -b.H)) continue;
        const col = cols[Math.floor(R() * cols.length)]; addB(c, x, y, cw, chh, 22, 'box', shade(col, -20), col).hp = 2;
      }
    } else if (z === 'forest') {
      const n = nearBoss ? 2 : rint(12, 20);
      for (let i = 0; i < n; i++) { const x = rr(x0, x0 + CH), y = rr(y0, y0 + CH), r = rr(18, 34); if (nearBoss && Math.hypot(x - BOSS_DEF[1].x, y - BOSS_DEF[1].y) < 380) continue; c.t.push({ x, y, r, col: pick(['#1f4a22', '#24552a', '#2c5e2a', '#1a3f1e']) }); }
      if (!nearBoss && R() < .08) addB(c, rr(ax, ax + aw - 70), rr(ay + 40, ay + ah - 60), 70, 56, 30, 'shrine', '#7a1e18', '#2a2224');
    } else if (z === 'school') {
      if (!nearSpawn) {
        for (let i = 0; i < 8; i++) { const x = rr(x0, x0 + CH), y = rr(y0, y0 + CH), r = rr(18, 30); c.t.push({ x, y, r, col: pick(['#2f5a2a', '#3a6a30', '#4a6a2a']) }); }
        if (R() < .3) addB(c, rr(x0 + 40, x0 + CH - 180), rr(y0 + 60, y0 + CH - 140), rr(120, 160), rr(80, 100), 34, 'temple', '#6a3a22', '#2e2a2a');
      }
    }
  }
  // school main hall + torii-ish gate near the spawn
  const sc = chunkAt(CENTER.x, CENTER.y - 300);
  addB(sc, CENTER.x - 150, CENTER.y - 360, 300, 130, 46, 'temple', '#6a3a22', '#2e2a2a').hp = 12;
  for (let i = 0; i < 26; i++) { const a = i / 26 * TAU, r = rr(380, 470); const c = chunkAt(CENTER.x + Math.cos(a) * r, CENTER.y + Math.sin(a) * r); c.t.push({ x: CENTER.x + Math.cos(a) * r, y: CENTER.y + Math.sin(a) * r, r: rr(20, 30), col: pick(['#2f5a2a', '#3a6a30', '#7a4a5a']) }); }
  for (const c of chunks) c.t.sort((a, b) => a.y - b.y);
  buildMinimap();
}
function chunkAt(x, y) { const cx = clamp(Math.floor(x / CH), 0, NCH - 1), cy = clamp(Math.floor(y / CH), 0, NCH - 1); return chunks[cy * NCH + cx]; }
function shade(hex, amt) { const n = parseInt(hex.slice(1), 16); const r = clamp((n >> 16) + amt, 0, 255), g = clamp((n >> 8 & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255); return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1); }
function nearbyBuildings(x, y, fn) {
  const cx = Math.floor(x / CH), cy = Math.floor(y / CH);
  for (let j = cy - 1; j <= cy + 1; j++) for (let i = cx - 1; i <= cx + 1; i++) {
    if (i < 0 || j < 0 || i >= NCH || j >= NCH) continue;
    for (const b of chunks[j * NCH + i].b) if (!b.dead) fn(b);
  }
}
function collideWorld(e) {
  nearbyBuildings(e.x, e.y, b => {
    const nx = clamp(e.x, b.x, b.x + b.w), ny = clamp(e.y, b.y, b.y + b.h);
    const dx = e.x - nx, dy = e.y - ny, dd = dx * dx + dy * dy;

}
$('#start').addEventListener('click', startGame);
$('#ovA').addEventListener('click', startGame);
$('#ovB').addEventListener('click', toMenu);
$('#toMenu').addEventListener('click', toMenu);
$('#resume').addEventListener('click', () => togglePause());
function toMenu() { state = 'menu'; P = null; $('#over').classList.add('hidden'); $('#pause').classList.add('hidden'); $('#menu').classList.remove('hidden'); }
function togglePause() {
  if (state === 'play') { state = 'pause'; $('#pause').classList.remove('hidden'); atkHeld = false; stick.id = null; stick.dx = stick.dy = 0; }
  else if (state === 'pause') { state = 'play'; last = performance.now(); $('#pause').classList.add('hidden'); }
}
function gameOver(win) {
  if (state !== 'play') return;
  state = 'over';
  setTimeout(() => {
    $('#ovT').textContent = win ? '祓除完成' : '你被祓除了';
    $('#ovP').innerHTML = win ? `三只特级咒灵已被祓除。<br>等级 Lv.${P.lvl} · 共祓除咒灵 ${kills} 只` : `等级 Lv.${P.lvl} · 祓除咒灵 ${kills} 只 · 特级 ${bossesDown}/${BOSS_DEF.length}<br>提示：被关进敌方领域时，用「简易领域」减伤，或领域槽满时展开领域对决`;
    $('#over').classList.remove('hidden');
  }, win ? 200 : 900);
}

// debug hooks for automated testing
window.__jjk = { get P() { return P; }, get enemies() { return enemies; }, get pDom() { return pDom; }, get eDom() { return eDom; }, get state() { return state; }, domainBtn, useSkill, castEDomain: () => { const b = enemies.find(e => e.boss); b.x = P.x + 200; b.y = P.y; castEDomain(b); } };

resize();
requestAnimationFrame(frame);
</script>
